<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="一幅用 Canvas 现场绘制的小鸟图画：枝头蓝翅膀小鸟，四个时段（清晨 / 正午 / 黄昏 / 星夜），可保存 PNG，完全离线。">
<title>枝头小鸟 · A Picture of a Bird</title>
<style>
:root{
  --ink:#1e2b3a; --muted:#5d6f82; --paper:#f2f5f9; --card:#ffffff;
  --line:rgba(60,90,120,.20); --accent:#2f6fa8; --chip:#e8eef5;
  --shadow:0 14px 34px rgba(30,50,80,.14);
}
[data-theme="dark"]{
  --ink:#e6eef8; --muted:#9db0c6; --paper:#0e1524; --card:#151d30;
  --line:rgba(150,180,215,.24); --accent:#6ab0ea; --chip:#1c2740;
  --shadow:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px 16px 40px; transition:background .25s,color .25s;
}
.wrap{max-width:1204px;margin:0 auto}
header h1{margin:0;font-size:clamp(21px,3.4vw,30px);letter-spacing:.5px}
header h1 .en{font-weight:500;color:var(--muted);font-size:.62em;margin-left:8px}
header .sub{margin:6px 0 16px;color:var(--muted)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:10px;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:8px;background:#0b1220}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp .lbl{color:var(--muted);font-size:13px;margin-right:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:7px 13px;transition:transform .08s,background .2s,border-color .2s}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type="number"]{font:inherit;width:92px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-family:inherit;font-size:12px}
.meta{color:var(--muted);font-size:13px;margin:10px 0 0}
#selftest{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);font-size:13px;line-height:1.7}
#selftest h2{margin:0 0 6px;font-size:15px}
#selftest .ok{color:#2e8b57}#selftest .bad{color:#c0392b}
[data-theme="dark"] #selftest .ok{color:#6fd39b}
[data-theme="dark"] #selftest .bad{color:#ff8a7a}
[data-ui="off"]{padding:0;background:#000}
[data-ui="off"] .wrap{max-width:none;margin:0}
[data-ui="off"] header,[data-ui="off"] .bar,[data-ui="off"] .hint,[data-ui="off"] .meta{display:none}
[data-ui="off"] .stage{padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
[data-ui="off"] canvas{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;object-fit:cover}
@media (max-width:700px){
  body{padding:12px 10px 28px}
  .stage{padding:6px;border-radius:10px}
  button{padding:6px 11px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>枝头小鸟<span class="en">A Picture of a Bird</span></h1>
    <p class="sub">一幅画，全部由 Canvas 现场绘制（天空、山、水、树枝、鸟、花瓣），没有使用任何图片素材 · drawn live, no image files</p>
  </header>

  <div class="stage">
    <canvas id="art" width="1200" height="800" role="img"
      aria-label="一只蓝翅膀小鸟停在树枝上的图画：远山、水潭、飘着花瓣，四个时段可切换"></canvas>
  </div>

  <div class="bar">
    <div class="grp" id="presets">
      <span class="lbl">时段</span>
      <button data-preset="dawn" aria-pressed="true">🌅 清晨</button>
      <button data-preset="noon" aria-pressed="false">☀️ 正午</button>
      <button data-preset="dusk" aria-pressed="false">🌇 黄昏</button>
      <button data-preset="night" aria-pressed="false">🌙 星夜</button>
    </div>
    <div class="grp">
      <span class="lbl">构图</span>
      <button id="redraw">🎲 重画</button>
      <input id="seed" type="number" min="1" max="99999" step="1" aria-label="随机种子 seed">
    </div>
    <div class="grp">
      <button id="motion" aria-pressed="true">🕊 动起来</button>
      <button id="theme">🌗 深色</button>
      <button id="save">💾 保存 PNG</button>
    </div>
  </div>

  <p class="hint">
    <kbd>1</kbd>–<kbd>4</kbd> 换时段 · <kbd>R</kbd> 重画 · <kbd>M</kbd> 动/静 · <kbd>T</kbd> 深浅色 · <kbd>S</kbd> 保存 PNG
  </p>
  <p class="meta" id="meta"></p>

  <section id="selftest" hidden><h2>自检 Self-test</h2><div id="stlist"></div></section>
</div>

<script>
(function(){
'use strict';

/* ---------- 画布尺寸 / 参数 ---------- */
var W = 1200, H = 800;                      // 逻辑绘制空间：3:2 的画纸
var canvas = document.getElementById('art');
var ctx = canvas.getContext('2d');
var params = new URLSearchParams(location.search);

function num(name, dflt){
  var v = parseFloat(params.get(name));
  return isFinite(v) ? v : dflt;
}
var clamp = function(v,a,b){ return v < a ? a : v > b ? b : v; };

/* ---------- 调色板：四个时段 ---------- */
var KEYS = ['skyTop','skyMid','skyBot','sun','glow','sunX','sunY','sunR',
  'hillFar','hillMid','treeLine','grassFar','grassNear','water','ripple',
  'branch','bark','leaf','leafDark','back','wing','wingEdge','belly','head',
  'crest','beak','eyeRing','eye','legs','petal','shadow','geese','stars','moon'];

var PRESETS = {
  dawn: { skyTop:'#4a6f9e', skyMid:'#9dbdd9', skyBot:'#f8d49c', sun:'#ffeab4',
    glow:'rgba(255,214,140,.55)', sunX:268, sunY:300, sunR:46,
    hillFar:'#8fb0c6', hillMid:'#6f9d88', treeLine:'#4c7a67', grassFar:'#83b276',
    grassNear:'#5a8f5c', water:'#a9cfe0', ripple:'rgba(255,255,255,.55)',
    branch:'#6b4a33', bark:'#46311f', leaf:'#5f9a5f', leafDark:'#3c7346',
    back:'#3f7cb8', wing:'#2e5e95', wingEdge:'#9ccbea', belly:'#f4e8ca',
    head:'#356fa8', crest:'#2a5788', beak:'#e8a33a', eyeRing:'#f6ecd2',
    eye:'#17222e', legs:'#c98a3c', petal:'#f7c9d8', shadow:'rgba(30,50,40,.22)',
    geese:1, stars:0, moon:0 },
  noon: { skyTop:'#2f7ec2', skyMid:'#86cdee', skyBot:'#dff2f8', sun:'#fff7d2',
    glow:'rgba(255,242,190,.42)', sunX:930, sunY:136, sunR:40,
    hillFar:'#9dc3cf', hillMid:'#66a37f', treeLine:'#3f7d5c', grassFar:'#8fc47b',
    grassNear:'#5f9c58', water:'#8fd2ea', ripple:'rgba(255,255,255,.7)',
    branch:'#7a5638', bark:'#4f3722', leaf:'#6fae62', leafDark:'#3f7f45',
    back:'#2f83c9', wing:'#2162a0', wingEdge:'#a8d8f4', belly:'#fdf4d8',
    head:'#2a76b8', crest:'#1f5c94', beak:'#f0ad3a', eyeRing:'#fdf1d2',
    eye:'#141e28', legs:'#d29540', petal:'#fff0a8', shadow:'rgba(20,40,30,.26)',
    geese:0, stars:0, moon:0 },
  dusk: { skyTop:'#48396f', skyMid:'#c56a5c', skyBot:'#f6ac67', sun:'#ffd28c',
    glow:'rgba(255,168,96,.5)', sunX:236, sunY:474, sunR:52,
    hillFar:'#7a5f86', hillMid:'#5c4d6b', treeLine:'#3d3450', grassFar:'#7a5f57',
    grassNear:'#4e3f45', water:'#b47a6d', ripple:'rgba(255,214,170,.6)',
    branch:'#4a3340', bark:'#31202b', leaf:'#6b5257', leafDark:'#43333f',
    back:'#3a4f7e', wing:'#2a3a63', wingEdge:'#8a7fae', belly:'#e8cfae',
    head:'#33487a', crest:'#25386a', beak:'#d98b3a', eyeRing:'#efdcb8',
    eye:'#120f1a', legs:'#a8703a', petal:'#e8a8bd', shadow:'rgba(20,14,26,.3)',
    geese:1, stars:0, moon:0 },
  night: { skyTop:'#08102c', skyMid:'#142450', skyBot:'#28386a', sun:'#e6eeff',
    glow:'rgba(170,200,255,.28)', sunX:912, sunY:158, sunR:36,
    hillFar:'#2b3d5e', hillMid:'#1b2a44', treeLine:'#141f33', grassFar:'#1d2c3f',
    grassNear:'#152232', water:'#22365a', ripple:'rgba(180,210,255,.35)',
    branch:'#2a2436', bark:'#181422', leaf:'#2c3b4c', leafDark:'#1b2836',
    back:'#2a4a74', wing:'#1c3357', wingEdge:'#6f8fbf', belly:'#c9c6b4',
    head:'#26456d', crest:'#1a3557', beak:'#b98434', eyeRing:'#d8d2b8',
    eye:'#0b1018', legs:'#7f6030', petal:'#9fb6d8', shadow:'rgba(0,0,0,.4)',
    geese:0, stars:130, moon:1 }
};

var PALETTE_KEYS = KEYS.slice();

/* ---------- 确定性随机（同一 seed 画同一张画） ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 状态 ---------- */
var state = {
  preset: 'dawn',
  seed: Math.round(clamp(num('seed', 7), 1, 99999)),
  t: 0,
  motion: params.get('motion') !== 'off',
  freeze: params.get('freeze') === '1',
  sig: params.get('sig') !== '0',
  theme: params.get('theme') === 'dark' ? 'dark' : 'light'
};
if(!PRESETS[state.preset]) state.preset = 'dawn';
if(params.get('preset') && PRESETS[params.get('preset')]) state.preset = params.get('preset');

/* ---------- 画面常量：树干、树枝中心线、水潭 ---------- */
/* 树干：从画面左下长出，向上出画；主枝从其右侧 432 高处伸出 */
var TRUNK = { baseX:110, topX:150, topY:150, wBase:126, wTop:52, joinY:432 };
/* 树枝中心线：二次贝塞尔，从树干右侧伸出，向右下伸展并收尖 */
var BR = { p0:{x:150,y:432}, c:{x:640,y:366}, p1:{x:1180,y:520} };
var POND = { x:640, y:702, rx:214, ry:52 };
function bezierPoint(t){
  var u = 1 - t;
  return {
    x: u*u*BR.p0.x + 2*u*t*BR.c.x + t*t*BR.p1.x,
    y: u*u*BR.p0.y + 2*u*t*BR.c.y + t*t*BR.p1.y
  };
}
function bezierAngle(t){
  var u = 1 - t;
  var dx = 2*u*(BR.c.x - BR.p0.x) + 2*t*(BR.p1.x - BR.c.x);
  var dy = 2*u*(BR.c.y - BR.p0.y) + 2*t*(BR.p1.y - BR.c.y);
  return Math.atan2(dy, dx);
}
/* 给定 x，反求 t（x 单调） */
function tAtX(x){
  var lo = 0, hi = 1, mid, i;
  for(i = 0; i < 28; i++){
    mid = (lo + hi) / 2;
    if(bezierPoint(mid).x < x) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function branchY(x){ return bezierPoint(tAtX(clamp(x, BR.p0.x, BR.p1.x))).y; }

/* ---------- 小鸟几何（局部坐标：原点=爪抓点，向左看） ---------- */
var BIRD = {
  body:{x:-8, y:-72, rx:57, ry:45, rot:-0.24},
  head:{x:-56, y:-114, r:31},
  beakTip:{x:-112, y:-110},
  tail:[{x:104,y:-104,a:-0.42},{x:112,y:-84,a:-0.16},{x:108,y:-64,a:0.06}],
  eye:{x:-66, y:-120, r:5.4},
  bbox:{x:-118, y:-150, w:232, h:156}   // 相对爪抓点
};

/* ---------- 场景元素（seed 决定，逐帧不变） ---------- */
function buildScene(seed){
  var rnd = mulberry32(seed * 2654435761 >>> 0);
  var s = { seed: seed, clouds:[], hills:[], trees:[], tufts:[], petals:[],
            leaves:[], stars:[], specks:[] };
  var i;
  for(i = 0; i < 6; i++){
    s.clouds.push({ x: rnd()*W, y: 90 + rnd()*180, sc: 0.7 + rnd()*0.9,
                    sp: 3 + rnd()*7, op: 0.5 + rnd()*0.4 });
  }
  for(i = 0; i < 46; i++){
    var gy = 600 + rnd()*172, gx = rnd()*W;
    var inPond = Math.pow((gx - POND.x)/POND.rx, 2) + Math.pow((gy - POND.y)/POND.ry, 2) < 1.08;
    var inTrunk = gx > TRUNK.baseX - TRUNK.wBase*0.8 && gx < TRUNK.baseX + TRUNK.wBase*0.8;
    if(inPond || inTrunk) continue;                       // 不长在水里和树干上
    s.tufts.push({ x: gx, y: gy, h: 14 + rnd()*30,
                   lean: (rnd()-0.5)*0.7, w: 1.6 + rnd()*1.6 });
  }
  for(i = 0; i < 30; i++){
    s.petals.push({ x: rnd()*W, y: rnd()*H, r: 3 + rnd()*4.5,
                    dx: 6 + rnd()*16, dy: 10 + rnd()*22, ph: rnd()*6.283,
                    sw: 0.6 + rnd()*1.2 });
  }
  for(i = 0; i < 150; i++){
    s.stars.push({ x: rnd()*W, y: rnd()*440, r: 0.6 + rnd()*1.5, ph: rnd()*6.283 });
  }
  /* 枝头叶片：紧贴树枝中心线，带短叶柄 */
  for(i = 0; i < 30; i++){
    var t = 0.04 + rnd()*0.9;
    var p = bezierPoint(t);
    var side = rnd() < 0.72 ? -1 : 1;              // 多数在枝上方
    var off = 6 + rnd()*20;                        // 离中心线的距离
    s.leaves.push({ x: p.x + (rnd()-0.5)*14, y: p.y + side*off,
                    stemY: p.y, r: 8 + rnd()*10, a: rnd()*6.283,
                    tone: rnd(), side: side });
  }
  /* 远景树线：站在远草坡上，小而不抢戏 */
  for(i = 0; i < 22; i++){
    s.trees.push({ x: rnd()*W, y: 578 + rnd()*14, w: 9 + rnd()*13, h: 18 + rnd()*22 });
  }
  /* 水潭高光点 */
  for(i = 0; i < 22; i++){
    s.specks.push({ x: POND.x - POND.rx*0.7 + rnd()*POND.rx*1.4,
                    y: POND.y - POND.ry*0.55 + rnd()*POND.ry*1.1,
                    w: 10 + rnd()*44 });
  }
  return s;
}
var scene = buildScene(state.seed);

/* ---------- 小工具 ---------- */
function lerp(a,b,k){ return a + (b - a) * k; }
function hexRGB(h){
  h = String(h).replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function ellipse(cx, cy, rx, ry, rot){
  ctx.beginPath();
  ctx.ellipse(cx, cy, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2);
}
function softShadow(blur, color, offy){
  ctx.shadowBlur = blur; ctx.shadowColor = color; ctx.shadowOffsetY = offy || 0;
}
function noShadow(){ ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.shadowOffsetY = 0; }

/* ---------- 各图层 ---------- */
function drawSky(P){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.skyTop);
  g.addColorStop(0.52, P.skyMid);
  g.addColorStop(1, P.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawStars(P, t){
  if(!P.stars) return;
  ctx.save();
  ctx.fillStyle = '#f4f7ff';
  for(var i = 0; i < scene.stars.length && i < P.stars; i++){
    var st = scene.stars[i];
    var tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.9 + st.ph));
    ctx.globalAlpha = tw * 0.9;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function drawSun(P){
  var x = P.sunX, y = P.sunY, r = P.sunR;
  if(P.moon){
    /* 弯月：先画满圆，再用天空渐变色挖掉一侧；光晕最后叠加，避免挖出暗盘 */
    ctx.fillStyle = P.sun;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    var sg = ctx.createLinearGradient(0, 0, 0, H);
    sg.addColorStop(0, P.skyTop);
    sg.addColorStop(0.52, P.skyMid);
    sg.addColorStop(1, P.skyBot);
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(x - r * 0.52, y - r * 0.3, r * 0.94, 0, 6.283); ctx.fill();
  } else {
    var g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 5.2);
    g.addColorStop(0, P.glow);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 5.2, 0, 6.283); ctx.fill();
    ctx.fillStyle = P.sun;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
  if(P.moon){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var mg = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 4.4);
    mg.addColorStop(0, P.glow);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(x, y, r * 4.4, 0, 6.283); ctx.fill();
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.32)';
  ctx.lineWidth = 2;
  for(var i = 0; i < 10; i++){
    var a = i * Math.PI / 5 + 0.12;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * (r + 12), y + Math.sin(a) * (r + 12));
    ctx.lineTo(x + Math.cos(a) * (r + 30), y + Math.sin(a) * (r + 30));
    ctx.stroke();
  }
  ctx.restore();
}

function drawClouds(P, t){
  ctx.save();
  for(var i = 0; i < scene.clouds.length; i++){
    var c = scene.clouds[i];
    var x = ((c.x + t * c.sp) % (W + 340)) - 170;
    ctx.globalAlpha = c.op * (P.moon ? 0.35 : 0.8);
    ctx.fillStyle = i % 2 ? P.skyBot : '#ffffff';
    puff(x, c.y, c.sc);
  }
  ctx.restore();
}
function puff(x, y, sc){
  var puffs = [[0,0,34],[30,-10,26],[-30,4,24],[58,6,18],[-56,10,16]];
  ctx.beginPath();
  for(var i = 0; i < puffs.length; i++){
    ctx.moveTo(x + puffs[i][0] * sc + puffs[i][2] * sc, y + puffs[i][1] * sc);
    ctx.arc(x + puffs[i][0] * sc, y + puffs[i][1] * sc, puffs[i][2] * sc, 0, 6.283);
  }
  ctx.fill();
}

function ridge(baseY, amp, freq, phase, color, t){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, baseY);
  for(var x = 0; x <= W; x += 8){
    var y = baseY
      - Math.sin(x * freq + phase) * amp
      - Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.34;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}

function drawHills(P){
  ridge(520, 34, 0.0042, 0.6, P.hillFar);
  ridge(560, 26, 0.0061, 2.1, P.hillMid);
  ctx.save();
  ctx.fillStyle = P.treeLine;
  for(var i = 0; i < scene.trees.length; i++){
    var tr = scene.trees[i];
    ctx.beginPath();
    ctx.moveTo(tr.x - tr.w / 2, tr.y);
    ctx.lineTo(tr.x, tr.y - tr.h);
    ctx.lineTo(tr.x + tr.w / 2, tr.y);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ridge(596, 16, 0.0072, 4.4, P.grassFar);
}

function drawMeadow(P){
  var g = ctx.createLinearGradient(0, 590, 0, H);
  g.addColorStop(0, P.grassFar);
  g.addColorStop(1, P.grassNear);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 604);
  for(var x = 0; x <= W; x += 10){
    ctx.lineTo(x, 604 + Math.sin(x * 0.0075 + 1.2) * 9 + Math.sin(x * 0.021) * 4);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
}

function drawPond(P, t){
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(POND.x, POND.y, POND.rx, POND.ry, -0.04, 0, 6.283);
  ctx.clip();
  var g = ctx.createLinearGradient(0, POND.y - 56, 0, POND.y + 56);
  g.addColorStop(0, P.skyMid);
  g.addColorStop(0.5, P.water);
  g.addColorStop(1, P.grassNear);
  ctx.fillStyle = g;
  ctx.fillRect(POND.x - POND.rx, POND.y - POND.ry, POND.rx * 2, POND.ry * 2);
  ctx.strokeStyle = P.ripple;
  ctx.lineWidth = 2;
  for(var i = 0; i < scene.specks.length; i++){
    var sp = scene.specks[i];
    var k = (t * 0.35 + i * 0.37) % 1;
    ctx.globalAlpha = 0.5 * (1 - k);
    ctx.beginPath();
    ctx.moveTo(sp.x - sp.w / 2 + k * 6, sp.y);
    ctx.lineTo(sp.x + sp.w / 2 + k * 6, sp.y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGrass(P){
  ctx.save();
  ctx.lineCap = 'round';
  for(var i = 0; i < scene.tufts.length; i++){
    var g = scene.tufts[i];
    ctx.strokeStyle = i % 3 === 0 ? P.leafDark : P.grassNear;
    ctx.lineWidth = g.w;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x + g.lean * 8, g.y - g.h * 0.6, g.x + g.lean * 20, g.y - g.h);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGeese(P, t){
  if(!P.geese) return;
  ctx.save();
  ctx.strokeStyle = P.shadow;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  var drift = (t * 7) % (W + 300);
  for(var i = 0; i < 5; i++){
    var x = 150 + drift * 0.25 - i * 46 - (i % 2) * 12;
    var y = 208 + i * 17 + Math.sin(t * 1.1 + i) * 4;
    var flap = Math.sin(t * 5 + i * 0.8) * 3;
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 5 - flap);
    ctx.quadraticCurveTo(x, y + 3, x + 11, y - 5 - flap);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 树干、树枝与叶片 ---------- */
function drawTrunk(P){
  var T = TRUNK;
  ctx.save();
  var g = ctx.createLinearGradient(T.baseX - T.wBase/2, 0, T.baseX + T.wBase/2, 0);
  g.addColorStop(0, P.bark);
  g.addColorStop(0.42, P.branch);
  g.addColorStop(1, P.bark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(T.baseX - T.wBase/2, H + 4);
  ctx.bezierCurveTo(T.baseX - T.wBase*0.40, H*0.66, T.topX - T.wTop*0.9, H*0.30, T.topX - T.wTop/2, -20);
  ctx.lineTo(T.topX + T.wTop/2, -20);
  ctx.bezierCurveTo(T.topX + T.wTop*0.95, H*0.32, T.baseX + T.wBase*0.44, H*0.68, T.baseX + T.wBase/2, H + 4);
  ctx.closePath();
  ctx.fill();
  /* 树皮纹理：顺着树干走向的弧线 */
  ctx.strokeStyle = P.bark;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  for(var i = 0; i < 6; i++){
    var fx = T.baseX - T.wBase*0.32 + i * (T.wBase*0.64/5);
    ctx.beginPath();
    ctx.moveTo(fx, H - 10);
    ctx.bezierCurveTo(fx + 5, H*0.68, T.topX - T.wTop*0.3 + i*4, H*0.34, T.topX + i*3, 20);
    ctx.stroke();
  }
  /* 树根 */
  ctx.globalAlpha = 1;
  ctx.fillStyle = P.bark;
  var roots = [[-1,26],[1,22]];
  for(var r = 0; r < roots.length; r++){
    var dir = roots[r][0], w = roots[r][1];
    ctx.beginPath();
    ctx.moveTo(T.baseX + dir * T.wBase*0.34, H - 46);
    ctx.quadraticCurveTo(T.baseX + dir * (T.wBase*0.5 + w), H - 18,
                         T.baseX + dir * (T.wBase*0.5 + w + 14), H + 2);
    ctx.lineTo(T.baseX + dir * (T.wBase*0.30), H + 2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawBranch(P, t){
  /* 主枝：从粗到细收成尖头（先画枝，再画贴枝的叶） */
  ctx.save();
  ctx.fillStyle = P.branch;
  var steps = 80, up = [], dn = [];
  for(var k = 0; k <= steps; k++){
    var tt = k / steps;
    var p = bezierPoint(tt);
    var a = bezierAngle(tt);
    var wdt = lerp(19, 0, Math.pow(tt, 0.72)) / 2;      // 右端收尖
    var nx = -Math.sin(a), ny = Math.cos(a);
    up.push([p.x + nx * wdt, p.y + ny * wdt]);
    dn.push([p.x - nx * wdt, p.y - ny * wdt]);
  }
  ctx.beginPath();
  ctx.moveTo(up[0][0], up[0][1]);
  for(var u = 1; u <= steps; u++) ctx.lineTo(up[u][0], up[u][1]);
  for(var d = steps; d >= 0; d--) ctx.lineTo(dn[d][0], dn[d][1]);
  ctx.closePath();
  ctx.fill();
  /* 枝上高光与树皮纹 */
  ctx.strokeStyle = P.bark;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  for(var j = 0; j < 20; j++){
    var tj = 0.05 + (j / 20) * 0.8;
    var pj = bezierPoint(tj);
    var wj = lerp(17, 2, Math.pow(tj, 0.72)) / 2;
    ctx.beginPath();
    ctx.moveTo(pj.x - 5, pj.y - wj * 0.55);
    ctx.lineTo(pj.x + 9, pj.y - wj * 0.2);
    ctx.stroke();
  }
  /* 小短枝：从主枝斜向上/下伸出，末端收尖 */
  ctx.globalAlpha = 1;
  var twigs = [[0.22,-0.8,40],[0.5,-1.0,46],[0.74,-0.55,30],[0.38,0.85,26]];
  for(var m = 0; m < twigs.length; m++){
    var tp = bezierPoint(twigs[m][0]);
    var ta = bezierAngle(twigs[m][0]);
    var ang = ta + twigs[m][1] + Math.sin(t * 0.9 + m) * 0.02;
    var len = twigs[m][2];
    var w0 = 5, w1 = 0.4;
    ctx.beginPath();
    ctx.moveTo(tp.x - Math.sin(ang) * w0, tp.y + Math.cos(ang) * w0);
    ctx.quadraticCurveTo(
      tp.x + Math.cos(ang) * len * 0.55 - Math.sin(ang) * w1,
      tp.y + Math.sin(ang) * len * 0.55 + Math.cos(ang) * w1,
      tp.x + Math.cos(ang) * len, tp.y + Math.sin(ang) * len);
    ctx.quadraticCurveTo(
      tp.x + Math.cos(ang) * len * 0.55 + Math.sin(ang) * w1,
      tp.y + Math.sin(ang) * len * 0.55 - Math.cos(ang) * w1,
      tp.x + Math.sin(ang) * w0, tp.y - Math.cos(ang) * w0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 叶片：沿枝的法线方向长出，短叶柄 + 长椭圆叶 */
  ctx.save();
  for(var i = 0; i < scene.leaves.length; i++){
    var l = scene.leaves[i];
    var ta2 = bezierAngle(tAtX(l.x));
    var nx2 = -Math.sin(ta2), ny2 = Math.cos(ta2);          // 法线
    if(l.side < 0 && ny2 > 0){ nx2 = -nx2; ny2 = -ny2; }     // 上方叶取向上的法线
    if(l.side > 0 && ny2 < 0){ nx2 = -nx2; ny2 = -ny2; }
    var sway = Math.sin(t * 1.2 + l.x * 0.012) * 0.06;
    var ca = Math.cos(sway), sa = Math.sin(sway);
    var dx = nx2 * ca - ny2 * sa, dy = nx2 * sa + ny2 * ca;   // 轻微摆动后的方向
    var half = lerp(19, 2, Math.pow(tAtX(l.x), 0.72)) / 2;
    var sx = l.x + dx * half * 0.6, sy = l.stemY + dy * half * 0.6;
    var ex = sx + dx * l.r * 1.5, ey = sy + dy * l.r * 1.5;
    ctx.strokeStyle = P.leafDark;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    var midx = (sx + ex) / 2, midy = (sy + ey) / 2;
    ctx.save();
    ctx.translate(midx, midy);
    ctx.rotate(Math.atan2(dy, dx) + Math.PI / 2);
    ctx.fillStyle = l.tone > 0.55 ? P.leaf : P.leafDark;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.r * 0.34, l.r * 0.72, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- 小鸟 ---------- */
function birdPose(t){
  return {
    bob: Math.sin(t * 1.7) * 2.4,
    tilt: Math.sin(t * 0.85) * 0.028,
    tail: Math.sin(t * 3.1) * 0.05 + Math.sin(t * 0.7) * 0.02,
    /* 眨眼：每 4.1 秒闭一次，0.14 秒 */
    blink: ((t % 4.1) < 0.14) ? 1 : 0,
    breath: 1 + Math.sin(t * 1.7 + 0.4) * 0.012,
    hop: Math.max(0, Math.sin(t * 0.31 - 1.2)) > 0.997 ? 1 : 0
  };
}

function drawBird(P, t){
  var gripX = 640;
  var gripY = branchY(gripX) - 1;
  var pose = birdPose(t);

  ctx.save();
  ctx.translate(gripX, gripY + pose.bob);
  ctx.rotate(pose.tilt);

  /* 落在枝上的影子 */
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = P.shadow;
  ellipse(4, 4, 42, 9, 0); ctx.fill();
  ctx.restore();

  /* 尾羽：三片 */
  ctx.save();
  ctx.rotate(pose.tail);
  for(var i = 0; i < BIRD.tail.length; i++){
    var tf = BIRD.tail[i];
    ctx.fillStyle = i === 1 ? P.wing : P.back;
    ctx.beginPath();
    ctx.moveTo(24, -66);
    ctx.quadraticCurveTo(66, tf.y - 10, tf.x, tf.y);
    ctx.quadraticCurveTo(70, tf.y + 12, 26, -54);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = P.wingEdge;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(30, -60);
    ctx.quadraticCurveTo(68, tf.y - 4, tf.x - 4, tf.y + 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* 腿与爪（画在身体后面，爪尖画到枝上） */
  ctx.save();
  ctx.strokeStyle = P.legs;
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  var legs = [[-6, -34, -8, -4],[12, -33, 14, -4]];
  for(var L = 0; L < legs.length; L++){
    var lg = legs[L];
    ctx.beginPath();
    ctx.moveTo(lg[0], lg[1]);
    ctx.lineTo(lg[2], lg[3]);
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(lg[2], lg[3]);
    ctx.quadraticCurveTo(lg[2] - 7, lg[3] + 6, lg[2] - 13, lg[3] + 4);
    ctx.moveTo(lg[2], lg[3]);
    ctx.quadraticCurveTo(lg[2] + 7, lg[3] + 6, lg[2] + 12, lg[3] + 5);
    ctx.stroke();
    ctx.lineWidth = 4.2;
  }
  ctx.restore();

  /* 身体 */
  var b = BIRD.body;
  ctx.save();
  softShadow(18, 'rgba(0,0,0,.18)', 6);
  var bg = ctx.createLinearGradient(b.x, b.y - b.ry, b.x + 20, b.y + b.ry);
  bg.addColorStop(0, P.back);
  bg.addColorStop(1, P.wing);
  ctx.fillStyle = bg;
  ellipse(b.x, b.y * pose.breath, b.rx, b.ry, b.rot);
  ctx.fill();
  noShadow();
  ctx.restore();

  /* 腹部浅色 */
  ctx.save();
  ctx.fillStyle = P.belly;
  ctx.globalAlpha = 0.92;
  ellipse(-22, -52, 33, 25, -0.3);
  ctx.fill();
  ctx.restore();

  /* 翅膀：叶片形 + 羽轴与飞羽 */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-16, -100);
  ctx.bezierCurveTo(28, -104, 56, -78, 62, -46);
  ctx.bezierCurveTo(40, -40, 4, -56, -18, -78);
  ctx.closePath();
  var wg = ctx.createLinearGradient(-16, -100, 62, -46);
  wg.addColorStop(0, P.wing);
  wg.addColorStop(1, P.back);
  ctx.fillStyle = wg;
  ctx.fill();
  ctx.strokeStyle = P.wingEdge;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.85;
  for(var f = 0; f < 5; f++){
    var k = f / 4;
    ctx.beginPath();
    ctx.moveTo(-8 + k * 10, -96 + k * 6);
    ctx.quadraticCurveTo(28 + k * 8, -80 + k * 8, 56 - k * 6, -50 + k * 6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 背部羽毛层次 */
  ctx.save();
  ctx.strokeStyle = P.crest;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 2;
  for(var s = 0; s < 4; s++){
    ctx.beginPath();
    ctx.arc(-30 + s * 18, -96 + s * 3, 13, 0.2, 2.4);
    ctx.stroke();
  }
  ctx.restore();

  /* 头 */
  var hd = BIRD.head;
  ctx.save();
  var hg = ctx.createRadialGradient(hd.x - 8, hd.y - 10, 4, hd.x, hd.y, hd.r * 1.6);
  hg.addColorStop(0, P.head);
  hg.addColorStop(1, P.crest);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(hd.x - hd.r * 0.9, hd.y + hd.r * 0.55);
  ctx.arc(hd.x, hd.y, hd.r, Math.PI * 0.75, Math.PI * 2.3);
  ctx.quadraticCurveTo(hd.x + hd.r * 0.9, hd.y + hd.r * 0.8, hd.x - hd.r * 0.4, hd.y + hd.r * 0.95);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* 头顶小冠羽 */
  ctx.save();
  ctx.fillStyle = P.crest;
  for(var c = 0; c < 3; c++){
    ctx.beginPath();
    ctx.moveTo(hd.x - 4 + c * 8, hd.y - hd.r + 3);
    ctx.quadraticCurveTo(hd.x + 2 + c * 9, hd.y - hd.r - 12 - c * 2, hd.x + 10 + c * 9, hd.y - hd.r - 4);
    ctx.quadraticCurveTo(hd.x + 4 + c * 8, hd.y - hd.r + 4, hd.x - 4 + c * 8, hd.y - hd.r + 6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  /* 眼先与颊 */
  ctx.save();
  ctx.fillStyle = P.belly;
  ctx.globalAlpha = 0.55;
  ellipse(hd.x - 12, hd.y + 8, 13, 10, -0.2);
  ctx.fill();
  ctx.restore();

  /* 喙：上喙 + 下喙 + 鼻孔 */
  ctx.save();
  var bt = BIRD.beakTip;
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(hd.x - hd.r * 0.72, hd.y - 4);
  ctx.quadraticCurveTo(bt.x - 4, bt.y - 6, bt.x, bt.y);
  ctx.quadraticCurveTo(hd.x - hd.r * 0.5, hd.y + 5, hd.x - hd.r * 0.7, hd.y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.moveTo(hd.x - hd.r * 0.7, hd.y + 5);
  ctx.quadraticCurveTo(bt.x + 12, bt.y + 3, hd.x - hd.r * 0.72, hd.y + 9);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(60,30,0,.5)';
  ctx.beginPath();
  ctx.arc(hd.x - hd.r * 0.46, hd.y - 2, 1.5, 0, 6.283);
  ctx.fill();
  ctx.restore();

  /* 眼 */
  var ey = BIRD.eye;
  ctx.save();
  ctx.fillStyle = P.eyeRing;
  ctx.beginPath(); ctx.arc(ey.x, ey.y, ey.r + 3.4, 0, 6.283); ctx.fill();
  if(pose.blink){
    ctx.strokeStyle = P.crest;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(ey.x, ey.y, ey.r, 0.15, Math.PI - 0.15); ctx.stroke();
  } else {
    ctx.fillStyle = P.eye;
    ctx.beginPath(); ctx.arc(ey.x, ey.y, ey.r, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ey.x - 1.8, ey.y - 2, 1.9, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(ey.x + 2.2, ey.y + 2.4, 1, 0, 6.283); ctx.fill();
  }
  ctx.restore();

  /* 胸前抓枝的小羽 */
  ctx.save();
  ctx.strokeStyle = P.crest;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1.6;
  for(var p2 = 0; p2 < 5; p2++){
    ctx.beginPath();
    ctx.arc(-34 + p2 * 9, -66 + p2 * 2, 7, 0.4, 2.2);
    ctx.stroke();
  }
  ctx.restore();

  ctx.restore();

  /* 供自检与截图标注使用的画面位置 */
  api.lastBird = { x: gripX, y: gripY + pose.bob, bbox: BIRD.bbox, pose: pose };
}

function drawPetals(P, t){
  ctx.save();
  ctx.fillStyle = P.petal;
  for(var i = 0; i < scene.petals.length; i++){
    var pe = scene.petals[i];
    var x = (pe.x + t * pe.dx) % (W + 60) - 30;
    var y = (pe.y + t * pe.dy) % (H + 60) - 30;
    var sway = Math.sin(t * pe.sw + pe.ph) * 12;
    ctx.globalAlpha = 0.55 + 0.4 * Math.abs(Math.sin(t * 0.7 + pe.ph));
    ctx.save();
    ctx.translate(x + sway, y);
    ctx.rotate(t * 0.7 + pe.ph);
    ctx.beginPath();
    ctx.ellipse(0, 0, pe.r, pe.r * 0.5, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawFinish(P, t){
  /* 画面边缘轻微暗角，像纸面 */
  var g = ctx.createRadialGradient(W / 2, H * 0.52, H * 0.42, W / 2, H * 0.52, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, P.moon ? 'rgba(0,0,0,.45)' : 'rgba(20,30,20,.22)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if(state.sig){
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = P.moon ? 'rgba(230,240,255,.8)' : 'rgba(40,50,40,.75)';
    ctx.font = 'italic 21px Georgia, "Songti SC", serif';
    ctx.textAlign = 'right';
    ctx.fillText('小鸟 · 2026', W - 26, H - 22);
    ctx.restore();
  }
}

/* ---------- 主渲染 ---------- */
function render(t){
  var P = PRESETS[state.preset];
  ctx.save();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawSky(P);
  drawStars(P, t);
  drawSun(P);
  drawClouds(P, t);
  drawHills(P);
  drawGeese(P, t);
  drawMeadow(P);
  drawPond(P, t);
  drawGrass(P);
  drawTrunk(P);
  drawBranch(P, t);
  drawBird(P, t);
  drawPetals(P, t);
  drawFinish(P, t);
  ctx.restore();
}

/* ---------- DPR ---------- */
var scale = 1;
function setupCanvas(){
  var dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  scale = dpr;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.imageSmoothingEnabled = true;
  render(state.t);
}

/* ---------- 动画 ---------- */
var last = 0, rafId = 0;
function loop(ts){
  rafId = 0;
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
  last = ts;
  if(state.motion && !state.freeze) state.t += dt;
  render(state.t);
  paintMeta();
  if(state.motion && !state.freeze) rafId = requestAnimationFrame(loop);
}
function start(){
  last = 0;
  if(rafId) return;
  if(state.motion && !state.freeze) rafId = requestAnimationFrame(loop);
  else { render(state.t); paintMeta(); }
}

/* ---------- UI ---------- */
var meta = document.getElementById('meta');
var seedInput = document.getElementById('seed');
function paintMeta(){
  var b = api.lastBird;
  meta.textContent = '时段 ' + state.preset + ' · seed ' + scene.seed +
    ' · 画面 ' + W + '×' + H + ' · t ' + state.t.toFixed(2) + 's' +
    (b ? ' · 小鸟位于 (' + Math.round(b.x) + ', ' + Math.round(b.y) + ')' : '');
}
function setPreset(name){
  if(!PRESETS[name]) return;
  state.preset = name;
  var kids = document.querySelectorAll('#presets button');
  for(var i = 0; i < kids.length; i++){
    kids[i].setAttribute('aria-pressed', kids[i].dataset.preset === name ? 'true' : 'false');
  }
  render(state.t); paintMeta();
}
function setSeed(v){
  state.seed = Math.round(clamp(v, 1, 99999));
  scene = buildScene(state.seed);
  seedInput.value = state.seed;
  render(state.t); paintMeta();
}
document.getElementById('presets').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(b && b.dataset.preset) setPreset(b.dataset.preset);
});
document.getElementById('redraw').addEventListener('click', function(){
  setSeed(1 + Math.floor(Math.random() * 99999));
});
seedInput.addEventListener('change', function(){ setSeed(parseFloat(seedInput.value) || 1); });
var mbtn = document.getElementById('motion');
mbtn.addEventListener('click', function(){
  state.motion = !state.motion;
  mbtn.setAttribute('aria-pressed', state.motion ? 'true' : 'false');
  mbtn.textContent = state.motion ? '🕊 动起来' : '🧊 静止';
  start();
});
var tbtn = document.getElementById('theme');
tbtn.addEventListener('click', function(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  tbtn.textContent = state.theme === 'dark' ? '🌗 浅色' : '🌗 深色';
});
document.getElementById('save').addEventListener('click', savePNG);
function savePNG(){
  var url = api.toDataURL();
  var a = document.createElement('a');
  a.href = url;
  a.download = 'bird-drawing-' + state.preset + '-' + scene.seed + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  return url;
}
window.addEventListener('keydown', function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var map = { '1':'dawn', '2':'noon', '3':'dusk', '4':'night' };
  var k = e.key;
  if(map[k]) { setPreset(map[k]); return; }
  if(k === 'r' || k === 'R') { setSeed(1 + Math.floor(Math.random() * 99999)); return; }
  if(k === 'm' || k === 'M') { mbtn.click(); return; }
  if(k === 't' || k === 'T') { tbtn.click(); return; }
  if(k === 's' || k === 'S') { savePNG(); return; }
});
if(params.get('ui') === 'off') document.body.dataset.ui = 'off';
document.documentElement.dataset.theme = state.theme;
seedInput.value = state.seed;
mbtn.setAttribute('aria-pressed', state.motion ? 'true' : 'false');

/* ---------- 对外 API（自检 / 无头截图） ---------- */
var api = {
  state: function(){
    return { preset: state.preset, seed: scene.seed, t: state.t, motion: state.motion,
             theme: state.theme, ui: params.get('ui') === 'off' };
  },
  go: function(t){ state.freeze = true; state.motion = false; state.t = t; render(state.t); paintMeta(); return api.state(); },
  ff: function(sec){ return api.go(state.t + sec); },
  setPreset: setPreset,
  setSeed: setSeed,
  toDataURL: function(){ return canvas.toDataURL('image/png'); },
  size: function(){ return { w: canvas.width, h: canvas.height, lw: W, lh: H, scale: scale }; },
  bird: function(){ return api.lastBird; },
  palette: function(){ return PRESETS[state.preset]; },
  palettes: PRESETS,
  keys: PALETTE_KEYS,
  branchY: branchY,
  samples: null,
  selftest: null
};
window.drawing = api;

/* ---------- 页内自检 ---------- */
function pixels(x, y, w, h){
  var d = ctx.getImageData(Math.round(x * scale), Math.round(y * scale),
                           Math.round(w * scale), Math.round(h * scale)).data;
  return d;
}
function hashRegion(x, y, w, h){
  var d = pixels(x, y, w, h), s = 0;
  for(var i = 0; i < d.length; i += 4){
    s = (s * 31 + d[i] * 7 + d[i + 1] * 3 + d[i + 2]) % 2147483647;
  }
  return s;
}
function rgbAt(x, y){
  var d = pixels(x, y, 1, 1);
  return [d[0], d[1], d[2]];
}
/* 取区域内最亮像素（抗 1px 采样抖动） */
function brightest(x, y, w, h){
  var d = pixels(x, y, w, h), best = [0,0,0], bs = -1;
  for(var i = 0; i < d.length; i += 4){
    var s = d[i] + d[i + 1] + d[i + 2];
    if(s > bs){ bs = s; best = [d[i], d[i + 1], d[i + 2]]; }
  }
  return best;
}
function runSelftest(){
  var out = [];
  function chk(name, ok){ out.push({ name: name, ok: !!ok }); }

  chk('画布存在且已按 DPR 放大', canvas.width >= W && canvas.height >= H);
  chk('四个时段齐备', Object.keys(PRESETS).length === 4);
  var keysetOk = true;
  for(var pk in PRESETS){
    for(var ki = 0; ki < PALETTE_KEYS.length; ki++){
      if(PRESETS[pk][PALETTE_KEYS[ki]] === undefined) keysetOk = false;
    }
    for(var k2 in PRESETS[pk]){ if(PALETTE_KEYS.indexOf(k2) < 0) keysetOk = false; }
  }
  chk('每个时色调色板键完全一致（' + PALETTE_KEYS.length + ' 键 × 4）', keysetOk);

  /* 逐时段渲染并检查不抛异常 */
  var prevPreset = state.preset, errors = [];
  var order = ['dawn','noon','dusk','night'];
  for(var oi = 0; oi < order.length; oi++){
    try { api.setPreset(order[oi]); api.go(3.4); }
    catch(err){ errors.push(order[oi] + ':' + err.message); }
  }
  api.setPreset(prevPreset);
  api.go(4.2);
  chk('四个时段都能画完，无异常', errors.length === 0);

  /* 天空不是纯色 */
  var top = rgbAt(60, 40), bot = rgbAt(60, 560);
  chk('天空是渐变（顶部与地面色不同）',
      Math.abs(top[0] - bot[0]) + Math.abs(top[1] - bot[1]) + Math.abs(top[2] - bot[2]) > 40);

  /* 主体小鸟确实落在画面里、且落在枝上 */
  var b = api.bird();
  chk('小鸟在画幅内', !!b && b.x + b.bbox.x > 0 && b.x + b.bbox.x + b.bbox.w < W &&
      b.y + b.bbox.y > 0 && b.y < H);
  var perch = Math.abs(b.y - branchY(b.x)) < 6;
  chk('小鸟爪子贴在树枝中心线上', perch);

  /* 身体/头/喙/尾：区域内非天空像素占比（天空渐变为解析色，抗采样抖动） */
  function skyAt(y){
    var P = PRESETS[state.preset];
    var a = hexRGB(P.skyTop), b2 = hexRGB(P.skyMid), c2 = hexRGB(P.skyBot), k;
    if(y <= H * 0.52){ k = y / (H * 0.52); return [lerp(a[0],b2[0],k),lerp(a[1],b2[1],k),lerp(a[2],b2[2],k)]; }
    k = (y - H * 0.52) / (H * 0.48);
    return [lerp(b2[0],c2[0],k),lerp(b2[1],c2[1],k),lerp(b2[2],c2[2],k)];
  }
  function fracSubject(x0, y0, w, h){
    var d = pixels(x0, y0, w, h), n = 0, hit = 0;
    for(var yy = 0; yy < h; yy++){
      var s = skyAt(y0 + yy);
      for(var xx = 0; xx < w; xx++){
        var i = (yy * w + xx) * 4;
        n++;
        var diff = Math.abs(d[i]-s[0]) + Math.abs(d[i+1]-s[1]) + Math.abs(d[i+2]-s[2]);
        if(diff > 48) hit++;
      }
    }
    return hit / n;
  }
  var bodyFrac = fracSubject(b.x - 50, b.y - 100, 84, 56);
  chk('身体区域是实心鸟身（' + (bodyFrac*100).toFixed(0) + '% 非天空）', bodyFrac > 0.5);
  chk('头部区域有内容', fracSubject(b.x - 76, b.y - 134, 40, 36) > 0.5);
  chk('喙部区域有内容', fracSubject(b.x - 112, b.y - 116, 22, 14) > 0.4);
  chk('尾部区域有内容', fracSubject(b.x + 30, b.y - 100, 76, 36) > 0.4);

  /* 眼睛高光存在（区域内取最亮像素，避开亚像素抖动） */
  var eyeHi = brightest(b.x - 72, b.y - 128, 12, 12);
  chk('眼里有高光点', eyeHi[0] > 170 && eyeHi[1] > 170 && eyeHi[2] > 170);

  /* 确定性：同 t 重绘哈希相同 */
  api.go(4.2);
  var h1 = hashRegion(300, 260, 200, 200);
  api.go(4.2);
  var h2 = hashRegion(300, 260, 200, 200);
  chk('同一 seed 同一时刻重绘结果一致', h1 === h2);

  /* 换 seed 构图不同 */
  var prevSeed = scene.seed;
  api.setSeed(4242);
  var h3 = hashRegion(0, 560, 300, 200);
  api.setSeed(prevSeed);
  api.go(4.2);
  var h4 = hashRegion(0, 560, 300, 200);
  chk('换 seed 会改变构图', h3 !== h4);

  /* 动作：静止时不随时间变化 */
  api.go(1.0);
  var hs = hashRegion(520, 300, 240, 220);
  api.go(1.0);
  chk('定格模式下同一时刻画面稳定', hs === hashRegion(520, 300, 240, 220));

  /* 导出 PNG 可用 */
  var url = api.toDataURL();
  chk('可导出 PNG（data:image/png，尺寸充足）',
      url.slice(0, 15) === 'data:image/png;' && url.length > 20000);

  /* 文案与控件 */
  chk('中英双语标题齐备', /枝头小鸟/.test(document.title) && /Picture of a Bird/.test(document.title));
  chk('四个时段按钮 + 重画 / 保存 / 深浅色 / 动停齐备',
      document.querySelectorAll('#presets button').length === 4 &&
      !!document.getElementById('redraw') && !!document.getElementById('save') &&
      !!document.getElementById('theme') && !!document.getElementById('motion'));

  /* 窄屏无横向溢出 */
  var de = document.documentElement;
  chk('无横向溢出（scrollWidth ≤ 视口+2）', de.scrollWidth <= window.innerWidth + 2);

  api.selftest = out;
  return out;
}

function paintSelftest(){
  var res = runSelftest();
  var box = document.getElementById('selftest');
  var list = document.getElementById('stlist');
  var pass = 0, html = '';
  for(var i = 0; i < res.length; i++){
    if(res[i].ok) pass++;
    html += '<div class="' + (res[i].ok ? 'ok' : 'bad') + '">' +
      (res[i].ok ? '✔ ' : '✘ ') + (i + 1) + '. ' + res[i].name + '</div>';
  }
  html = '<div>' + (pass === res.length ? 'ALL PASS' : 'FAILED') +
         ' — ' + pass + '/' + res.length + ' 项通过</div>' + html;
  list.innerHTML = html;
  box.hidden = false;
  document.title = '[selftest ' + pass + '/' + res.length + '] ' + document.title;
  return res;
}

/* ---------- 启动 ---------- */
setupCanvas();
window.addEventListener('resize', setupCanvas);
if(params.get('freeze') === '1'){
  api.go(num('t', 4.2));
} else if(params.get('ff')){
  api.go(num('t', 4.2) + num('ff', 0));
} else {
  state.t = num('t', 0);
  start();
}
if(params.get('selftest') === '1') paintSelftest();
paintMeta();

})();
</script>
</body>
</html>
