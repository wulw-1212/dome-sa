<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>猎人与鸟 · Hunter and Bird</title>
<style>
  :root {
    --ink: #e9f0f8;
    --dim: #93a7bd;
    --accent: #ffc159;
    --good: #8fe3a4;
    --danger: #ff6b6b;
    --panel: rgba(10, 16, 26, 0.88);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 6%, #17253c 0%, #0a1120 55%, #05080f 100%);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  /* The 1280x720 logical frame is scaled as one piece, so HUD text scales with
     the scene and can never clip on small screens. */
  #frame { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: top left; }
  canvas { display: block; width: 1280px; height: 720px; background: #0a1120; border-radius: 10px; cursor: none; }
  .hud { position: absolute; pointer-events: none; letter-spacing: .02em; }
  .hud, .panel { font-size: clamp(13px, calc(15px / var(--s, 1)), 46px); }
  .hud-left { left: 16px; top: 14px; }
  .hud-right { right: 16px; top: 14px; text-align: right; }
  .hud-bottom { left: 16px; right: 16px; bottom: 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; }
  .label { color: var(--dim); font-size: .78em; text-transform: uppercase; letter-spacing: .12em; }
  .score { font-size: 2.3em; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .combo { color: var(--accent); font-weight: 700; font-size: 1.05em; min-height: 1.2em; }
  .timer { font-size: 1.75em; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--danger); }
  .meter { width: 12.5em; height: .4em; border-radius: .2em; background: rgba(255,255,255,.14); overflow: hidden; margin-top: .4em; }
  .meter > i { display: block; height: 100%; width: 100%; background: var(--accent); }
  .wave { color: var(--dim); font-size: .85em; }
  .chip { display: inline-block; padding: .25em .7em; border-radius: 999px; font-size: .8em; font-weight: 700;
          background: rgba(255,193,89,.16); color: var(--accent); border: 1px solid rgba(255,193,89,.35); }
  .mag { display: flex; gap: .3em; align-items: center; min-height: 1.7em; }
  .mag > i { width: .8em; height: 1.55em; border-radius: .2em; background: #c98f3a; box-shadow: inset 0 -.27em 0 rgba(0,0,0,.28); }
  .mag > i.empty { background: rgba(255,255,255,.13); box-shadow: none; }
  .mag > i.heart { width: 1.15em; height: 1.05em; background: none; box-shadow: none; font-size: 1.15em; line-height: 1; }
  .magtext { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: .55em; }
  .stats { color: var(--dim); font-size: .85em; text-align: right; }
  .hint { color: var(--dim); font-size: .82em; text-align: center; flex: 1; }
  #reloadHint { color: var(--danger); font-weight: 700; min-height: 1.2em; }
  .panel {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(4, 8, 15, .72); backdrop-filter: blur(3px); border-radius: 10px;
    text-align: center; padding: 1.4em;
  }
  .panel[hidden] { display: none; }
  .card { background: var(--panel); border: 1px solid rgba(255,255,255,.1); border-radius: .95em; padding: 1.5em 1.9em; max-width: 44em; }
  .card h1 { margin: 0 0 .25em; font-size: 2.05em; }
  .card h2 { margin: 0 0 .5em; font-size: 1.6em; }
  .card p { margin: .35em 0; color: var(--dim); font-size: .95em; line-height: 1.6; }
  .modes { display: flex; gap: 1em; justify-content: center; margin: 1em 0 1.1em; }
  .modebtn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(255,255,255,.14); border-radius: .8em;
             background: rgba(255,255,255,.05); color: var(--ink); font: inherit; text-align: left;
             padding: .85em 1.05em; width: 15.5em; }
  .modebtn:hover { border-color: rgba(255,193,89,.7); background: rgba(255,193,89,.12); }
  .modebtn b { display: block; font-size: 1.15em; margin-bottom: .2em; }
  .modebtn span { color: var(--dim); font-size: .82em; line-height: 1.5; display: block; }
  .keys { display: grid; grid-template-columns: auto auto; gap: .28em .9em; margin: .85em auto 0; text-align: left;
          font-size: .9em; justify-content: center; }
  .keys b { color: var(--accent); font-family: ui-monospace, Consolas, monospace; font-weight: 700; white-space: nowrap; }
  .grade { font-size: 4em; font-weight: 800; color: var(--accent); line-height: 1; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: .35em 1.8em; margin: .9em 0 1.1em; font-size: 1em; }
  .rows > div { display: flex; justify-content: space-between; gap: .9em; }
  .rows span { color: var(--dim); }
  .rows strong { font-variant-numeric: tabular-nums; }
  button.go {
    pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ffcd72, #e8951f); color: #241803;
    font: inherit; font-weight: 800; font-size: 1.12em; padding: .65em 1.7em; margin: 0 .35em;
  }
  button.ghost { background: rgba(255,255,255,.08); color: var(--ink); border: 1px solid rgba(255,255,255,.18); }
  button.go:active { transform: translateY(1px); }
  .note { margin-top: .7em; font-size: .8em; }
  .legend { display: inline-flex; align-items: center; gap: .45em; margin-top: .5em; font-size: .82em; color: var(--dim); }
  .legend i { display: inline-grid; place-items: center; width: 1.35em; height: 1.35em; border-radius: 50%;
              background: rgba(70,150,255,.92); color: #fff; font-style: normal; font-size: .85em; }
  #selftest { position: fixed; left: 8px; bottom: 8px; z-index: 9; background: #0b1120f2; color: #e8eef6;
              font: 12px ui-monospace, Consolas, monospace; padding: 8px 10px; border-radius: 8px;
              max-height: 46vh; overflow: auto; max-width: 44em; }
  #devstats { position: fixed; right: 8px; bottom: 8px; z-index: 9; background: #0b1120f2; color: #9fe2ff;
              font: 11px ui-monospace, Consolas, monospace; padding: 6px 8px; border-radius: 8px; max-width: 34em; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="game" width="1280" height="720"></canvas>

  <div class="hud hud-left">
    <div class="chip" id="modeChip">猎人模式</div>
    <div class="label" style="margin-top:.5em">得分 Score</div>
    <div class="score" id="score">0</div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="hud hud-right">
    <div class="timer" id="time">60.0</div>
    <div class="meter"><i id="timeBar"></i></div>
    <div class="wave" id="wave">第 1 波</div>
  </div>
  <div class="hud hud-bottom">
    <div>
      <div class="mag" id="mag"></div>
      <div id="reloadHint"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="panel" id="menuPanel">
    <div class="card">
      <h1>猎人与鸟</h1>
      <p>两套玩法，一边当猎人、一边当小鸟。全部代码现场绘制，离线可玩。</p>
      <div class="modes">
        <button class="modebtn" id="hunterBtn"><b>🎯 猎人模式</b><span>限时打飞鸟，连击加分。蓝色「护」标是保护鸟类，打中要重罚。</span></button>
        <button class="modebtn" id="birdBtn"><b>🐦 小鸟模式</b><span>你当小鸟，躲开猎人的弹丸，采集浆果，三根羽毛用完即止。</span></button>
      </div>
      <div class="keys">
        <b>鼠标移动</b><span>瞄准 / 操控飞行</span>
        <b>左键 / 空格</b><span>猎人模式开火</span>
        <b>← → ↑ ↓ / WASD</b><span>小鸟模式飞行</span>
        <b>R</b><span>换弹（弹匣 6 发）</span>
        <b>P / Esc</b><span>暂停</span>
        <b>Enter</b><span>开始 / 再来一局</span>
        <b>H / B</b><span>切换模式</span>
        <b>M · T</b><span>静音 · 深色 / 浅色</span>
      </div>
      <div class="legend"><i>护</i><span>保护鸟类：打中扣 200 分并清空连击</span></div>
      <p class="note" id="bestNote"></p>
    </div>
  </div>

  <div class="panel" id="overPanel" hidden>
    <div class="card">
      <h2 id="overTitle">时间到</h2>
      <div class="grade" id="grade">C</div>
      <div class="rows" id="resultRows"></div>
      <button class="go" id="againBtn">再来一局</button>
      <button class="go ghost" id="menuBtn">返回菜单</button>
      <p class="note" id="overNote"></p>
    </div>
  </div>

  <div class="panel" id="pausePanel" hidden>
    <div class="card"><h2>已暂停</h2><p>按 P / Esc 继续。</p></div>
  </div>
</div></div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- constants
  const W = 1280, H = 720;
  const GROUND = 650;                 // ground line
  const SKY = { top: 84, bottom: 560 };
  const MAG = 6, RELOAD_TIME = 1.15;
  const PSTONE = 620;                 // hunter pellet speed in bird mode
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const TAU = Math.PI * 2;

  const q = new URLSearchParams(location.search);
  const MODE = q.get("mode") === "bird" ? "bird" : "hunter";
  const SELFTEST = q.get("selftest") === "1";
  const AUTOSTART = q.has("autostart");
  const AUTO = q.get("auto") === "1";                        // AI plays for screenshots/demos
  const STEPS = q.has("steps") ? Math.max(0, Math.floor(Number(q.get("steps")) || 0)) : null;
  const DURATION = Math.max(10, Number(q.get("duration")) || 60);
  const SEED = q.has("seed") ? (Number(q.get("seed")) >>> 0) : (Date.now() >>> 0);
  const TIMEKEY = ["dawn", "noon", "dusk", "night"].includes(q.get("time")) ? q.get("time") : "noon";
  const SHELL_LIGHT = q.get("theme") === "light";

  // ------------------------------------------------------------------ helpers
  function createRng(seed) {
    let s = (seed >>> 0) || 1;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;
      return s / 4294967296;
    };
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const pick = (rng, arr) => arr[Math.min(arr.length - 1, Math.floor(rng() * arr.length))];

  // ------------------------------------------------------------------- topics
  // Species table. `w` is the base spawn weight, `slope` how the weight shifts
  // per wave (protected cranes get more common, easy sparrows less common).
  const SPECIES = {
    sparrow:  { key: "sparrow",  zh: "麻雀",   en: "Sparrow",             r: 13, pts: 100,  vx: [150, 215], alt: [300, 540], amp: [8, 26],  w: 0.46, slope: -0.04, col: "#c9955e", wing: "#8d6136", protected: false, gold: false },
    mallard:  { key: "mallard",  zh: "野鸭",   en: "Mallard",             r: 19, pts: 150,  vx: [100, 145], alt: [170, 430], amp: [10, 30], w: 0.28, slope: -0.02, col: "#5d8253", wing: "#3c5a37", protected: false, gold: false },
    pheasant: { key: "pheasant", zh: "锦鸡",   en: "Golden pheasant",     r: 16, pts: 300,  vx: [120, 175], alt: [240, 480], amp: [14, 34], w: 0.10, slope: 0.005, col: "#e0a534", wing: "#bf3b2b", protected: false, gold: true },
    crane:    { key: "crane",    zh: "丹顶鹤", en: "Red-crowned crane",   r: 27, pts: -200, vx: [80, 120],  alt: [130, 350], amp: [6, 18],  w: 0.16, slope: 0.055, col: "#eef3fa", wing: "#cbd6e4", protected: true,  gold: false },
  };
  const SPECIES_LIST = Object.keys(SPECIES).map(k => SPECIES[k]);

  function speciesWeight(sp, wave) {
    return Math.max(0.012, sp.w + sp.slope * (wave - 1));
  }
  function pickSpecies(rng, wave) {
    let total = 0;
    for (const sp of SPECIES_LIST) total += speciesWeight(sp, wave);
    let x = rng() * total;
    for (const sp of SPECIES_LIST) {
      x -= speciesWeight(sp, wave);
      if (x <= 0) return sp;
    }
    return SPECIES_LIST[0];
  }
  function makeBird(rng, wave) {
    const sp = pickSpecies(rng, wave);
    const side = rng() < 0.5 ? -1 : 1;               // -1 enters from the left
    const speed = lerp(sp.vx[0], sp.vx[1], rng()) * (1 + (wave - 1) * 0.06);
    return {
      sp,
      id: ++birdSeq,
      x: side === -1 ? -60 : W + 60,
      y: lerp(sp.alt[0], sp.alt[1], rng()),
      baseY: lerp(sp.alt[0], sp.alt[1], rng()),
      dir: side === -1 ? 1 : -1,
      vx: speed,
      amp: lerp(sp.amp[0], sp.amp[1], rng()),
      phase: rng() * TAU,
      flapRate: lerp(4.4, 7.4, rng()),
      state: "fly", vy: 0, rot: 0, scared: 0, dead: false,
    };
  }
  let birdSeq = 0;

  function spawnInterval(wave) { return Math.max(0.46, 1.35 - wave * 0.12); }
  function maxBirds(wave) { return Math.min(10, 3 + wave); }
  function comboMult(streak) { return Math.min(5, 1 + Math.floor(streak / 3) * 0.5); }
  function grade(score, mode) {
    const t = mode === "bird" ? [1800, 1300, 900, 600, 300] : [3400, 2600, 1800, 1100, 500];
    return score >= t[0] ? "S" : score >= t[1] ? "A" : score >= t[2] ? "B"
         : score >= t[3] ? "C" : score >= t[4] ? "D" : "E";
  }
  /** Nearest shootable bird under a point, or null. */
  function hitTest(birds, px, py) {
    let best = null, bd = Infinity;
    for (const b of birds) {
      if (b.state !== "fly") continue;
      const r = b.sp.r * 1.25;
      const d = Math.hypot(px - b.x, py - b.y);
      if (d <= r && d < bd) { best = b; bd = d; }
    }
    return best;
  }
  /** A shot startles every bird near the muzzle: they climb and speed up. */
  function scatter(birds, x, y, radius) {
    for (const b of birds) {
      if (b.state !== "fly") continue;
      if (Math.hypot(b.x - x, b.y - y) > radius) continue;
      b.scared = 1.3 + Math.random() * 0.5;
      b.baseY = clamp(b.baseY - 80 - Math.random() * 70, SKY.top + 20, SKY.bottom);
      b.vx = Math.min(430, b.vx * 1.55);
    }
  }
  /** Where to aim so a pellet meets a moving bird. */
  function leadPoint(bird, ox, oy, speed) {
    const d = Math.hypot(bird.x - ox, bird.y - oy);
    const t = d / speed;
    return { x: bird.x + (bird.vx * bird.dir) * t, y: bird.y };
  }

  // ---------------------------------------------------------------- palettes
  const PALETTES = {
    dawn:  { sky: ["#22314f", "#f2a878"], star: 0.28, sun: { x: 980, y: 470, r: 34, c: "#ffd9a0", glow: "rgba(255,190,140,.35)" },
             mtn: ["#3b4b6e", "#2a3854"], tree: "#1c2939", ground: ["#3d5641", "#1d2d1e"], grass: "#4e6c46", cloud: "rgba(255,208,180,.42)", haze: "rgba(255,160,110,.13)" },
    noon:  { sky: ["#2f74c9", "#c9e9ff"], star: 0, sun: { x: 1060, y: 150, r: 38, c: "#fff6bd", glow: "rgba(255,246,189,.30)" },
             mtn: ["#6d93c4", "#4b6e9d"], tree: "#2f4a2c", ground: ["#5b8b4b", "#2d4923"], grass: "#6f9c52", cloud: "rgba(255,255,255,.72)", haze: "rgba(255,255,255,.10)" },
    dusk:  { sky: ["#2a2f52", "#ff9463"], star: 0.38, sun: { x: 250, y: 500, r: 32, c: "#ffb066", glow: "rgba(255,140,80,.38)" },
             mtn: ["#514063", "#33294a"], tree: "#221c31", ground: ["#4a3f36", "#241e1b"], grass: "#5d5240", cloud: "rgba(255,196,150,.40)", haze: "rgba(255,120,80,.16)" },
    night: { sky: ["#060b18", "#17264d"], star: 1, sun: { x: 1020, y: 140, r: 26, c: "#e8eef6", glow: "rgba(210,225,255,.25)", moon: true },
             mtn: ["#1c2740", "#121b2e"], tree: "#0e1626", ground: ["#1c2a26", "#0c1412"], grass: "#24382f", cloud: "rgba(150,170,205,.22)", haze: "rgba(120,150,220,.10)" },
  };
  const pal = PALETTES[TIMEKEY];

  // Clouds & stars are seeded once so every frame is stable.
  const sceneRng = createRng(SEED ^ 0x9e3779b9);
  const clouds = Array.from({ length: 14 }, () => ({
    x: sceneRng() * W, y: 110 + sceneRng() * 260,
    s: 0.55 + sceneRng() * 1.1, a: 0.5 + sceneRng() * 0.5, v: 6 + sceneRng() * 16,
  }));
  const stars = Array.from({ length: 90 }, () => ({ x: sceneRng() * W, y: sceneRng() * 520, r: 0.6 + sceneRng() * 1.5, t: sceneRng() * TAU }));

  // -------------------------------------------------------------------- sound
  const sfx = {
    ctx: null, master: null, noise: null, muted: false,
    init() {
      if (this.ctx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.42;
        this.master.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.4);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noise = buf;
      } catch (e) { this.ctx = null; }
    },
    tone(freq, dur, type = "sine", gain = 0.2, slide = 0) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), v = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      v.gain.setValueAtTime(gain, t);
      v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(v).connect(this.master);
      o.start(t); o.stop(t + dur);
    },
    burst(dur, cutoff, gain = 0.4) {
      if (!this.ctx || this.muted) return;
      const t = this.ctx.currentTime;
      const src = this.ctx.createBufferSource(); src.buffer = this.noise;
      const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
      const v = this.ctx.createGain();
      v.gain.setValueAtTime(gain, t);
      v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(v).connect(this.master);
      src.start(t); src.stop(t + dur);
    },
  };
  const sound = {
    shot() { sfx.burst(0.15, 1400, 0.5); sfx.tone(180, 0.09, "square", 0.15, -120); },
    hit(streak) { sfx.tone(880 + Math.min(streak, 12) * 45, 0.12, "triangle", 0.28, 260); sfx.burst(0.05, 5200, 0.1); },
    penalty() { sfx.tone(150, 0.32, "sawtooth", 0.26, -60); },
    miss() { sfx.burst(0.07, 480, 0.14); },
    dry() { sfx.tone(2100, 0.04, "square", 0.07); },
    reload() { sfx.tone(1200, 0.05, "square", 0.11); setTimeout(() => sfx.tone(760, 0.06, "square", 0.11), 250); },
    collect() { sfx.tone(1046, 0.09, "triangle", 0.22, 320); sfx.tone(1568, 0.08, "sine", 0.14, 200); },
    hurt() { sfx.tone(320, 0.22, "sawtooth", 0.24, -180); sfx.burst(0.18, 900, 0.2); },
    over() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx.tone(f, 0.24, "triangle", 0.2), i * 130)); },
  };

  // -------------------------------------------------------------------- state
  function makeState(mode) {
    return {
      mode, phase: "menu",
      score: 0, combo: 0, bestStreak: 0, hits: 0, shots: 0, penalties: 0,
      time: DURATION, elapsed: 0, wave: 1,
      ammo: MAG, reloading: 0, emptyT: 0,
      spawnIn: 0.6, birds: [], feathers: [], floats: [], pellets: [], berries: [],
      flash: 0, shake: 0, aiCool: 0,
      aimX: W / 2, aimY: 280, hunterX: W / 2,
      bird: { x: 300, y: 340, vx: 0, vy: 0, flap: 0, hp: 3, inv: 0, dir: 1 },
      hunter: { x: W / 2, aimT: 0, aimAt: null, cool: 2.3, shots: 0 },
      berryIn: 0.4, collected: 0, golden: 0, dodged: 0,
      rng: createRng(SEED),
    };
  }
  function newRun(s) {
    const mode = s.mode;
    runCount++;
    Object.assign(s, makeState(mode));
    s.rng = createRng((SEED + runCount * 7919) >>> 0);
    s.phase = "playing";
    s.birds = [];
    birdSeq = 0;
    dom.menu.hidden = true; dom.over.hidden = true; dom.pause.hidden = true;
    renderHud(s);
  }
  let runCount = 0;
  const G = makeState(MODE);
  G.time = DURATION;

  // -------------------------------------------------------------------- input
  const input = { keys: new Set(), aimX: W / 2, aimY: 280, pointer: false };
  const view = { scale: 1, dpr: 1 };

  function el(id) { return document.getElementById(id); }
  const dom = {
    menu: el("menuPanel"), over: el("overPanel"), pause: el("pausePanel"),
    modeChip: el("modeChip"), score: el("score"), combo: el("combo"),
    time: el("time"), timeBar: el("timeBar"), wave: el("wave"),
    mag: el("mag"), reloadHint: el("reloadHint"), hint: el("hint"), stats: el("stats"),
    grade: el("grade"), resultRows: el("resultRows"), overTitle: el("overTitle"),
    overNote: el("overNote"), bestNote: el("bestNote"),
  };

  // ------------------------------------------------------------------ scoring
  function bestScore(mode) {
    try { return Number(localStorage.getItem("hunter-bird-best-" + mode)) || 0; } catch (e) { return 0; }
  }
  function saveBest(mode, score) {
    try { if (score > bestScore(mode)) localStorage.setItem("hunter-bird-best-" + mode, String(score)); } catch (e) {}
  }

  function addFloat(s, x, y, text, color) {
    s.floats.push({ x, y, text, color, life: 1.15 });
  }
  function feathers(s, x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 210;
      s.feathers.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
        rot: Math.random() * TAU, vr: (Math.random() * 2 - 1) * 7,
        life: 1.1 + Math.random() * 0.9, size: 4 + Math.random() * 5, color,
      });
    }
  }

  // ------------------------------------------------------- hunter-mode logic
  function reload(s) {
    if (s.phase !== "playing" || s.reloading > 0 || s.ammo >= MAG) return;
    s.reloading = RELOAD_TIME;
    sound.reload();
    renderHud(s);
  }

  function fire(s, px, py) {
    if (s.phase !== "playing" || s.reloading > 0) return false;
    if (s.ammo <= 0) { sound.dry(); return false; }
    s.ammo--; s.shots++;
    s.flash = 0.06; s.shake = Math.min(11, s.shake + 6);
    sound.shot();
    const b = hitTest(s.birds, px, py);
    scatter(s.birds, px, py, 300);
    if (!b) {
      s.combo = 0; sound.miss();
      addFloat(s, px, py, "MISS", "#9fb3c8");
      renderHud(s);
      return false;
    }
    if (b.sp.protected) {
      const loss = Math.min(s.score, 200);
      s.score -= loss; s.penalties++; s.combo = 0;
      s.flash = 0.2; s.shake = 13;
      sound.penalty();
      addFloat(s, b.x, b.y - 22, "-" + loss + " 保护鸟类!", "#ff6b6b");
      feathers(s, b.x, b.y, 10, "#9fd0ff");
      b.scared = 2.2;
      b.baseY = clamp(b.baseY - 160, SKY.top + 20, SKY.bottom);
      b.vx = Math.min(430, b.vx * 1.7);
      renderHud(s);
      return false;
    }
    const mult = comboMult(s.combo);
    const pts = Math.round(b.sp.pts * mult);
    s.score += pts; s.hits++; s.combo++;
    s.bestStreak = Math.max(s.bestStreak, s.combo);
    b.state = "fall"; b.vy = -130; b.rot = 0;
    sound.hit(s.combo);
    addFloat(s, b.x, b.y - 20, "+" + pts + (mult > 1 ? " ×" + mult : ""), mult > 1 ? "#ffd76a" : "#a8e6a0");
    feathers(s, b.x, b.y, 14, b.sp.col);
    renderHud(s);
    return true;
  }

  function spawnWave(s) {
    const wave = s.wave;
    const lead = makeBird(s.rng, wave);
    const flock = wave >= 3 && s.rng() < 0.35 ? 2 + Math.floor(s.rng() * 3) : 1;
    for (let i = 0; i < flock; i++) {
      const b = i === 0 ? lead : makeBird(s.rng, wave);
      if (i > 0) {
        b.dir = lead.dir;
        b.x = lead.x - b.dir * i * 74;
        b.baseY = clamp(lead.baseY + (s.rng() * 2 - 1) * 74, SKY.top + 20, SKY.bottom);
        b.y = b.baseY;
      }
      s.birds.push(b);
    }
    s.spawnIn = spawnInterval(wave);
  }

  // --------------------------------------------------------- bird-mode logic
  function spawnPellet(s, origin, target) {
    const a = Math.atan2(target.y - origin.y, target.x - origin.x);
    s.pellets.push({ x: origin.x, y: origin.y, vx: Math.cos(a) * PSTONE, vy: Math.sin(a) * PSTONE, life: 2.4 });
  }
  function fireVolley(s) {
    const h = s.hunter;
    const origin = { x: h.x, y: GROUND - 74 };
    const n = Math.min(4, 1 + Math.floor(s.elapsed / 22));
    const base = Math.atan2(h.aimAt.y - origin.y, h.aimAt.x - origin.x);
    for (let i = 0; i < n; i++) {
      const spread = (i - (n - 1) / 2) * 0.038 + (s.rng() * 2 - 1) * 0.014;
      const a = base + spread;
      s.pellets.push({ x: origin.x, y: origin.y, vx: Math.cos(a) * PSTONE, vy: Math.sin(a) * PSTONE, life: 2.4 });
    }
    h.shots += n;
    s.flash = 0.07; s.shake = Math.min(9, s.shake + 5);
    sound.shot();
  }

  function endRun(s) {
    if (s.phase === "over") return;
    s.phase = "over";
    saveBest(s.mode, s.score);
    sound.over();
    const g = grade(s.score, s.mode);
    dom.grade.textContent = g;
    dom.overTitle.textContent = s.mode === "bird"
      ? (s.bird.hp <= 0 ? "羽毛用完了" : "飞行结束")
      : "时间到";
    const acc = s.shots ? Math.round(s.hits / s.shots * 100) : 0;
    const rows = s.mode === "bird"
      ? [["得分 Score", s.score], ["采集浆果 Berries", s.collected + (s.golden ? "（金 " + s.golden + "）" : "")],
         ["躲过弹丸 Dodged", s.dodged], ["剩余羽毛 Feathers", Math.max(0, s.bird.hp)],
         ["存活 Survived", s.elapsed.toFixed(1) + "s"], ["被击中 Hits taken", Math.max(0, 3 - s.bird.hp)]]
      : [["得分 Score", s.score], ["命中 Hits", s.hits + " / " + s.shots],
         ["命中率 Accuracy", acc + "%"], ["最高连击 Best combo", s.bestStreak],
         ["误伤保护鸟 Penalties", s.penalties], ["到达波次 Wave", s.wave]];
    dom.resultRows.innerHTML = rows.map(r => `<div><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join("");
    const best = bestScore(s.mode);
    dom.overNote.textContent = (s.score >= best ? "🎉 新纪录！ New best!" : "历史最佳 Best " + best + " 分");
    dom.over.hidden = false;
  }

  // ------------------------------------------------------------------- update
  function updateHunter(s, dt) {
    s.elapsed += dt; s.time -= dt;
    s.wave = 1 + Math.floor(s.elapsed / 25);
    if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 26);
    if (s.flash > 0) s.flash = Math.max(0, s.flash - dt);

    if (s.reloading > 0) {
      s.reloading -= dt;
      if (s.reloading <= 0) { s.reloading = 0; s.ammo = MAG; renderHud(s); }
    } else if (s.ammo <= 0) {
      s.emptyT += dt;
      if (s.emptyT > 0.45) { s.emptyT = 0; reload(s); }
    } else s.emptyT = 0;

    s.spawnIn -= dt;
    const alive = s.birds.filter(b => b.state === "fly").length;
    if (s.spawnIn <= 0 && alive < maxBirds(s.wave)) spawnWave(s);

    for (const b of s.birds) {
      if (b.state === "fly") {
        b.x += b.dir * b.vx * dt * (b.scared > 0 ? 1.9 : 1);
        if (b.scared > 0) b.scared = Math.max(0, b.scared - dt);
        b.phase += dt * b.flapRate * (b.scared > 0 ? 1.45 : 1);
        b.y = b.baseY + Math.sin(b.phase) * b.amp * (b.scared > 0 ? 1.6 : 1);
        if (b.x < -140 || b.x > W + 140) b.dead = true;
      } else if (b.state === "fall") {
        b.vy += 980 * dt;
        b.y += b.vy * dt;
        b.x += b.dir * b.vx * 0.25 * dt;
        b.rot += dt * 3.4;
        if (b.y > GROUND - 4) { b.dead = true; feathers(s, b.x, GROUND - 10, 6, b.sp.col); }
      }
    }
    s.birds = s.birds.filter(b => !b.dead);

    // Player aim follows the pointer (clamped to the sky); the hunter runs
    // along the ground toward the aim instead of teleporting.
    if (!AUTO) { s.aimX = input.aimX; s.aimY = clamp(input.aimY, 60, GROUND - 40); }
    s.hunterX += clamp(s.aimX - s.hunterX, -620 * dt, 620 * dt);

    if (AUTO) {
      s.aiCool -= dt;
      const candidates = s.birds.filter(b => b.state === "fly" && !b.sp.protected);
      candidates.sort((a, b) => Math.hypot(a.x - s.aimX, a.y - s.aimY) - Math.hypot(b.x - s.aimX, b.y - s.aimY));
      const target = candidates[0];
      if (target) {
        // The hunter's shot is an instant hit-test at the crosshair, so aim at
        // where the bird is now plus one frame of travel.
        s.aimX = clamp(target.x + target.dir * target.vx * 0.04, 40, W - 40);
        s.aimY = clamp(target.y, 60, GROUND - 40);
        if (s.aiCool <= 0 && s.reloading === 0) { s.aiCool = 0.3; fire(s, s.aimX, s.aimY); }
      }
    }
    if (s.time <= 0) { s.time = 0; endRun(s); }
  }

  function updateBird(s, dt) {
    s.elapsed += dt; s.time -= dt;
    if (s.shake > 0) s.shake = Math.max(0, s.shake - dt * 26);
    if (s.flash > 0) s.flash = Math.max(0, s.flash - dt);
    s.score += 6 * dt;                                  // survival points

    const b = s.bird;
    let ax = 0, ay = 0;
    if (AUTO) {
      let tx = b.x, ty = b.y;
      let nearest = null, nd = Infinity;
      for (const ber of s.berries) {
        const d = Math.hypot(ber.x - b.x, ber.y - b.y);
        if (d < nd) { nd = d; nearest = ber; }
      }
      if (nearest && nd < 620) { tx = nearest.x; ty = nearest.y; }
      for (const p of s.pellets) {
        const dx = b.x - p.x, dy = b.y - p.y;
        const d2 = Math.max(90, dx * dx + dy * dy);
        tx += dx / d2 * 52000; ty += dy / d2 * 52000;
      }
      ax = clamp((tx - b.x) / 130, -1.6, 1.6);
      ay = clamp((ty - b.y) / 130, -1.6, 1.6);
    } else {
      const k = input.keys;
      if (k.has("arrowleft") || k.has("a")) ax -= 1;
      if (k.has("arrowright") || k.has("d")) ax += 1;
      if (k.has("arrowup") || k.has("w")) ay -= 1;
      if (k.has("arrowdown") || k.has("s")) ay += 1;
      if (input.pointer) {
        ax += clamp((input.aimX - b.x) / 150, -1, 1) * 1.3;
        ay += clamp((input.aimY - b.y) / 150, -1, 1) * 1.3;
      }
    }
    const ACC = 2900;
    b.vx += clamp(ax, -1.7, 1.7) * ACC * dt;
    b.vy += clamp(ay, -1.7, 1.7) * ACC * dt;
    const drag = Math.pow(0.13, dt);
    b.vx *= drag; b.vy *= drag;
    const sp = Math.hypot(b.vx, b.vy);
    const MAXV = 560;
    if (sp > MAXV) { b.vx = b.vx / sp * MAXV; b.vy = b.vy / sp * MAXV; }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 52) { b.x = 52; b.vx = Math.abs(b.vx) * 0.3; }
    if (b.x > W - 52) { b.x = W - 52; b.vx = -Math.abs(b.vx) * 0.3; }
    if (b.y < SKY.top + 6) { b.y = SKY.top + 6; b.vy = Math.abs(b.vy) * 0.3; }
    if (b.y > SKY.bottom + 30) { b.y = SKY.bottom + 30; b.vy = -Math.abs(b.vy) * 0.3; }
    if (b.vx < -12) b.dir = -1; else if (b.vx > 12) b.dir = 1;
    b.flap += dt * (6 + Math.min(10, sp * 0.02));
    b.inv = Math.max(0, b.inv - dt);

    // Berries
    s.berryIn -= dt;
    if (s.berryIn <= 0 && s.berries.length < 4) {
      const gold = s.rng() < 0.28;
      s.berries.push({ x: 110 + s.rng() * (W - 220), y: 140 + s.rng() * 340, vy: -(8 + s.rng() * 18), gold, t: s.rng() * TAU });
      s.berryIn = 0.75 + s.rng() * 1.1;
    }
    for (const ber of s.berries) { ber.t += dt; ber.y += ber.vy * dt; ber.x += Math.sin(ber.t) * 12 * dt; }
    s.berries = s.berries.filter(ber => {
      if (Math.hypot(ber.x - b.x, ber.y - b.y) < 34) {
        const pts = ber.gold ? 150 : 50;
        s.score += pts; s.collected++; if (ber.gold) s.golden++;
        sound.collect();
        addFloat(s, ber.x, ber.y - 14, "+" + pts, ber.gold ? "#ffd76a" : "#a8e6a0");
        feathers(s, ber.x, ber.y, 6, ber.gold ? "#ffd76a" : "#8fe3a4");
        return false;
      }
      return ber.y > SKY.top;
    });

    // Hunter tracks the bird, telegraphs, then fires a volley.
    const h = s.hunter;
    const tx = clamp(b.x, 90, W - 90);
    h.x += clamp(tx - h.x, -230 * dt, 230 * dt);
    if (h.aimT > 0) {
      h.aimT -= dt;
      if (h.aimT <= 0) { fireVolley(s); h.cool = Math.max(1.0, 2.4 - s.elapsed * 0.02); }
    } else {
      h.cool -= dt;
      if (h.cool <= 0) {
        const d = Math.hypot(b.x - h.x, b.y - (GROUND - 74));
        const t = d / PSTONE;
        h.aimAt = { x: clamp(b.x + b.vx * t, 40, W - 40), y: clamp(b.y + b.vy * t, SKY.top, SKY.bottom + 20) };
        h.aimT = 0.5;
      }
    }

    // Pellets
    for (const p of s.pellets) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      p.dead = p.life <= 0 || p.x < -40 || p.x > W + 40 || p.y > GROUND;
      if (b.inv <= 0 && Math.hypot(p.x - b.x, p.y - b.y) < 22) {
        p.dead = true; p.hit = true;
        b.hp--; b.inv = 1.6;
        s.shake = Math.min(14, s.shake + 12);
        s.combo = 0;
        sound.hurt();
        addFloat(s, b.x, b.y - 26, "-1 羽毛", "#ff6b6b");
        feathers(s, b.x, b.y, 16, "#7fb6ff");
        if (b.hp <= 0) { endRun(s); return; }
      }
      if (p.dead && !p.hit) s.dodged++;
    }
    s.pellets = s.pellets.filter(p => !p.dead);

    if (s.time <= 0) { s.time = 0; endRun(s); }
  }

  function update(s, dt) {
    if (s.phase !== "playing") return;
    if (s.mode === "hunter") updateHunter(s, dt);
    else updateBird(s, dt);

    for (const f of s.feathers) {
      f.vy += 420 * dt; f.vx *= Math.pow(0.4, dt); f.vy *= Math.pow(0.75, dt);
      f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; f.life -= dt;
    }
    s.feathers = s.feathers.filter(f => f.life > 0 && f.y < GROUND + 40);
    for (const f of s.floats) { f.y -= 34 * dt; f.life -= dt; }
    s.floats = s.floats.filter(f => f.life > 0);
  }

  // ------------------------------------------------------------------- render
  const canvas = el("game");
  const ctx = canvas.getContext("2d");

  function resize() {
    const availW = window.innerWidth - 16, availH = window.innerHeight - 16;
    const scale = Math.max(0.2, Math.min(availW / W, availH / H));
    const frame = el("frame");
    frame.style.transform = "scale(" + scale + ")";
    frame.style.setProperty("--s", String(scale));
    frame.style.left = Math.max(8, (window.innerWidth - W * scale) / 2) + "px";
    frame.style.top = Math.max(8, (window.innerHeight - H * scale) / 2) + "px";
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * scale * view.dpr);
    canvas.height = Math.round(H * scale * view.dpr);
    view.scale = canvas.width / W;
    renderHud(G);
    render(G);          // resizing resets the bitmap: repaint whatever state we are in
  }

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, pal.sky[0]); g.addColorStop(1, pal.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND + 2);

    if (pal.star > 0) {
      for (const st of stars) {
        const a = pal.star * (0.55 + 0.45 * Math.sin(t * 1.6 + st.t));
        ctx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
      }
    }
    // Sun / moon with glow
    const s = pal.sun;
    const rg = ctx.createRadialGradient(s.x, s.y, s.r * 0.4, s.x, s.y, s.r * 5.4);
    rg.addColorStop(0, s.glow); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 5.4, 0, TAU); ctx.fill();
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    if (s.moon) { // crescent: punch a dark bite out of the disc
      ctx.fillStyle = pal.sky[1];
      ctx.beginPath(); ctx.arc(s.x + s.r * 0.45, s.y - s.r * 0.2, s.r * 0.92, 0, TAU); ctx.fill();
    }
    // Clouds
    for (const c of clouds) {
      const x = ((c.x + t * c.v) % (W + 260)) - 130;
      ctx.fillStyle = pal.cloud;
      ctx.globalAlpha = c.a;
      ctx.beginPath();
      ctx.ellipse(x, c.y, 74 * c.s, 24 * c.s, 0, 0, TAU);
      ctx.ellipse(x + 52 * c.s, c.y + 6 * c.s, 46 * c.s, 17 * c.s, 0, 0, TAU);
      ctx.ellipse(x - 56 * c.s, c.y + 8 * c.s, 40 * c.s, 15 * c.s, 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Two mountain ridges
    for (let layer = 0; layer < 2; layer++) {
      ctx.fillStyle = pal.mtn[layer];
      ctx.beginPath();
      const base = GROUND - 96 + layer * 26;
      ctx.moveTo(0, base + 70);
      for (let x = 0; x <= W; x += 64) {
        const h = 90 + 62 * Math.sin((x + layer * 260) * 0.0032) + 34 * Math.sin((x + layer * 130) * 0.0071);
        ctx.lineTo(x, base - h + layer * 34);
      }
      ctx.lineTo(W, base + 90); ctx.lineTo(0, base + 90); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = pal.haze; ctx.fillRect(0, GROUND - 210, W, 210);
  }

  function drawTreeline() {
    ctx.fillStyle = pal.tree;
    const base = GROUND - 6;
    for (let x = -20; x < W + 40; x += 46) {
      const h = 46 + 34 * ((Math.sin(x * 0.11) + 1) / 2);
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.lineTo(x + 20, base - h);
      ctx.lineTo(x + 40, base);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 8, base - h * 0.5);
      ctx.lineTo(x + 20, base - h * 1.35);
      ctx.lineTo(x + 32, base - h * 0.5);
      ctx.closePath(); ctx.fill();
    }
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, GROUND - 10, 0, H);
    g.addColorStop(0, pal.ground[0]); g.addColorStop(1, pal.ground[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, GROUND + Math.sin(x * 0.02) * 5);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.grass; ctx.lineWidth = 2;
    for (let x = 6; x < W; x += 17) {
      const h = 8 + ((x * 37) % 13);
      ctx.beginPath(); ctx.moveTo(x, GROUND + 2); ctx.lineTo(x + 3, GROUND - h); ctx.stroke();
    }
  }

  function drawHunter(x, aimAngle, flash, face) {
    ctx.save();
    ctx.translate(x, GROUND + 2);
    ctx.scale(face === -1 ? -1 : 1, 1);
    // shadow
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath(); ctx.ellipse(0, 4, 34, 8, 0, 0, TAU); ctx.fill();
    // legs
    ctx.strokeStyle = "#3b3021"; ctx.lineWidth = 11; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-5, -8); ctx.lineTo(-13, -52); ctx.moveTo(6, -8); ctx.lineTo(14, -52); ctx.stroke();
    ctx.strokeStyle = "#241d14"; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(-15, -50); ctx.lineTo(-20, -50); ctx.moveTo(12, -50); ctx.lineTo(18, -50); ctx.stroke();
    // coat
    ctx.fillStyle = "#6b4a2c";
    ctx.beginPath();
    ctx.moveTo(-17, -48); ctx.lineTo(-15, -108); ctx.lineTo(16, -108); ctx.lineTo(19, -48); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5a3d23";
    ctx.fillRect(-17, -74, 37, 8);
    // head
    ctx.fillStyle = "#d9a273";
    ctx.beginPath(); ctx.arc(0, -122, 12, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3f6b3a";                                     // cap
    ctx.beginPath(); ctx.arc(0, -128, 13, Math.PI, TAU); ctx.fill();
    ctx.fillRect(-17, -130, 34, 5);
    // rifle, rotated around the shoulder
    ctx.save();
    ctx.translate(4, -104);
    ctx.rotate(aimAngle);
    ctx.strokeStyle = "#2c313a"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-16, 6); ctx.lineTo(62, 0); ctx.stroke();
    ctx.strokeStyle = "#8a6a3c"; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-24, 10); ctx.lineTo(-4, 5); ctx.stroke();
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,226,150,.95)";
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU;
        ctx.lineTo(66 + Math.cos(a) * 18, 0 + Math.sin(a) * 18);
        ctx.lineTo(66 + Math.cos(a + 0.5) * 7, 0 + Math.sin(a + 0.5) * 7);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // arms toward the rifle
    ctx.strokeStyle = "#d9a273"; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-12, -96);
    ctx.lineTo(-12 + Math.cos(aimAngle) * 34, -96 + Math.sin(aimAngle) * 34);
    ctx.moveTo(6, -98);
    ctx.lineTo(6 + Math.cos(aimAngle) * 22, -98 + Math.sin(aimAngle) * 22);
    ctx.stroke();
    ctx.restore();
  }

  function drawBird(b) {
    const sp = b.sp, r = sp.r;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot || 0);
    ctx.scale(b.dir, 1);
    const flap = Math.sin(b.phase);
    // far wing
    ctx.fillStyle = sp.wing;
    ctx.save(); ctx.translate(-r * 0.1, -r * 0.45); ctx.rotate(-0.45 + flap * 0.62);
    ctx.beginPath(); ctx.ellipse(r * 0.22, 0, r * 0.95, r * 0.33, 0, 0, TAU); ctx.fill(); ctx.restore();
    // tail
    ctx.fillStyle = sp.wing;
    ctx.beginPath(); ctx.moveTo(-r * 0.65, -r * 0.12); ctx.lineTo(-r * 1.65, -r * 0.5); ctx.lineTo(-r * 1.6, r * 0.34); ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = sp.col;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.05, r * 0.62, 0, 0, TAU); ctx.fill();
    // near wing
    ctx.fillStyle = sp.wing;
    ctx.save(); ctx.translate(-r * 0.1, -r * 0.28); ctx.rotate(0.42 - flap * 0.62);
    ctx.beginPath(); ctx.ellipse(r * 0.22, 0, r * 1.0, r * 0.35, 0, 0, TAU); ctx.fill(); ctx.restore();
    // head, beak, eye
    ctx.fillStyle = sp.col;
    ctx.beginPath(); ctx.arc(r * 0.86, -r * 0.34, r * 0.42, 0, TAU); ctx.fill();
    ctx.fillStyle = "#f2b23c";
    ctx.beginPath(); ctx.moveTo(r * 1.2, -r * 0.42); ctx.lineTo(r * 1.78, -r * 0.28); ctx.lineTo(r * 1.2, -r * 0.14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#101820";
    ctx.beginPath(); ctx.arc(r * 0.96, -r * 0.44, r * 0.1, 0, TAU); ctx.fill();
    if (sp.protected) {                                            // crane crown
      ctx.fillStyle = "#d94f4f";
      ctx.beginPath(); ctx.arc(r * 0.78, -r * 0.7, r * 0.17, 0, TAU); ctx.fill();
    }
    if (sp.gold) {
      ctx.fillStyle = "rgba(255,215,106,.5)";
      ctx.beginPath(); ctx.arc(-r * 1.0, -r * 0.6, r * 0.22, 0, TAU); ctx.fill();
    }
    ctx.restore();

    if (sp.protected) {                                            // "protected" badge
      ctx.save();
      ctx.translate(b.x + r * 1.15, b.y - r * 1.75);
      ctx.fillStyle = "rgba(70,150,255,.94)";
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("护", 0, 1);
      ctx.restore();
    }
  }

  function drawPlayerBird(b) {
    const r = 22;
    ctx.save();
    // a soft halo so the player never gets lost against the sky
    const halo = ctx.createRadialGradient(b.x, b.y, 6, b.x, b.y, 78);
    halo.addColorStop(0, "rgba(140,200,255,.28)"); halo.addColorStop(1, "rgba(140,200,255,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(b.x, b.y, 78, 0, TAU); ctx.fill();
    ctx.translate(b.x, b.y);
    if (b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.scale(1.3 * b.dir, 1.3);
    const flap = Math.sin(b.flap);
    ctx.fillStyle = "#2f5f9e";
    ctx.save(); ctx.translate(-2, -10); ctx.rotate(-0.45 + flap * 0.7);
    ctx.beginPath(); ctx.ellipse(4, 0, 24, 8, 0, 0, TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#24487a";
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-40, -13); ctx.lineTo(-38, 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5b9be0";
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 14, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ecf3fb";
    ctx.beginPath(); ctx.ellipse(4, 5, 15, 8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3b7fd0";
    ctx.save(); ctx.translate(-2, -6); ctx.rotate(0.42 - flap * 0.7);
    ctx.beginPath(); ctx.ellipse(4, 0, 25, 8.5, 0, 0, TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle = "#5b9be0";
    ctx.beginPath(); ctx.arc(20, -8, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = "#f2b23c";
    ctx.beginPath(); ctx.moveTo(28, -10); ctx.lineTo(41, -6); ctx.lineTo(28, -3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#101820";
    ctx.beginPath(); ctx.arc(22, -10, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawBerry(ber, t) {
    ctx.save();
    ctx.translate(ber.x, ber.y);
    if (ber.gold) {
      const rg = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
      rg.addColorStop(0, "rgba(255,215,106,.75)"); rg.addColorStop(1, "rgba(255,215,106,0)");
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = ber.gold ? "#ffd76a" : "#e2557a";
    ctx.beginPath(); ctx.arc(0, 0, ber.gold ? 11 : 9, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.arc(-3, -3, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#4e7a3a"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.quadraticCurveTo(6, -16 + Math.sin(t * 3) * 2, 12, -15); ctx.stroke();
    ctx.restore();
  }

  function drawScene(t, s) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.scale, 0, 0, view.scale, 0, 0);
    if (s.shake > 0.1) ctx.translate((Math.random() * 2 - 1) * s.shake, (Math.random() * 2 - 1) * s.shake);

    drawSky(t);
    drawTreeline();
    drawGround();

    if (s.mode === "bird") {
      for (const ber of s.berries) drawBerry(ber, t);
      // hunter below, small (bird's-eye perspective)
      ctx.save();
      ctx.translate(s.hunter.x, GROUND - 4);
      ctx.scale(0.62, 0.62);
      ctx.translate(-s.hunter.x, -(GROUND - 4));
      const d = s.hunter.aimAt || { x: s.hunter.x + 60, y: 200 };
      const face = d.x >= s.hunter.x ? 1 : -1;
      const aim = clamp(Math.atan2(d.y - (GROUND - 104), Math.max(60, Math.abs(d.x - s.hunter.x))), -Math.PI, -0.12);
      drawHunter(s.hunter.x, aim, s.flash, face);
      ctx.restore();
      if (s.hunter.aimT > 0 && s.hunter.aimAt) {                   // telegraph line
        const a = clamp(s.hunter.aimT / 0.5, 0, 1);
        ctx.save();
        ctx.strokeStyle = "rgba(255,90,90," + (0.25 + 0.5 * (1 - a)).toFixed(2) + ")";
        ctx.lineWidth = 2;
        ctx.setLineDash([9, 9]);
        ctx.beginPath();
        ctx.moveTo(s.hunter.x, GROUND - 74);
        ctx.lineTo(s.hunter.aimAt.x, s.hunter.aimAt.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = "rgba(255,90,90,.85)";
        ctx.beginPath(); ctx.arc(s.hunter.aimAt.x, s.hunter.aimAt.y, 6 + 16 * (1 - a), 0, TAU); ctx.stroke();
        ctx.restore();
      }
      for (const p of s.pellets) {
        ctx.strokeStyle = "rgba(255,240,190,.55)"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); ctx.stroke();
        ctx.fillStyle = "#fff2c2";
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, TAU); ctx.fill();
      }
      drawPlayerBird(s.bird);
    } else {
      ctx.fillStyle = "rgba(0,0,0,.16)";                            // birds fly over a shaded band
      ctx.fillRect(0, GROUND - 10, W, 10);
      for (const b of s.birds) drawBird(b);
      const hx = clamp(s.hunterX, 90, W - 90);
      const face = s.aimX >= hx ? 1 : -1;
      const aimAngle = clamp(Math.atan2(s.aimY - (GROUND - 104), Math.max(60, Math.abs(s.aimX - hx))), -Math.PI, -0.12);
      drawHunter(hx, aimAngle, s.flash, face);
      // crosshair
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(s.aimX, s.aimY, 16, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s.aimX - 26, s.aimY); ctx.lineTo(s.aimX - 8, s.aimY);
      ctx.moveTo(s.aimX + 8, s.aimY); ctx.lineTo(s.aimX + 26, s.aimY);
      ctx.moveTo(s.aimX, s.aimY - 26); ctx.lineTo(s.aimX, s.aimY - 8);
      ctx.moveTo(s.aimX, s.aimY + 8); ctx.lineTo(s.aimX, s.aimY + 26);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,193,89,.6)";
      ctx.beginPath(); ctx.arc(s.aimX, s.aimY, 3, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    for (const f of s.feathers) {
      ctx.save();
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.ellipse(0, 0, f.size, f.size * 0.42, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    for (const f of s.floats) {
      ctx.save();
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color;
      ctx.font = "bold 22px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.82);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.42)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  function renderHud(s) {
    dom.modeChip.textContent = s.mode === "bird" ? "小鸟模式 · Bird" : "猎人模式 · Hunter";
    dom.score.textContent = Math.round(s.score);
    const mult = comboMult(s.combo);
    dom.combo.textContent = s.mode === "hunter" && s.combo >= 2 ? `连击 ${s.combo}  ×${mult}` : "";
    dom.time.textContent = Math.max(0, s.time).toFixed(1);
    dom.time.classList.toggle("low", s.time <= 10);
    dom.timeBar.style.width = (clamp(s.time / DURATION, 0, 1) * 100).toFixed(1) + "%";
    dom.wave.textContent = s.mode === "bird"
      ? "第 " + (1 + Math.floor(s.elapsed / 22)) + " 轮"
      : "第 " + s.wave + " 波";

    if (s.mode === "hunter") {
      const acc = s.shots ? Math.round(s.hits / s.shots * 100) : 0;
      dom.stats.textContent = `命中率 ${acc}% · 最高连击 ${s.bestStreak}`;
      dom.reloadHint.textContent = s.reloading > 0 ? "换弹中…" : s.ammo === 0 ? "按 R 换弹" : "";
      let pips = "";
      for (let i = 0; i < MAG; i++) pips += `<i class="${i < s.ammo ? "" : "empty"}"></i>`;
      pips += `<span class="magtext">${s.ammo}/${MAG}</span>`;
      dom.mag.innerHTML = pips;
      dom.hint.textContent = "左键 / 空格 开火 · 别打蓝色「护」标";
    } else {
      dom.stats.textContent = `浆果 ${s.collected} · 躲过 ${s.dodged}`;
      dom.reloadHint.textContent = s.bird.inv > 0 ? "受击无敌 " + s.bird.inv.toFixed(1) + "s" : "";
      let pips = "";
      for (let i = 0; i < 3; i++) pips += `<i class="heart">${i < s.bird.hp ? "💙" : "🖤"}</i>`;
      pips += `<span class="magtext">${Math.max(0, s.bird.hp)}/3</span>`;
      dom.mag.innerHTML = pips;
      dom.hint.textContent = "方向键 / WASD 或鼠标飞行 · 躲开红线后的弹丸";
    }
  }

  // -------------------------------------------------------------------- input
  window.addEventListener("resize", resize);
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    input.aimX = (e.clientX - r.left) / r.width * W;
    input.aimY = (e.clientY - r.top) / r.height * H;
    input.pointer = true;
  });
  canvas.addEventListener("pointerdown", e => {
    sfx.init();
    const r = canvas.getBoundingClientRect();
    input.aimX = (e.clientX - r.left) / r.width * W;
    input.aimY = (e.clientY - r.top) / r.height * H;
    input.pointer = true;
    if (G.phase === "menu") { newRun(G); return; }
    if (G.phase === "over") { newRun(G); return; }
    if (G.phase === "playing" && G.mode === "hunter") fire(G, input.aimX, input.aimY);
  });
  window.addEventListener("contextmenu", e => e.preventDefault());

  el("hunterBtn").addEventListener("click", () => { G.mode = "hunter"; sfx.init(); newRun(G); });
  el("birdBtn").addEventListener("click", () => { G.mode = "bird"; sfx.init(); newRun(G); });
  el("againBtn").addEventListener("click", () => newRun(G));
  el("menuBtn").addEventListener("click", () => {
    G.phase = "menu";
    dom.menu.hidden = false; dom.over.hidden = true; dom.pause.hidden = true;
    dom.bestNote.textContent = "猎人最佳 " + bestScore("hunter") + " 分 · 小鸟最佳 " + bestScore("bird") + " 分";
  });

  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
    input.keys.add(k);
    if (k === "enter") { if (G.phase === "menu" || G.phase === "over") newRun(G); }
    else if (k === "r" && G.mode === "hunter") reload(G);
    else if (k === "p" || k === "escape") {
      if (G.phase === "playing") { G.phase = "paused"; dom.pause.hidden = false; }
      else if (G.phase === "paused") { G.phase = "playing"; dom.pause.hidden = true; }
    }
    else if (k === " ") { if (G.phase === "playing" && G.mode === "hunter") fire(G, input.aimX, clamp(input.aimY, 60, GROUND - 40)); }
    else if (k === "m") { sfx.muted = !sfx.muted; }
    else if (k === "t") {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    }
    else if (k === "h" && G.phase === "menu") { G.mode = "hunter"; dom.modeChip.textContent = "猎人模式 · Hunter"; }
    else if (k === "b" && G.phase === "menu") { G.mode = "bird"; dom.modeChip.textContent = "小鸟模式 · Bird"; }
  });
  window.addEventListener("keyup", e => input.keys.delete(e.key.toLowerCase()));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && G.phase === "playing") { G.phase = "paused"; dom.pause.hidden = false; }
  });

  // ---------------------------------------------------------------- core export
  const core = {
    createRng, pickSpecies, speciesWeight, makeBird, spawnInterval, maxBirds,
    comboMult, grade, hitTest, scatter, leadPoint, SPECIES, SPECIES_LIST,
  };

  // --------------------------------------------------------------- self test
  function runSelfTest() {
    const out = [];
    const ok = (name, cond) => out.push([name, !!cond]);

    // 1. rng
    const a = createRng(7), b = createRng(7);
    ok("rng is seeded", a() === b());
    const r = createRng(1234);
    let inRange = true;
    for (let i = 0; i < 200; i++) { const v = r(); if (!(v >= 0 && v < 1)) inRange = false; }
    ok("rng stays in [0,1)", inRange);

    // 2. species spawn coverage + wave shift
    const rng1 = createRng(99);
    const seen = new Set();
    for (let i = 0; i < 800; i++) seen.add(pickSpecies(rng1, 1).key);
    ok("all species spawn", seen.size === SPECIES_LIST.length);
    const craneW1 = speciesWeight(SPECIES.crane, 1), craneW8 = speciesWeight(SPECIES.crane, 8);
    const sparW1 = speciesWeight(SPECIES.sparrow, 1), sparW8 = speciesWeight(SPECIES.sparrow, 8);
    ok("protected birds get commoner later", craneW8 > craneW1 && sparW8 < sparW1);
    let craneShare1 = 0, craneShare8 = 0;
    const rA = createRng(5), rB = createRng(5);
    for (let i = 0; i < 1500; i++) { if (pickSpecies(rA, 1).protected) craneShare1++; if (pickSpecies(rB, 8).protected) craneShare8++; }
    ok("crane share grows with wave", craneShare8 > craneShare1, craneShare1 + " -> " + craneShare8);

    // 3. bird spawn stays inside the playable sky
    const rng2 = createRng(4242);
    let inSky = true;
    for (let i = 0; i < 400; i++) {
      const bd = makeBird(rng2, 3);
      if (bd.baseY < SKY.top || bd.baseY > SKY.bottom) inSky = false;
      if (!(bd.vx > 0) || (bd.dir !== 1 && bd.dir !== -1)) inSky = false;
      if (bd.x !== -60 && bd.x !== W + 60) inSky = false;
    }
    ok("spawned birds stay in bounds", inSky);

    // 4. hitTest
    const hb = { sp: SPECIES.mallard, state: "fly", x: 600, y: 300 };
    const far = { sp: SPECIES.sparrow, state: "fly", x: 900, y: 300 };
    ok("hitTest finds the bird under the point", hitTest([hb, far], 606, 306) === hb);
    ok("hitTest misses empty sky", hitTest([hb, far], 500, 500) === null);
    const near = { sp: SPECIES.mallard, state: "fly", x: 603, y: 302 };
    ok("hitTest prefers the closest bird", hitTest([far, near], 604, 303) === near);
    ok("hitTest ignores falling birds", hitTest([{ sp: SPECIES.mallard, state: "fall", x: 600, y: 300 }], 600, 300) === null);

    // 5. scoring / combo / grade
    ok("combo starts at 1x", comboMult(2) === 1 && comboMult(3) === 1.5);
    ok("combo caps at 5x", comboMult(100) === 5);
    ok("grades descend", grade(9999, "hunter") === "S" && grade(0, "hunter") === "E");
    ok("bird-mode grades are separate", grade(1900, "bird") === "S" && grade(1500, "bird") === "A" && grade(1500, "hunter") === "C");

    // 6. hunter-mode fire / ammo / reload on a scratch state
    const s = makeState("hunter");
    s.rng = createRng(3);
    s.phase = "playing";
    s.birds = [];
    ok("empty sky cannot be hit", fire(s, 300, 200) === false && s.shots === 1 && s.ammo === MAG - 1);
    const target = { sp: SPECIES.mallard, state: "fly", x: 300, y: 200, baseY: 200, dir: 1, vx: 120, amp: 10, phase: 0, flapRate: 5, scared: 0, dead: false };
    s.birds = [target];
    s.score = 0; s.combo = 0; s.ammo = MAG;
    ok("normal bird scores and combos", fire(s, 300, 200) === true && s.score === 150 && s.combo === 1 && target.state === "fall");
    s.combo = 3;
    s.ammo = MAG;
    const t2 = { sp: SPECIES.pheasant, state: "fly", x: 400, y: 240, baseY: 240, dir: 1, vx: 140, amp: 10, phase: 0, flapRate: 5, scared: 0, dead: false };
    s.birds = [t2];
    const before = s.score;
    fire(s, 400, 240);
    ok("combo multiplies the score", s.score - before === 450, "gained " + (s.score - before));
    s.ammo = MAG; s.score = 500; s.combo = 4; s.penalties = 0;
    const cr = { sp: SPECIES.crane, state: "fly", x: 500, y: 260, baseY: 260, dir: 1, vx: 100, amp: 8, phase: 0, flapRate: 4, scared: 0, dead: false };
    s.birds = [cr];
    fire(s, 500, 260);
    ok("protected bird is penalised", s.score === 300 && s.penalties === 1 && s.combo === 0 && s.birds[0].state === "fly");
    s.ammo = 0; s.shots = 0;
    fire(s, 100, 100);
    ok("empty magazine cannot fire", s.shots === 0);
    s.ammo = 2;
    reload(s);
    ok("reload locks the weapon", s.reloading === RELOAD_TIME);
    for (let i = 0; i < 80; i++) update(s, 1 / 60);
    ok("reload refills the magazine", s.ammo === MAG);

    // 7. a shot scares nearby birds
    const f1 = { sp: SPECIES.sparrow, state: "fly", x: 400, y: 300, baseY: 300, dir: 1, vx: 150, amp: 10, phase: 0, flapRate: 5, scared: 0, dead: false };
    const f2 = { sp: SPECIES.sparrow, state: "fly", x: 1150, y: 300, baseY: 300, dir: 1, vx: 150, amp: 10, phase: 0, flapRate: 5, scared: 0, dead: false };
    scatter([f1, f2], 400, 300, 300);
    ok("shots startle nearby birds only", f1.scared > 0 && f1.vx > 150 && f2.scared === 0 && f2.vx === 150);

    // 8. lead aiming
    const mover = { x: 400, y: 300, vx: 200, dir: 1 };
    const lp = leadPoint(mover, 0, 300, 400);
    ok("leadPoint aims ahead of a mover", lp.x > mover.x && lp.y === mover.y);

    // 9. bird mode: pellet hit costs a feather and grants invulnerability
    const bs = makeState("bird");
    bs.rng = createRng(11);
    bs.phase = "playing";
    bs.hunter.cool = 1e9;
    bs.bird.x = 600; bs.bird.y = 300; bs.bird.vx = 0; bs.bird.vy = 0;
    bs.pellets = [{ x: 600, y: 300, vx: 0, vy: 0, life: 1 }];
    update(bs, 1 / 60);
    ok("pellet costs a feather", bs.bird.hp === 2 && bs.bird.inv > 0);
    bs.pellets = [{ x: 600, y: 300, vx: 0, vy: 0, life: 1 }];
    update(bs, 1 / 60);
    ok("invulnerability blocks a second hit", bs.bird.hp === 2);

    // 10. bird mode: berry collection
    const bs2 = makeState("bird");
    bs2.rng = createRng(12);
    bs2.phase = "playing";
    bs2.hunter.cool = 1e9;
    bs2.bird.x = 600; bs2.bird.y = 300; bs2.bird.vx = 0; bs2.bird.vy = 0;
    bs2.berries = [{ x: 610, y: 305, vy: 0, gold: false, t: 0 }];
    const score0 = bs2.score;
    update(bs2, 1 / 60);
    ok("berries are collected for points", bs2.collected === 1 && bs2.berries.length === 0 && bs2.score > score0);

    // 11. bird mode: player stays inside the play bounds
    const bs3 = makeState("bird");
    bs3.rng = createRng(13);
    bs3.phase = "playing";
    bs3.hunter.cool = 1e9;
    bs3.bird.x = 60; bs3.bird.y = 120; bs3.bird.vx = -900; bs3.bird.vy = -900;
    for (let i = 0; i < 30; i++) update(bs3, 1 / 60);
    ok("player bird is clamped to the sky", bs3.bird.x >= 40 && bs3.bird.x <= W - 40 && bs3.bird.y >= SKY.top - 1 && bs3.bird.y <= SKY.bottom + 32);

    // 12. bird mode: hunter volley grows and pellets fly
    const bs4 = makeState("bird");
    bs4.rng = createRng(14);
    bs4.phase = "playing";
    bs4.elapsed = 50;
    bs4.hunter.aimT = 0.001;
    bs4.hunter.aimAt = { x: 400, y: 260 };
    const p0 = bs4.pellets.length;
    update(bs4, 1 / 60);
    ok("hunter volley fires pellets", bs4.pellets.length > p0 && bs4.pellets.length >= 3);

    // 13. run ends: hunter on the clock, bird on feathers
    const es = makeState("hunter");
    es.rng = createRng(15);
    es.phase = "playing"; es.time = 0.01;
    update(es, 0.05);
    ok("clock expiry ends a hunter run", es.phase === "over");
    const es2 = makeState("bird");
    es2.rng = createRng(16);
    es2.phase = "playing";
    es2.bird.hp = 1; es2.bird.inv = 0; es2.bird.x = 600; es2.bird.y = 300;
    es2.hunter.cool = 1e9;
    es2.pellets = [{ x: 600, y: 300, vx: 0, vy: 0, life: 1 }];
    update(es2, 1 / 60);
    ok("losing the last feather ends a bird run", es2.phase === "over" && es2.bird.hp === 0);

    // 14. theme toggle
    const themeBefore = document.documentElement.dataset.theme;
    document.documentElement.dataset.theme = themeBefore === "light" ? "dark" : "light";
    ok("theme can be toggled", document.documentElement.dataset.theme !== themeBefore);
    document.documentElement.dataset.theme = themeBefore;

    // 15. layout: no horizontal overflow
    ok("no horizontal overflow", document.documentElement.scrollWidth <= window.innerWidth + 2);

    // 16. canvas actually has pixels (renders, not blank)
    renderHud(G);
    G.phase = "paused";
    renderSceneForTest(G);
    G.phase = "menu";
    const px = ctx.getImageData(Math.round(canvas.width * 0.5), Math.round(canvas.height * 0.4), 1, 1).data;
    const px2 = ctx.getImageData(Math.round(canvas.width * 0.2), Math.round(canvas.height * 0.85), 1, 1).data;
    ok("canvas is not blank", (px[0] + px[1] + px[2] > 0) || (px2[0] + px2[1] + px2[2] > 0));

    // 17. public API surface
    ok("dev API is exposed", typeof window.hunterBird === "object" && typeof window.hunterBird.step === "function");

    const fails = out.filter(x => !x[1]).length;
    // The checks above ran on scratch states (and one of them drove a run to
    // its ending), so put the visible game back into a clean starting state and
    // let a few seconds pass so the backdrop shows real birds.
    newRun(G);
    for (let i = 0; i < 900; i++) update(G, 1 / 60);
    render(G); renderHud(G);
    const box = document.createElement("div");
    box.id = "selftest";
    box.innerHTML = "<b>SELFTEST " + (out.length - fails) + "/" + out.length + " passed</b><br>" +
      out.map(x => (x[1] ? "PASS " : "FAIL ") + x[0]).join("<br>");
    document.body.appendChild(box);
    document.title = "[selftest " + (out.length - fails) + "/" + out.length + "] 猎人与鸟 · Hunter and Bird";
    return { passed: out.length - fails, total: out.length };
  }

  /** Draw one frame without advancing the clock (used by the pixel check / captures). */
  function renderSceneForTest(s) {
    drawScene(s.elapsed, s);
  }
  function render(s) { drawScene(s.elapsed, s); }

  // --------------------------------------------------------------------- boot
  document.documentElement.dataset.theme = SHELL_LIGHT ? "light" : "dark";
  resize();
  dom.bestNote.textContent = "猎人最佳 " + bestScore("hunter") + " 分 · 小鸟最佳 " + bestScore("bird") + " 分";
  G.time = DURATION;
  renderHud(G);
  if (AUTOSTART || AUTO) newRun(G);

  window.hunterBird = {
    state: () => G, set: k => { G.mode = k; }, core, makeState, newRun, update,
    step: dt => update(G, dt || 1 / 60),
    stepState: (s, dt) => update(s, dt || 1 / 60),
    render: s => renderSceneForTest(s || G),
    fire, reload, dims: { W, H, GROUND, SKY },
  };

  let prev = 0;
  function frame(ts) {
    const dt = Math.min(0.034, prev ? (ts - prev) / 1000 : 0.016);
    prev = ts;
    if (G.phase === "playing") update(G, dt);
    render(G);
    requestAnimationFrame(frame);
  }

  if (STEPS !== null) {
    newRun(G);
    for (let i = 0; i < STEPS; i++) update(G, 1 / 60);
    render(G);
    const pre = document.createElement("pre");
    pre.id = "devstats";
    pre.textContent = JSON.stringify({
      mode: G.mode, phase: G.phase, score: Math.round(G.score), hits: G.hits, shots: G.shots,
      combo: G.combo, ammo: G.ammo, birds: G.birds.length, wave: G.wave, time: +G.time.toFixed(1),
      hp: G.bird.hp, pellets: G.pellets.length, berries: G.berries.length, collected: G.collected,
      elapsed: +G.elapsed.toFixed(1), auto: AUTO, seed: SEED,
    });
    if (q.has("devstats")) document.body.appendChild(pre);
    document.title = "[steps " + STEPS + "] " + document.title;
  } else if (SELFTEST) {
    newRun(G);
    runSelfTest();
    G.phase = "paused";            // show the tested state, but stop the clock
    requestAnimationFrame(frame);  // keep the canvas painted across resizes
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
