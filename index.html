<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="dome-sa 页面导航首页：汇总仓库里所有的游戏、学习页面与故事动画，一处点击即可跳转。单文件 HTML，离线可用。">
<title>页面导航 · dome-sa</title>
<style>
:root{
  --bg:#f5f7fb; --bg2:#e9edf5; --card:#ffffff; --ink:#1c2438; --muted:#5d6a84;
  --line:rgba(28,36,56,.12); --shadow:0 10px 28px rgba(28,36,56,.10);
  --play:#e8842c; --learn:#2e7d52; --story:#4a6fd4; --accent:#2f6fe2;
}
[data-theme="dark"]{
  --bg:#0b1020; --bg2:#131a2e; --card:#182034; --ink:#e8eefb; --muted:#94a2c2;
  --line:rgba(232,238,251,.14); --shadow:0 14px 34px rgba(0,0,0,.45);
  --play:#ffb066; --learn:#7fd6a4; --story:#8fb0ff; --accent:#4aa8ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1100px 600px at 80% -10%,var(--bg2),var(--bg) 70%);
  color:var(--ink); min-height:100vh; padding:26px 18px 40px;
  transition:background .3s,color .3s;
}
.wrap{max-width:1060px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(22px,3.6vw,34px);letter-spacing:.02em}
h1 .dot{color:var(--accent)}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.8;max-width:62ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13.5px;
  transition:transform .12s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:999px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:4px 8px 4px 14px}
.search input{border:none;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;width:150px}
.search span{color:var(--muted);font-size:14px}
.group{margin-top:26px}
.group h2{margin:0 0 4px;font-size:clamp(15px,2vw,18px);display:flex;align-items:center;gap:9px}
.group h2 .bar{width:5px;height:20px;border-radius:3px}
.group .hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;
  box-shadow:var(--shadow);transition:transform .14s,border-color .2s;position:relative}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.emoji{font-size:30px;line-height:1}
.name{font-size:16.5px;font-weight:700}
.name small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px;letter-spacing:.03em}
.desc{margin:0;font-size:13px;color:var(--muted);line-height:1.65;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.chip{font-size:11px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.go{font-size:12.5px;font-weight:700;color:var(--accent)}
.empty{display:none;margin-top:30px;text-align:center;color:var(--muted);font-size:14px}
footer{margin-top:34px;color:var(--muted);font-size:12.5px;line-height:1.8;text-align:center}
#selftest{display:none;margin-top:22px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 16px;font-size:12.5px;line-height:1.9}
#selftest.show{display:block}
#selftest b.ok{color:var(--learn)} #selftest b.bad{color:#e05c5c}
@media (max-width:560px){ body{padding:18px 12px 30px} .grid{grid-template-columns:1fr 1fr;gap:10px}
  a.card{padding:12px} .name{font-size:14px} .desc{display:none} }
@media (max-width:400px){ .grid{grid-template-columns:1fr} .desc{display:block} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🗂 页面导航<span class="dot"> · </span>dome-sa</h1>
      <p class="sub">这里汇总了本仓库所有的单文件页面：游戏、学习乐园、故事绘本和实用工具。点开任意卡片即可跳转，全部离线可玩、零依赖。</p>
    </div>
    <div class="tools">
      <span class="search"><span>🔍</span><input id="q" type="search" placeholder="搜索页面…" aria-label="搜索页面"></span>
      <span class="seg" id="seg">
        <button data-f="all" class="on">全部</button>
        <button data-f="play">游戏</button>
        <button data-f="learn">学习</button>
        <button data-f="story">故事·动画</button>
        <button data-f="tool">工具</button>
      </span>
      <button id="themeBtn">🌙 深色</button>
    </div>
  </header>

  <main id="main"></main>
  <div class="empty" id="empty">😶 没有匹配的页面，换个关键词试试。</div>

  <div id="selftest"></div>
  <footer>共 <span id="count">0</span> 个页面 · 每个页面都是单文件 HTML，双击即可打开</footer>
</div>

<script>
'use strict';
/* 页面清单：与仓库根目录下的 *.html 一一对应（本页自身除外）。 */
const PAGES = [
  { file:'hunter-bird-game.html', emoji:'🏹', name:'猎人与鸟', en:'Hunter and Bird',
    desc:'三种玩法：猎人打飞鸟、小鸟躲弹丸，还有带图的单词模式。', cat:'play', tags:'射击 鸟 猎人 反应 单词' },
  { file:'pingpong-game.html', emoji:'🏓', name:'乒乓球', en:'Table Tennis',
    desc:'带重力、弹跳、擦网与真实发球规则的俯视角乒乓球，11 分制。', cat:'play', tags:'乒乓球 运动 对战 ai' },
  { file:'idiom-driving.html', emoji:'🚗', name:'成语大飞车', en:'Idiom Drive',
    desc:'四条车道接住缺的那个字，补全成语并大声读给你听。', cat:'learn', tags:'成语 语文 开车 识字' },
  { file:'english-game.html', emoji:'🎢', name:'英语过山车', en:'English Word Coaster',
    desc:'看图听音选单词，答对一次过山车就往前跑，四个年级词库。', cat:'learn', tags:'英语 单词 小学 背词' },
  { file:'random-math.html', emoji:'🎲', name:'随机计算', en:'Random Math',
    desc:'随机出加减乘除口算题，四个年级难度、限时或固定题数，即时判分并给出星级与最佳成绩。', cat:'learn', tags:'口算 数学 加减乘除 心算 小学' },
  { file:'tortoise-hare-race.html', emoji:'🐢', name:'小兔和乌龟赛跑', en:'Tortoise and Hare',
    desc:'伊索寓言互动动画：兔子打盹还是抢跑，每局都不一样。', cat:'story', tags:'龟兔赛跑 动画 寓言' },
  { file:'earth-moon-story.html', emoji:'🌍', name:'地球和月球自传', en:'Earth & Moon',
    desc:'两个第一人称声音讲述四十五亿年的共同往事，可播放时间轴。', cat:'story', tags:'地球 月球 宇宙 时间轴 科普' },
  { file:'word-copy.html', emoji:'📁', name:'Word 文件复制', en:'Word File Copy',
    desc:'填好源/目标两个目录点一下，递归拷走全部 Word 文档，同名自动改名不覆盖。', cat:'tool', tags:'word 复制 文件 目录 工具 docx' }
];

const GROUPS = {
  play:  { title:'🎮 小游戏',       color:'var(--play)',  hint:'点开即玩，全部纯离线' },
  learn: { title:'📚 学习乐园',     color:'var(--learn)', hint:'边玩边学：成语与英语单词' },
  story: { title:'📖 故事 · 动画',  color:'var(--story)', hint:'可以播放、可以翻阅的故事' },
  tool:  { title:'🧰 实用工具',     color:'var(--accent)', hint:'配合本机助手的小工具页面' }
};

const $ = id => document.getElementById(id);
const main = $('main');
const qs = new URLSearchParams(location.search);

function card(p){
  const a = document.createElement('a');
  a.className = 'card'; a.href = p.file;
  a.dataset.cat = p.cat;
  a.dataset.keys = (p.name + ' ' + p.en + ' ' + p.desc + ' ' + p.tags).toLowerCase();
  a.innerHTML =
    '<span class="emoji">' + p.emoji + '</span>' +
    '<span class="name"></span><p class="desc"></p>' +
    '<span class="meta"><span class="chip"></span><span class="go">进入 →</span></span>';
  a.querySelector('.name').innerHTML = escapeHtml(p.name) +
    '<small>' + escapeHtml(p.en) + '</small>';
  a.querySelector('.desc').textContent = p.desc;
  a.querySelector('.chip').textContent = GROUPS[p.cat].title.replace(/^\S+\s/, '');
  a.title = p.file;
  return a;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

for (const key of ['play','learn','story','tool']){
  const g = document.createElement('section');
  g.className = 'group'; g.dataset.group = key;
  g.innerHTML = '<h2><span class="bar" style="background:' + GROUPS[key].color + '"></span>' +
    GROUPS[key].title + '</h2><p class="hint">' + GROUPS[key].hint + '</p>';
  const grid = document.createElement('div'); grid.className = 'grid';
  PAGES.filter(p => p.cat === key).forEach(p => grid.appendChild(card(p)));
  g.appendChild(grid);
  main.appendChild(g);
}
$('count').textContent = PAGES.length;

/* ---- 过滤：分类 + 关键词，两者叠加 ---- */
let filterCat = 'all';
function applyFilter(){
  const kw = $('q').value.trim().toLowerCase();
  let visible = 0;
  main.querySelectorAll('.group').forEach(sec => {
    let shown = 0;
    sec.querySelectorAll('a.card').forEach(c => {
      const okCat = filterCat === 'all' || c.dataset.cat === filterCat;
      const okKw = !kw || c.dataset.keys.includes(kw);
      const on = okCat && okKw;
      c.style.display = on ? '' : 'none';
      if (on) shown++;
    });
    sec.style.display = shown ? '' : 'none';
    visible += shown;
  });
  $('empty').style.display = visible ? 'none' : 'block';
}
$('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filterCat = b.dataset.f;
  [...$('seg').children].forEach(x => x.classList.toggle('on', x === b));
  applyFilter();
});
$('q').addEventListener('input', applyFilter);

/* ---- 主题：跟随系统，可手动切换，?theme= 可强制 ---- */
let dark = qs.get('theme') === 'dark' ||
  (qs.get('theme') !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('themeBtn').textContent = dark ? '☀️ 浅色' : '🌙 深色';
}
$('themeBtn').addEventListener('click', () => { dark = !dark; applyTheme(); });
applyTheme();

/* ---- 页内自检：?selftest=1 ---- */
if (qs.get('selftest') === '1'){
  const out = [];
  const T = (cond, label) => out.push((cond ? '✅ ' : '❌ ') + label);
  const cards = [...main.querySelectorAll('a.card')];
  T(cards.length === PAGES.length, '卡片数量 = 页面清单（' + cards.length + '/' + PAGES.length + '）');
  T(cards.every(c => /^[\w-]+\.html$/.test(c.getAttribute('href'))), '每个链接都指向同目录的 .html 文件');
  T(new Set(cards.map(c => c.getAttribute('href'))).size === PAGES.length, '链接不重复');
  T(PAGES.every(p => GROUPS[p.cat]), '每个页面的分类都存在');
  filterCat = 'play'; applyFilter();
  T(main.querySelectorAll('a.card:not([style*="none"])').length ===
    PAGES.filter(p => p.cat === 'play').length, '按「游戏」过滤数量正确');
  filterCat = 'tool'; applyFilter();
  T(main.querySelectorAll('a.card:not([style*="none"])').length ===
    PAGES.filter(p => p.cat === 'tool').length, '按「工具」过滤数量正确');
  filterCat = 'all';
  $('q').value = '乒乓'; applyFilter();
  T(main.querySelectorAll('a.card:not([style*="none"])').length === 1, '关键词「乒乓」只命中 1 个');
  $('q').value = 'zzzz不存在'; applyFilter();
  T($('empty').style.display === 'block', '无结果时显示空态');
  $('q').value = ''; filterCat = 'all'; applyFilter();
  T(dark ? document.documentElement.dataset.theme === 'dark'
        : document.documentElement.dataset.theme !== 'dark', '主题按参数/系统偏好生效');
  const bad = out.filter(l => l.startsWith('❌')).length;
  const box = $('selftest'); box.classList.add('show');
  box.innerHTML = '<b class="' + (bad ? 'bad' : 'ok') + '">自检 ' +
    (bad ? bad + ' 项未过' : '全部通过') + '</b>（共 ' + out.length + ' 项）<br>' +
    out.map(escapeHtml).join('<br>');
}
</script>
</body>
</html>
