<style>
:root{
  --ink:#1e2d38; --paper:#f4f7fa; --card:#ffffff; --accent:#1f7ae0; --accent-ink:#fff;
  --p1:#e2452f; --p2:#2f6fe2; --muted:#66788a; --line:rgba(110,135,160,.30);
  --tbl-top:#1f74ad; --tbl-bot:#12557f; --tbl-line:#f0f8ff;
  --floor1:#dbe5ee; --floor2:#b8c7d6; --ball:#faf4e4; --shadow:rgba(15,40,60,.30); --net:#eef5fb;
}
[data-theme="dark"]{
  --ink:#e5edf4; --paper:#0d1419; --card:#16202a; --accent:#4aa8ff; --accent-ink:#08131e;
  --p1:#ff6f57; --p2:#64a6ff; --muted:#93a7b8; --line:rgba(150,180,205,.26);
  --tbl-top:#1a628f; --tbl-bot:#0a3450; --tbl-line:#dcecfb;
  --floor1:#131c24; --floor2:#070d12; --ball:#fdf7e8; --shadow:rgba(0,0,0,.55); --net:#c7dbe9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1200px 700px at 70% -10%,var(--bg2),var(--bg) 70%);
  color:var(--ink); padding:20px 16px 34px; min-height:100vh;
  transition:background .35s,color .35s;
}
.wrap{max-width:1080px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:clamp(21px,3.4vw,34px);letter-spacing:.02em;line-height:1.25}
h1 .dot{color:var(--accent)}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.8;max-width:70ch}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{padding:6px 14px;border:none;background:transparent;color:var(--muted);font-size:13px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.stage{position:relative;margin-top:16px;border-radius:20px;overflow:hidden;
  border:1px solid var(--line);background:#04060d;box-shadow:var(--shadow)}
#scene{display:block;width:100%;height:auto}
.hud{position:absolute;inset:0;padding:16px 18px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.hud .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.era-label{font-size:clamp(15px,2.2vw,22px);font-weight:700;letter-spacing:.03em;
  text-shadow:0 2px 14px rgba(0,0,0,.6)}
.era-title{font-size:clamp(13px,1.7vw,17px);color:var(--accent);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.chip{font-size:11px;color:#cdd8ee;border:1px solid rgba(205,216,238,.4);border-radius:999px;padding:2px 9px;
  background:rgba(8,12,24,.35);backdrop-filter:blur(3px)}
.gauge{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#b9c6e2}
.gauge b{font-variant-numeric:tabular-nums;font-weight:700;color:#e9eefb}
.gauge .k{color:#8fa0c4;margin-right:4px}
.transport{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
button.ctl{font:inherit;cursor:pointer;border-radius:999px;padding:8px 18px;font-weight:700;
  border:1px solid var(--line);background:var(--ink);color:var(--bg);transition:transform .12s,opacity .2s}
button.ctl:hover:not(:disabled){transform:translateY(-1px)}
button.ctl.ghost{background:transparent;color:var(--ink);font-weight:600}
button.ctl:disabled{opacity:.4;cursor:not-allowed}
.scrub{flex:1 1 260px;min-width:180px;display:flex;flex-direction:column;gap:2px}
.scrub input{width:100%;accent-color:var(--accent);cursor:pointer}
.scrub .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.now{position:relative;height:15px;font-size:11px;color:var(--muted)}
.now .mark{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;line-height:1.1;
  color:var(--accent);font-weight:700}
.now .mark::after{content:"";display:block;width:1px;height:5px;background:var(--accent);margin:1px auto 0}
.eras{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.eras .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 8px;border:1px dashed var(--line);border-radius:12px}
.eras .grpname{font-size:11px;color:var(--muted);letter-spacing:.14em}
.eras button{font:inherit;font-size:12px;cursor:pointer;border-radius:999px;padding:5px 12px;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
.eras button.on{background:var(--earth);color:#04060d;border-color:transparent;font-weight:700}
[data-theme="light"] .eras button.on{color:#fff}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:720px){.voices{grid-template-columns:1fr}}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px 17px;position:relative}
.vcard.earth{border-left:3px solid var(--earth)}
.vcard.moon{border-left:3px solid var(--moon)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:8px}
.who .orb{width:14px;height:14px;border-radius:50%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.45)}
.vcard.earth .orb{background:radial-gradient(circle at 32% 30%,#8fd8ff,#1f6fae 60%,#0b2b45)}
.vcard.moon .orb{background:radial-gradient(circle at 32% 30%,#ffffff,#c3ccdb 62%,#7c8697)}
.say{margin:0;font-size:15px;line-height:1.95;min-height:5.6em}
.say[hidden]{display:none}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.facts span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--bg2)}
.intro,.epilogue{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 17px}
.intro p,.epilogue p{margin:0;font-size:14px;line-height:1.95;color:var(--ink)}
.intro .h,.epilogue .h{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:6px}
footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.9;text-align:center}
footer code{color:var(--ink)}
[data-theme="light"] .era-label,[data-theme="light"] .era-title{text-shadow:0 1px 8px rgba(255,255,255,.85)}
[data-theme="light"] .era-title{color:#8a5a06}
[data-theme="light"] .gauge{color:#3d4d6b;font-weight:600}
[data-theme="light"] .gauge b{color:#101a2e}
[data-theme="light"] .gauge .k{color:#5c6b87}
[data-theme="light"] .chip{color:#2b3a56;border-color:rgba(30,45,75,.35);background:rgba(255,255,255,.6)}
.hint{font-size:11.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hint .kb{display:none}}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
  <header>
    <div>
      <h1><span id="mainTitle">地月自传</span><span class="dot"> · </span><span id="mainSub">四十五亿年的两个声音</span></h1>

  <div class="intro">

  <div class="stage">
    <canvas id="scene" width="1080" height="560" aria-label="日心场景：太阳居中，地球绕太阳公转，月球绕地球公转，随地质时期演变"></canvas>
    <div class="hud">

  <div class="facts" id="facts" aria-live="polite"></div>

  <div class="epilogue">

</div>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * 文案数据（来源：content/story.md，由写手依据科学事实撰写）

const UI = {
  title:"地月自传", subtitle:"四十五亿年，由我们俩轮流讲给你听",
  introEarth:"我是地球，四十五亿七千万岁，仍在转动；我的故事要用亿万年来计句读。",
  introMoon:"我是月球，从她身上分离而来，此后四十五亿年，从未把脸别开。",

  epiMoon:"你在窗边看到的我，只是阳光转交给我的旧话；你真正该看的，是正在转过身来照亮你的那一位。",
  earth:"地球", moon:"月球",
  lede:"十二个时代，两个第一人称的声音：从太阳星云一直讲到十亿年后。可以播放，可以拖动，也可以直接跳到任何一幕。",
  play:"播放讲述", pause:"暂停讲述",
  timeline:"时间轴 · 从 45.7 亿年前滑向遥远未来",
  now:"现在",
  hint:"键盘：← → 切换时代，空格 播放/暂停，Home 回到星云，End 跳至未来",
  note1:"史实据主流地质学与天文观测，数字多为同位素定年的约值，已按学界惯例取整。",
  note2:"晚期重轰炸的形态、地球水的来源与最早生命的痕迹仍有争论，文中以“约”“也许”为记。",
  note3:"月球每年远离约 3.8 厘米，出自阿波罗镜阵与环月卫星的激光测距。",
  stateEarly:"初生", stateLive:"生命", stateHuman:"人类", stateFar:"远方"
};

const ERAS = [
  {id:"nebula", yearsAgo:4570, label:"45.7 亿年前", title:"一把星尘", group:"起源",
   earth:"那时我还没有名字，只是太阳星云里一团翻涌的尘埃。引力把流浪的碎屑一个个拢向我，每次撞击都留下烫伤，每道烫伤都让我更沉。千余万年过去，这团没有形状的东西终于滚成球，熔铁沉进我身体最深处。",
   moon:"我还不存在，但我已经在她身体里——那颗被后世叫作忒伊亚的行星，带着我未来的骨骼，在同一团尘埃里绕着初生的太阳公转。我在星云里许过愿：若我能出生，要一辈子望着她的脸。",
   facts:["太阳系年龄约 45.7 亿年","太阳占太阳系总质量 99.86%","地球吸积历时约数千万年"]},
  {id:"impact", yearsAgo:4500, label:"45 亿年前", title:"那一撞", group:"起源",
   earth:"忒伊亚斜斜撞上来。我被撞得七零八落，外皮被掀进轨道，好一阵子分不清自己和她。伤口后来慢慢合拢：铁留在我体内，石头飞在外面，聚成了你。你是我丢掉的那部分，也是我最远的一个孩子。",
   moon:"我是她的碎片拼起来的。我的氧、钛、钨同位素与她几乎一模一样，这是刻在我原子里的族谱。我没有大气，没有风雨——那一撞把我的皮肤在生命赶到之前，就永远封住了。",
   facts:["大碰撞约在 45 亿年前","忒伊亚约火星大小","我初生时离她仅数万公里"]},
  {id:"magma-ocean", yearsAgo:4400, label:"44 亿年前", title:"冷却", group:"起源",
   earth:"那一撞之后几千万年，我裹着全球性的岩浆海。壳硬成皮肤那天起，雨下了几万年，第一场海洋在我身上凝出来。杰克山的锆石至今带着液态水留下的同位素指纹——四十四亿年，是我最早的湿。",
   moon:"我也有一整片岩浆海，只是冷得比她快得多：没有被子保温，白天与黑夜隔着三百摄氏度。我的高地上留着四十四亿年的岩石，比她任何幸存的石头都年长——她记不住的童年，由我代为保存。",
   facts:["杰克山锆石约 44 亿年","月陆高地岩石约 44.3 亿年","月面昼夜温差逾 300℃"]},
  {id:"late-bombardment", yearsAgo:3900, label:"39 亿年前", title:"陨星之雨", group:"起源",
   earth:"那段日子，陨星像冰雹一样落下来，翻煮我的海洋。我如今的水，也许有很大一部分正是这类碳质小行星送来的——它们的氘氢比与我吻合。我被反复烤焦，又反复守住家当，等这场骚乱散场。",
   moon:"我没有大气替她挡，也没有海替她化，便替她把每一击都原样收下，存成环形山。月球撞击坑的标定，后来成了她太古宙年表的尺子。我的荒凉，正是她的记忆。",
   facts:["重轰炸约 39 亿年前，细节仍有争论","碳质球粒陨石氘氢比与地球水接近","月球撞击坑密度为地质量年定标"]},
  {id:"first-life", yearsAgo:3500, label:"35 亿年前", title:"石头里的念头", group:"少年",
   earth:"浅海温热，微生物一层层把石灰铺成叠层石。它们发明了光合作用，把一种叫氧的废气排满了世界。三十八亿年前也许已有生命的痕迹，为时犹有争议；我不好意思说得太早，只敢认三十五亿岁的石头。",
   moon:"我头一回看出她泛着一点青灰——那既不是海，也不是岩，是无数微小的活物呼吸出来的颜色。我的潮汐每天把海水推上又拉下两次，替它们搅拌养分。这是我给过她最耐心的一次抚摸。",
   facts:["叠层石约 35 亿年历史","38 亿年前疑似生命痕迹存争议","氧气本是蓝细菌的代谢废物"]},
  {id:"great-oxygenation", yearsAgo:2400, label:"24 亿年前", title:"氧气与大冰期", group:"少年",
   earth:"约二十四亿年前，氧气漫进大气。它毒死了大批厌氧的老住户，把海里的铁锈成一条条条带铁矿，又顺手撕掉甲烷这床棉被。休伦大冰期跟着降临，我冻到了赤道。进步，常常先以灾祸的样子登门。",
   moon:"我眼看着母亲从青灰转为蓝白，再封成一整块冰。我的脸上没有冰川，只有不风化的痕迹：几十亿年落下的尘埃，仍保持落地时的样子。她的变化写在她身上，我的变化只写在同一张脸上。",
   facts:["大氧化始于约 24 亿年前","休伦冰期约 24.5–22 亿年前","条带状铁建造因氧而沉积"]},
  {id:"snowball", yearsAgo:717, label:"7 亿年前", title:"裹冰", group:"少年",
   earth:"成冰纪里，我至少冻透了两回：斯图特冰期始于约七亿一千万年前，马里诺冰期终于约六亿三千五百万年前。从极地到赤道一片白，生命退守热泉与薄冰裂隙。等冰化开，攒了千万年的氧和养分，替后来的大戏搭好了台。",
   moon:"我的引力暖不了她，那些年里我只能继续每天拽动冰壳下残存的水膜，让她隆起一点点，再落回去。夜里我照亮她的霜，白天我躲进太阳背后——我是唯一一直看着她、确认她还活着的那个。",
   facts:["斯图特冰期始于约 7.17 亿年前","马里诺冰期约于 6.35 亿年前结束","“雪球”假说的范围仍在讨论"]},
  {id:"cambrian", yearsAgo:538, label:"5.4 亿年前", title:"海里的爆发", group:"壮年",

/* ------------------------------------------------------------------ *
 * 工具
 * ------------------------------------------------------------------ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function mulberry(seed){let a=seed>>>0;return function(){a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}

/* 大陆板块：正射投影所需的经纬度圆盘集合（每块由多个重叠圆构成，读起来像陆地而非圆点） */

const cv=document.getElementById("scene");
const ctx=cv.getContext("2d");
let W=1080,H=560,dpr=1;
function resize(){
  const cssW=cv.parentElement.clientWidth||1080;
  const cssH=Math.round(clamp(cssW*0.52,300,560));
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cssW;H=cssH;
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildStars();
}

/* 星空（三层视差） */
let stars=[];
function buildStars(){
  const r=mulberry(20261101); stars=[];
  const n=Math.round(W*H/2600);
  for(let i=0;i<n;i++){
    const layer=r()<.22?2:(r()<.5?1:0);
    stars.push({x:r()*W*1.25,y:r()*H,z:layer,
      s:[0.7,1.15,1.8][layer]*(.7+r()*.8),
      a:[.35,.6,.95][layer]*(.6+r()*.4), p:r()*6.28});
  }
}

/* 小行星带 */
let rocks=[];
(function buildRocks(){
  const r=mulberry(777);
  for(let i=0;i<26;i++) rocks.push({x:r(),y:r(),v:.04+r()*.13,s:1+r()*2.6,p:r()*6.28});
})();

/* ------------------------------------------------------------------ *
 * 时间轴模型
 * ------------------------------------------------------------------ */
const N=ERAS.length;
let pos=0;               // 连续幕位（0..N-1）
let playing=false, speed=1, last=0, clock=0, dwell=6.2;

function eraAt(t){return ERAS[clamp(Math.round(t),0,N-1)];}
function mix(t){
  const i=clamp(Math.floor(t),0,N-1), j=clamp(i+1,0,N-1);
  const f=easeInOut(clamp(t-i,0,1)); const A=SCENE[ERAS[i].id],B=SCENE[ERAS[j].id];
  const out={};
  for(const k in A) out[k]= (typeof A[k]==="number") ? lerp(A[k],B[k],f) : (f<.5?A[k]:B[k]);
  return out;
}
function fmtKm(v){ return Math.round(v).toLocaleString("en-US")+" km"; }
function fmtAge(my){
  if(Math.abs(my)<=0.01) return "今天";
  if(my<0){
    const f=-my;
    if(f<1) return Math.round(f*100)+" 万年后";
    if(f<100) return Math.round(f*100)+" 万年后";
    return (f/100).toFixed(f<1000?1:0)+" 亿年后";
  }
  if(my<100) return Math.round(my*100)+" 万年前";
  if(my<1000) return (my/100).toFixed(1)+" 亿年前";
  const yi=my/100;
  return yi.toFixed(yi<10?1:0)+" 亿年前";
}

/* ------------------------------------------------------------------ *
 * 绘制
 * ------------------------------------------------------------------ */
const probe={};   // 供自检读取的几何结果
function spherePoint(lat,lon,spin,tilt){
  const la=lat*Math.PI/180, lo=(lon+spin)*Math.PI/180;
  const cl=Math.cos(la);
  let x=cl*Math.sin(lo), y=Math.sin(la), z=cl*Math.cos(lo);
  const t=tilt*Math.PI/180, ct=Math.cos(t), st=Math.sin(t);
  const y2=y*ct-z*st, z2=y*st+z*ct;
  return {x:x, y:-y2, z:z2};
}

function draw(){
  const s=mix(pos), era=eraAt(pos);
  const drift=Math.sin(clock*0.07)*10, bob=Math.sin(clock*0.11)*4;
  const dark=document.body.getAttribute("data-theme")==="dark";

  // 背景
  const g=ctx.createLinearGradient(0,0,W*0.4,H);
  if(dark){ g.addColorStop(0,"#05070f"); g.addColorStop(1,"#0a1226"); }
  else { g.addColorStop(0,"#dfe7f4"); g.addColorStop(1,"#c3d3ea"); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 星云
  if(s.nebula>0.02){
    const nb=mulberry(4242);
    for(let i=0;i<5;i++){
      const cx=W*(.1+nb()*.85)+drift*1.6, cy=H*(.1+nb()*.8)+bob, rr=H*(.25+nb()*.35);
      const hue=[288,196,214,332,260][i];
      const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
      rg.addColorStop(0,"hsla("+hue+",72%,58%,"+(0.17*s.nebula*(dark?1:.5))+")");
      rg.addColorStop(1,"hsla("+hue+",72%,58%,0)");
      ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
  }

  // 星星（视差 + 闪烁）
  for(const st of stars){
    const par=[0.25,0.6,1.15][st.z];
    let x=st.x+drift*par+pos*2*par, y=st.y+bob*par;
    x=((x%(W*1.25))+W*1.25)%(W*1.25);
    const tw=dark?(.55+.45*Math.sin(clock*1.6+st.p)):(.35+.3*Math.sin(clock*1.6+st.p));
    ctx.globalAlpha=st.a*tw*(1-0.45*s.giant);
    ctx.fillStyle=dark?"#dce8ff":"#5f7392";
    ctx.beginPath(); ctx.arc(x,y,st.s,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ---------- 日心场景：太阳居中，地球绕太阳公转，月球绕地球公转 ----------
  const sunX=W*0.5, sunY=H*0.5;
  const orbitRot=-0.14;
  const aE=Math.min(W*0.36,H*0.62), bE=aE*0.40;      // 地球轨道（透视椭圆）
  const eAng=clock*0.16+pos*0.30;                     // 公转相位
  const rotC=Math.cos(orbitRot), rotS=Math.sin(orbitRot);
  const eox=Math.cos(eAng)*aE, eoy=Math.sin(eAng)*bE;
  const ex=sunX+eox*rotC-eoy*rotS, ey=sunY+eox*rotS+eoy*rotC;
  const earthFar=Math.sin(eAng)<0;                    // 轨道上半 = 太阳远侧
  const R=Math.min(H*0.155,W*0.085);
  const spin=(clock*(40/Math.max(s.day,3))*0.6)%360;
  const tilt=23.4;
  const dirx=(sunX-ex), diry=(sunY-ey), dl=Math.hypot(dirx,diry)||1;

  // 原行星盘（星云时代）
  if(s.nebula>0.05){
    ctx.save(); ctx.translate(sunX,sunY); ctx.rotate(orbitRot);
    for(let i=0;i<3;i++){
      ctx.strokeStyle="hsla("+(28+i*22)+",80%,65%,"+(0.10*s.nebula)+")";
      ctx.lineWidth=H*(0.10-i*0.02);
      ctx.beginPath(); ctx.ellipse(0,0,aE*(0.72+i*0.16),bE*(0.72+i*0.16),0,0,6.2832); ctx.stroke();
    }
    ctx.restore();
  }

  // 地球轨道线
  ctx.save(); ctx.translate(sunX,sunY); ctx.rotate(orbitRot);
  ctx.strokeStyle=dark?"rgba(150,190,255,.20)":"rgba(50,80,130,.26)";
  ctx.setLineDash([6,8]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(0,0,aE,bE,0,0,6.2832); ctx.stroke();
  ctx.restore(); ctx.setLineDash([]);

  // 轨道上的星子（仅星云时代）
  if(s.nebula>0.05){
    const rd=mulberry(808);
    for(let i=0;i<26;i++){
      const a=rd()*6.2832, rr=0.74+rd()*0.4;
      const px=Math.cos(a)*aE*rr, py=Math.sin(a)*bE*rr;
      const x=sunX+(px*rotC-py*rotS), y=sunY+(px*rotS+py*rotC);
      ctx.globalAlpha=s.nebula*(0.35+0.5*rd());
      ctx.fillStyle=dark?"#c9b79a":"#8a7a63";
      ctx.beginPath(); ctx.arc(x,y,1+rd()*2.2,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  const hasMoon=s.moon>0.02;
  // 月球绕地球：轨道半径随地质时期拉长（真实退行）
  const mA0=R*1.95, mA1=R*3.35;
  const mOrb=lerp(mA0,mA1,clamp(s.dist,0,1)), mOrbB=mOrb*0.34;
  const mAng=clock*0.9+pos*0.4;
  const mmx=Math.cos(mAng)*mOrb, mmy=Math.sin(mAng)*mOrbB;
  const mx=ex+mmx, my=ey+mmy;
  const mR=clamp(R*0.17*(1.25-0.45*s.dist),2.5,R*0.24);
  const moonBehind=Math.sin(mAng)>0;   // 椭圆下半 = 地球远侧

  const drawMoon=()=>{
    ctx.save();
    ctx.shadowColor="rgba(220,235,255,.45)"; ctx.shadowBlur=mR*1.2;
    ctx.beginPath(); ctx.arc(mx,my,mR,0,6.2832); ctx.clip();
    const mg=ctx.createRadialGradient(mx+dirx/dl*mR*.5,my+diry/dl*mR*.5,mR*.1,mx,my,mR*1.2);
    mg.addColorStop(0,"#f6f8fd"); mg.addColorStop(.6,"#c3cbd8"); mg.addColorStop(1,"#3f4653");
    ctx.fillStyle=mg; ctx.fillRect(mx-mR,my-mR,mR*2,mR*2);
    const rr=mulberry(1212);
    for(let i=0;i<14;i++){
      const cx=mx+(rr()*2-1)*mR*0.85, cy=my+(rr()*2-1)*mR*0.85, cr=mR*(0.08+rr()*0.16);
      if(Math.hypot(cx-mx,cy-my)>mR-cr*0.4) continue;
      ctx.fillStyle="rgba(118,128,145,.38)"; ctx.beginPath(); ctx.arc(cx,cy,cr,0,6.2832); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.2)"; ctx.beginPath(); ctx.arc(cx-cr*.3,cy-cr*.3,cr*.6,0,6.2832); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle=dark?"rgba(200,215,240,.35)":"rgba(70,95,135,.3)";
    ctx.beginPath(); ctx.arc(mx,my,mR,0,6.2832); ctx.stroke();
  };

  const drawEarthSystem=()=>{
    if(hasMoon){
      ctx.save(); ctx.translate(ex,ey);
      ctx.strokeStyle=dark?"rgba(190,210,245,.22)":"rgba(60,84,126,.28)";
      ctx.setLineDash([3,5]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(0,0,mOrb,mOrbB,0,0,6.2832); ctx.stroke();
      ctx.restore(); ctx.setLineDash([]);
      if(moonBehind) drawMoon();
    }
    // 大气辉光
    const ag=ctx.createRadialGradient(ex,ey,R*0.85,ex,ey,R*1.5);
    ag.addColorStop(0,"rgba(90,190,255,"+(0.10+0.22*s.ocean*(1-s.giant))+")");
    ag.addColorStop(1,"rgba(90,190,255,0)");
    ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(ex,ey,R*1.5,0,6.2832); ctx.fill();

    // 地球本体
    ctx.save();
    ctx.beginPath(); ctx.arc(ex,ey,R,0,6.2832); ctx.clip();
    const base=ctx.createRadialGradient(ex-R*.35,ey-R*.4,R*.1,ex,ey,R*1.35);
    base.addColorStop(0, s.lava>0.5?"#ff8b3a":"#3f9fd8");
    base.addColorStop(.55,s.lava>0.5?"#c8461b":"#1c6da5");
    base.addColorStop(1, s.lava>0.5?"#5d1a0b":"#08243f");
    ctx.fillStyle=base; ctx.fillRect(ex-R,ey-R,R*2,R*2);

    // 岩浆裂纹
    if(s.lava>0.05){
      ctx.globalAlpha=s.lava*0.85;
      const rr=mulberry(3131);
      for(let i=0;i<22;i++){
        const lat=rr()*140-70, lon=rr()*360-180, len=rr()*24+10;
        const p=spherePoint(lat,lon,spin,tilt);
        if(p.z<=0.05) continue;
        ctx.strokeStyle="rgba(255,"+Math.round(120+80*rr())+",40,"+(0.5*p.z)+")";
        ctx.lineWidth=Math.max(0.5,1.5*p.z);
        ctx.beginPath(); ctx.moveTo(ex+p.x*R,ey+p.y*R);
        ctx.lineTo(ex+p.x*R+Math.cos(len)*len*0.35,ey+p.y*R+Math.sin(len)*len*0.35); ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // 陆地
    const set=LAND_SETS[Math.round(s.landSet)]||[];
    if(s.land>0.02){
      for(const c of set){
        const p=spherePoint(c[0],c[1],spin,tilt);
        if(p.z<=0.02) continue;
        const sub=mulberry(Math.round((c[0]+90)*100+(c[1]+180)));
        const baseShade=s.ice>0.55?[226,238,248]:(s.life>0.5?[86,132,68]:[150,128,90]);
        for(let k=0;k<c[3];k++){
          const ox=(sub()*2-1)*c[2]*0.055*R, oy=(sub()*2-1)*c[2]*0.04*R;
          const rad=c[2]/17*R*(0.45+0.55*sub())*(0.55+0.45*p.z);
          const cx=ex+p.x*R+ox, cy=ey+p.y*R+oy;
          const lg=ctx.createRadialGradient(cx-rad*.3,cy-rad*.3,rad*.05,cx,cy,rad);
          lg.addColorStop(0,"rgba("+baseShade+","+(0.95*s.land*p.z)+")");
          lg.addColorStop(1,"rgba("+baseShade+","+(0.10*s.land*p.z)+")");
          ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.2832); ctx.fill();
        }
      }
    }

    // 冰盖
    if(s.ice>0.03){
      for(const side of [-1,1]){
        const p=spherePoint(side*90,0,spin,tilt);
        const capR=R*(0.30+0.34*s.ice);
        const cg=ctx.createRadialGradient(ex+p.x*R,ey+p.y*R,capR*0.15,ex+p.x*R,ey+p.y*R,capR);
        cg.addColorStop(0,"rgba(244,251,255,"+(0.92*s.ice)+")");
        cg.addColorStop(.7,"rgba(232,244,255,"+(0.55*s.ice)+")");
        cg.addColorStop(1,"rgba(232,244,255,0)");
        ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(ex+p.x*R,ey+p.y*R,capR,0,6.2832); ctx.fill();
      }
    }

    // 生命色斑
    if(s.life>0.3){
      ctx.globalAlpha=s.life*0.4;
      const rr=mulberry(9091);
      for(let i=0;i<34;i++){
        const p=spherePoint(rr()*160-80,rr()*360-180,spin*1.02,tilt);
        if(p.z<=0.1) continue;
        ctx.fillStyle="rgba(60,180,140,"+(0.35*p.z)+")";
        ctx.beginPath(); ctx.arc(ex+p.x*R,ey+p.y*R,R*0.02*p.z+0.6,0,6.2832); ctx.fill();
      }
      ctx.globalAlpha=1;
    }

    // 云层
    if(s.cloud>0.05){
      const rr=mulberry(5150);
      for(let i=0;i<14;i++){
        const p=spherePoint(rr()*130-65,rr()*360-180,spin*1.18+18,tilt);
        if(p.z<=0.02) continue;
        const rad=R*(0.10+rr()*0.16)*(0.5+0.5*p.z);
        ctx.fillStyle="rgba(255,255,255,"+(0.30*s.cloud*Math.pow(p.z,0.6))+")";
        ctx.beginPath(); ctx.ellipse(ex+p.x*R,ey+p.y*R,rad,rad*0.42,rr()*3,0,6.2832); ctx.fill();
      }
    }

    // 昼夜分界（始终背向太阳的一侧变暗）
    const tx=ctx.createRadialGradient(ex+dirx/dl*R*0.9,ey+diry/dl*R*0.9,R*0.15,ex,ey,R*2.1);
    tx.addColorStop(0,"rgba(0,0,0,0)");
    tx.addColorStop(.42,"rgba(0,0,0,.12)");
    tx.addColorStop(1,"rgba(2,4,12,.86)");
    ctx.fillStyle=tx; ctx.fillRect(ex-R,ey-R,R*2,R*2);

    // 夜面城市灯火
    if(s.city>0.05){
      const rr=mulberry(6060);
      for(const c of (LAND_SETS[3]||[])){
        for(let k=0;k<5;k++){
          const p=spherePoint(c[0]+rr()*10-5,c[1]+rr()*10-5,spin,tilt);
          if(p.z<=0.05) continue;
          const lit=(p.x*dirx+p.y*diry)/dl;
          if(lit>0.15) continue;
          ctx.fillStyle="rgba(255,206,120,"+(0.85*s.city*p.z)+")";
          ctx.beginPath(); ctx.arc(ex+p.x*R,ey+p.y*R,1.5*p.z,0,6.2832); ctx.fill();
        }
      }
    }
    ctx.restore();

    // 球体轮廓高光
    ctx.strokeStyle=dark?"rgba(150,205,255,.4)":"rgba(40,90,140,.35)";
    ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(ex,ey,R,0,6.2832); ctx.stroke();

    if(hasMoon&&!moonBehind) drawMoon();
    probe.earth={x:ex,y:ey}; probe.moon={x:mx,y:my}; probe.sun={x:sunX,y:sunY}; probe.R=R;
  };

  // 太阳本体（地球走到远侧时被太阳遮住）
  const sunR=Math.min(H,W)*(0.085+0.42*s.giant);
  const sg=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*3.4);
  sg.addColorStop(0, s.giant>0.3?"rgba(255,196,140,1)":"rgba(255,250,225,1)");
  sg.addColorStop(.28, s.giant>0.3?"rgba(255,140,70,.85)":"rgba(255,222,150,.8)");
  sg.addColorStop(.5, s.giant>0.3?"rgba(255,110,50,.28)":"rgba(255,205,130,.26)");
  sg.addColorStop(1,"rgba(255,180,120,0)");
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sunX,sunY,sunR*3.4,0,6.2832); ctx.fill();

  if(earthFar) drawEarthSystem();

  ctx.fillStyle=s.giant>0.3?"#ffb26a":"#fff6dc";
  ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,6.2832); ctx.fill();
  const sp=ctx.createRadialGradient(sunX-sunR*.3,sunY-sunR*.3,sunR*.1,sunX,sunY,sunR);
  sp.addColorStop(0,"rgba(255,255,255,.75)"); sp.addColorStop(1,"rgba(255,170,90,0)");
  ctx.fillStyle=sp; ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,6.2832); ctx.fill();

  if(!earthFar) drawEarthSystem();

  probe.orbit={a:aE,b:bE};

  // 撞击 / 流星（朝地球汇聚）
  if(s.rocks>0.03){
    for(const rk of rocks){
      const life=(clock*rk.v+rk.p)%1;
      if(life>0.75) continue;
      const sx0=W*rk.x, sy0=H*rk.y;
      const x=lerp(sx0,ex,life/0.75), y=lerp(sy0,ey,life/0.75);
      const ang=Math.atan2(ey-sy0,ex-sx0);
      ctx.globalAlpha=s.rocks*(1-life/0.75)*0.8;
      ctx.strokeStyle="#ffd9a0"; ctx.lineWidth=rk.s*0.7;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-Math.cos(ang)*16,y-Math.sin(ang)*16); ctx.stroke();
      ctx.globalAlpha=1;
    }
    // 撞击闪
    const fl=Math.max(0,Math.sin(clock*2.3)-0.85)*6.67*s.rocks;
    if(fl>0.02){
      const p=spherePoint(18,240,spin,tilt);
      if(p.z>0){ ctx.fillStyle="rgba(255,240,200,"+fl*0.5*p.z+")";
        ctx.beginPath(); ctx.arc(ex+p.x*R,ey+p.y*R,R*0.1,0,6.2832); ctx.fill(); }
    }
  }

  // 暗角
  const vg=ctx.createRadialGradient(W*.5,H*.5,H*.35,W*.5,H*.5,H*.95);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,dark?"rgba(0,0,0,.5)":"rgba(30,45,70,.18)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // HUD 数值
  gDist.textContent = hasMoon
    ? fmtKm(LUNAR_KM_MIN+(LUNAR_KM_MAX-LUNAR_KM_MIN)*clamp(s.dist,0,1))
    : "尚未诞生";
  gDay.textContent=(s.day<10?s.day.toFixed(1):Math.round(s.day))+" 小时";
  gAge.textContent=fmtAge(era.yearsAgo);
  gState.textContent=eraSceneName(era.id);
}

function eraSceneName(id){
  if(id==="nebula"||id==="impact"||id==="magma-ocean"||id==="late-bombardment") return UI.stateEarly;
  if(id==="human-age") return UI.stateHuman;
  if(id==="far-future") return UI.stateFar;
  return UI.stateLive;
}

/* ------------------------------------------------------------------ *
 * 文案渲染
 * ------------------------------------------------------------------ */
const el=id=>document.getElementById(id);
const gDist=el("gDist"),gDay=el("gDay"),gAge=el("gAge"),gState=el("gState");
let shownIdx=-1;
function renderText(){
  const e=eraAt(pos); if(ERAS.indexOf(e)<0) return;
  const i=ERAS.indexOf(e);
  if(i===shownIdx) return; shownIdx=i;
  el("eraLabel").textContent=e.label;
  el("eraTitle").textContent=e.title;
  el("eraGroup").textContent=e.group;
  el("textEarth").textContent=e.earth;
  el("textMoon").textContent=e.moon;
  el("facts").innerHTML=(e.facts||[]).map(f=>"<span>"+esc(f)+"</span>").join("");
  document.querySelectorAll("#eraNav button").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 时间轴导航 */
function buildNav(){
  const box=el("eraNav"); box.innerHTML="";
  const groups=[];
  ERAS.forEach((e,i)=>{ let g=groups.find(x=>x.name===e.group); if(!g){g={name:e.group,items:[]};groups.push(g);} g.items.push({e,i}); });
  for(const g of groups){
    const d=document.createElement("div"); d.className="grp";
    const n=document.createElement("span"); n.className="grpname"; n.textContent=g.name; d.appendChild(n);
    for(const it of g.items){
      const b=document.createElement("button"); b.dataset.i=it.i;
      b.textContent=it.e.label; b.title=it.e.title;
      b.addEventListener("click",()=>{ setPos(it.i,true); });
      d.appendChild(b);
    }
    box.appendChild(d);
  }
}
function setPos(v,stop){ pos=clamp(v,0,N-1); el("range").value=Math.round(pos/(N-1)*1000); if(stop&&playing) togglePlay(false); }

/* 播放控制 */
function togglePlay(force){
  playing=(force===undefined)?!playing:force;
  el("play").textContent=playing?UI.pause:UI.play;
  el("play").setAttribute("aria-pressed",String(playing));
}
el("play").addEventListener("click",()=>{ if(!playing&&pos>=N-1) setPos(0,false); togglePlay(); });
el("prev").addEventListener("click",()=>setPos(Math.floor(pos-1+1e-6)));
el("next").addEventListener("click",()=>setPos(Math.floor(pos+1+1e-6)));
el("range").addEventListener("input",ev=>setPos(+ev.target.value/1000*(N-1)));
[["s1",1],["s2",2]].forEach(([id,v])=>el(id).addEventListener("click",()=>{
  speed=v; el("s1").classList.toggle("on",v===1); el("s2").classList.toggle("on",v===2);
}));
el("tDark").addEventListener("click",()=>setTheme("dark"));
el("tLight").addEventListener("click",()=>setTheme("light"));
function setTheme(t){
  document.body.setAttribute("data-theme",t);
  el("tDark").classList.toggle("on",t==="dark"); el("tLight").classList.toggle("on",t==="light");
}
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT") return;
  if(ev.key==="ArrowRight"){setPos(Math.floor(pos+1+1e-6));ev.preventDefault();}
  if(ev.key==="ArrowLeft"){setPos(Math.floor(pos-1+1e-6));ev.preventDefault();}
  if(ev.key==="Home"){setPos(0,true);ev.preventDefault();}
  if(ev.key==="End"){setPos(N-1,true);ev.preventDefault();}
  if(ev.key===" "){togglePlay();ev.preventDefault();}
});

/* 主循环 */
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  clock+=dt*(reduced()?0.35:1);
  if(playing){
    pos+=dt*speed/dwell;
    if(pos>=N-1){pos=N-1;togglePlay(false);}
    el("range").value=Math.round(pos/(N-1)*1000);
  }
  // 场景持续绘制：自转、闪烁与月球位置都依赖 clock
  draw();
  renderText();
  requestAnimationFrame(frame);
}
function reduced(){ return window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches; }

/* 应用文案到静态 DOM */
function applyUI(){
  el("mainTitle").textContent=UI.title; el("mainSub").textContent=UI.subtitle;
  document.title=UI.title+" · "+UI.subtitle;
  el("opening").textContent=UI.lede;
  el("introEarth").textContent="【"+UI.earth+"】"+UI.introEarth;
  el("introMoon").textContent="【"+UI.moon+"】"+UI.introMoon;
  el("epiWhoEarth").textContent="【"+UI.earth+"】"; el("epiEarth").textContent=UI.epiEarth;
  el("epiWhoMoon").textContent="【"+UI.moon+"】"; el("epiMoon").textContent=UI.epiMoon;
  el("nameEarth").textContent=UI.earth; el("nameMoon").textContent=UI.moon;
  el("rangeCap").textContent=ERAS[0].label; el("rangeEnd").textContent=ERAS[N-1].label;
  el("range").setAttribute("aria-label",UI.timeline);
  el("hint").textContent=UI.hint;
  el("note1").textContent=UI.note1; el("note2").textContent=UI.note2; el("note3").textContent=UI.note3;
  el("play").textContent=UI.play;
  el("nowMark").style.left=(NOW_POS/(N-1)*100)+"%";
  el("nowMark").textContent=UI.now;
}

/* ------------------------------------------------------------------ *
 * 自检（?selftest=1）：供无头浏览器读取
 * ------------------------------------------------------------------ */
function selftest(){
  const ids=ERAS.map(e=>e.id), out={pass:true,checks:[]};
  function chk(name,ok,info){ out.checks.push(name+": "+(ok?"ok":"FAIL")+(info?" ["+info+"]":"")); if(!ok) out.pass=false; }
  chk("era_count",N===12,N);
  chk("unique_ids",new Set(ids).size===12,ids.join(","));
  chk("all_scene_keys",ids.every(i=>SCENE[i]),ids.filter(i=>!SCENE[i]).join(","));
  chk("no_placeholder",!ERAS.some(e=>/占位|TODO/.test(e.earth+e.moon+e.title)));
  chk("voice_lengths",ERAS.every(e=>e.earth.length>=40&&e.earth.length<=160&&e.moon.length>=40&&e.moon.length<=160),
      ERAS.map(e=>e.earth.length+"/"+e.moon.length).join(","));
  chk("facts_2_3",ERAS.every(e=>e.facts.length>=2&&e.facts.length<=3&&e.facts.every(f=>f.length<=28)));
  chk("groups_4",new Set(ERAS.map(e=>e.group)).size===4,ERAS.map(e=>e.group).join(","));
  chk("ui_filled",!!UI.introEarth&&!!UI.introMoon&&!!UI.epiEarth&&!!UI.epiMoon&&!!UI.note3&&!!UI.hint&&!!UI.timeline);
  chk("moon_absent_at_nebula",SCENE["nebula"].moon===0&&SCENE["impact"].moon===1);
  // 日心几何：地球绕太阳转（位置随时间变化、保持在画面内），月球绕地球转
  try{
    const c0={x:W/2,y:H/2}; setPos(10,false);
    clock=100; draw(); const a={e:{...probe.earth},m:{...probe.moon},s:{...probe.sun}};
    clock=106; draw(); const b={e:{...probe.earth},m:{...probe.moon}};
    const moved=Math.hypot(b.e.x-a.e.x,b.e.y-a.e.y);
    chk("earth_orbits_sun",moved>4,"moved="+moved.toFixed(1));
    const sunC=Math.hypot(a.s.x-c0.x,a.s.y-c0.y)<2;
    chk("sun_centered",sunC);
    const inFrame=b.e.x>probe.R&&b.e.x<W-probe.R&&b.e.y>probe.R&&b.e.y<H-probe.R;
    chk("earth_in_frame",inFrame,JSON.stringify(b.e));
    const md=Math.hypot(b.m.x-b.e.x,b.m.y-b.e.y);
    chk("moon_around_earth",md>probe.R*1.2&&md<probe.R*6,"md="+md.toFixed(1)+" R="+probe.R.toFixed(1));
  }catch(e){ chk("heliocentric",false,e.message); }
  const before={},after={};
  try{ for(let i=0;i<N;i++){ pos=i; shownIdx=-1; draw(); renderText(); before[i]=el("textEarth").textContent; after[i]=el("textMoon").textContent; } chk("draw_all_eras",true); }
  catch(e){ chk("draw_all_eras",false,e.message); }
  chk("earth_text_unique",new Set(Object.values(before)).size===N,new Set(Object.values(before)).size);
  chk("moon_text_unique",new Set(Object.values(after)).size===N,new Set(Object.values(after)).size);
  chk("hud_age_text",ERAS.every(e=>/亿|万|今天/.test(fmtAge(e.yearsAgo))),ERAS.map(e=>fmtAge(e.yearsAgo)).join("|"));
  try{
    setPos(0); togglePlay(true); if(!playing) throw new Error("play-off");
    el("next").click(); if(Math.round(pos)!==1) throw new Error("next="+pos);
    el("prev").click(); if(Math.round(pos)!==0) throw new Error("prev="+pos);
    el("range").value=500; el("range").dispatchEvent(new Event("input"));
    if(Math.abs(pos-5.5)>0.01) throw new Error("scrub="+pos);
    el("tLight").click(); if(document.body.getAttribute("data-theme")!=="light") throw new Error("theme");
    el("tDark").click();
    document.querySelectorAll("#eraNav button")[7].click();
    if(eraAt(pos).id!=="cambrian") throw new Error("nav="+eraAt(pos).id);
    togglePlay(false); chk("controls",true);
  }catch(e){ chk("controls",false,e.message); }
  chk("nav_count",document.querySelectorAll("#eraNav button").length===N);
  // 播放循环：手动推进两帧，确认 pos 前进且文案跟随
  try{
    setPos(0,false); togglePlay(true); const p0=pos;
    frame(1000); frame(1600);
    if(!(pos>p0)) throw new Error("pos stuck "+p0+"->"+pos);
    if(el("textEarth").textContent.length<40) throw new Error("text not following");
    togglePlay(false); chk("autoplay_advances",true,"pos="+pos.toFixed(2));
  }catch(e){ chk("autoplay_advances",false,e.message); }
  // 横向溢出审计：任何超出视口宽度的元素都列出来
  const vw=document.documentElement.clientWidth, over=[];
  document.querySelectorAll("*").forEach(n=>{
    const r=n.getBoundingClientRect();
    if(r.width>0&&r.right>vw+1) over.push((n.id||n.tagName.toLowerCase())+"+"+Math.round(r.right-vw));
  });
  chk("no_h_overflow",over.length===0,over.slice(0,8).join(","));
  out.vw=vw; out.sw=document.documentElement.scrollWidth; out.inner=window.innerWidth;
  chk("doc_scroll",document.documentElement.scrollWidth<=vw+1,document.documentElement.scrollWidth+"/"+vw);
  // 窄屏审计：无头窗口有最小宽度，改为把容器压到 360px 检查固有最小宽度
  const wrap=document.querySelector(".wrap"), oldW=wrap.style.width;
  wrap.style.width="360px";
  const narrow=[]; let maxMin=0;
  document.querySelectorAll(".wrap *").forEach(n=>{
    const need=n.scrollWidth; if(need>maxMin) maxMin=need;
    if(need>n.clientWidth+2 && getComputedStyle(n).overflowX!=="auto" && n.tagName!=="CANVAS")
      narrow.push((n.id||n.className||n.tagName.toLowerCase())+" "+need+">"+n.clientWidth);
  });
  chk("narrow_360",narrow.length===0,narrow.slice(0,6).join(" | "));
  out.narrowMax=maxMin;
  wrap.style.width=oldW;
  const d=document.createElement("div"); d.id="selftest-result";
  d.textContent="SELFTEST "+JSON.stringify(out);
  document.body.appendChild(d);
  document.title="SELFTEST:"+(out.pass?"PASS":"FAIL");
}

<body data-theme="light">
<div class="wrap">
  <h1>🐢 小兔和乌龟赛跑 🐰</h1>
  <p class="sub">伊索寓言的实时动画版。兔子跑得快，却忍不住停下来啃胡萝卜、打完哈欠就睡着；
    乌龟不快，但一步也不停。<br>快捷键：<b>空格</b> 开始 / 暂停，<b>R</b> 重置，<b>W</b> 叫醒兔子，<b>1 / 2 / 4</b> 切换倍速。</p>

  <div class="scene"><canvas id="stage" width="980" height="340"></canvas></div>
  background:var(--paper); color:var(--ink); padding:20px 14px 44px; transition:background .3s,color .3s;
}
.wrap{max-width:1000px;margin:0 auto}
h1{margin:0;font-size:clamp(20px,3.4vw,30px)}
.sub{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.7}
.scene{position:relative;margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--floor2)}
#stage{display:block;width:100%;height:auto;touch-action:none}
.hud{position:absolute;left:0;top:0;right:0;display:flex;flex-wrap:wrap;gap:8px;padding:9px 12px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(8,18,28,.44);color:#fff;border-radius:999px;
  padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums;backdrop-filter:blur(3px)}
.chip b{font-size:16px;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.chip.serving .dot{background:#ffd54a;box-shadow:0 0 9px #ffd54a}
.chip.p1 b{color:#ff9d88} .chip.p2 b{color:#a2c8ff}
.msg{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);text-align:center;color:#fff;
  font-size:clamp(15px,2.7vw,25px);font-weight:700;text-shadow:0 2px 16px rgba(0,0,0,.65);
  pointer-events:none;opacity:0;transition:opacity .18s;max-width:88%}

.mask{position:absolute;inset:0;display:none;place-items:center;padding:16px;background:rgba(6,14,22,.55);
  backdrop-filter:blur(4px);color:#fff;text-align:center}

.mask .box{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 22px;max-width:560px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

  border:1px solid var(--line);background:var(--card);transition:transform .12s,box-shadow .2s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
#startBtn{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}

  gap:6px 18px;font-size:13px;color:var(--muted)}

@media (max-width:560px){.chip{font-size:11.5px;padding:4px 9px}.chip b{font-size:14px}.hud{padding:6px 8px}}

<body>
<div class="wrap">
  <h1>🏓 乒乓球</h1>
  <p class="sub">带重力、弹跳、擦网与「先落本台再过网」发球规则的俯视角乒乓球。11 分制、净胜 2 分、
    发球权每 2 分轮换（10:10 后每分轮换），擦网好球判 LET 重发。单文件、纯离线、零依赖。</p>

  <div class="scene">
    <canvas id="stage" width="960" height="620" aria-label="乒乓球比赛画面"></canvas>
    <div class="hud">
      <span class="chip p1" id="chip1"><span class="dot"></span><span id="lbl1">你</span> <b id="s1">0</b></span>
      <span class="chip">局分 <b id="g1">0</b> : <b id="g2">0</b></span>
      <span class="chip p2" id="chip2"><span class="dot"></span><b id="s2">0</b> <span id="lbl2">电脑</span></span>
      <span class="chip">回合 <b id="rally">0</b></span>
      <span class="chip">最长回合 <b id="longest">0</b></span>
      <span class="chip">最快球速 <b id="speed">0</b> km/h</span>
    </div>
    <div class="msg" id="msg"></div>
    <div class="mask" id="menuMask"><div class="box">
      <h3>🏓 开打一局</h3>
      <p>先在下方选 <b>模式 / 难度 / 赛制</b>，再点 <b>开始比赛</b>。<br>
      鼠标或 <kbd>←</kbd><kbd>→</kbd> 移动下方红拍；<kbd>空格</kbd>按住蓄力、松开即发球；
      对打中按一次 <kbd>空格</kbd> 是扣杀。</p>
    </div></div>
    <div class="mask" id="pauseMask"><div class="box">
      <h3>已暂停</h3><p>按 <kbd>P</kbd> 或 <kbd>Esc</kbd> 继续。</p>
    </div></div>
    <div class="mask" id="overMask"><div class="box">
      <h3 id="overTitle">比赛结束</h3>
      <p id="overText"></p>
      <p style="margin-top:10px">按 <kbd>空格</kbd> 或 <kbd>Enter</kbd> 再来一场。</p>
    </div></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="controls">
        <button id="main">▶ 开始比赛</button>
        <button id="wake" hidden>🥕 叫醒兔子</button>
        <button id="reset">↺ 重置</button>
        <span class="seg" id="speed">
          <button data-s="1" class="on">1×</button>
          <button data-s="2">2×</button>
          <button data-s="4">4×</button>
        </span>
        <label class="opt"><input type="checkbox" id="showLines"> 速度曲线</label>
        <label class="opt"><input type="checkbox" id="autoRun"> 自动重赛</label>
        <button id="theme">🌙 深色</button>
      </div>
      <div class="stat">
        用时 <b id="clock">0.0</b>s ｜ 兔子距终点 <b id="dist">100</b>%<br>
        <span style="color:var(--carrot)">啃到胡萝卜 <b id="nCarrot">0</b></span>
        ｜ <span style="color:#b07ad6">睡着 <b id="nNap">0</b> 次</span>
        ｜ 名次 <b id="rank">—</b>
      </div>
    </div>
    <p class="legend">
      <span class="carrot">🥕 胡萝卜</span>沿途共 4 根，兔子经过必停下来啃一口（约 1 秒）；
      每次啃完约有六成概率当场睡着 <b>4–9 秒</b>，睡着时点 <span class="sleep">🥕 叫醒兔子</span>（或按 <b>W</b>）可立刻起身继续跑。
      谁先到达 100m 终点线谁赢 —— 打瞌睡是随机的，所以每局胜负都可能不同。
    </p>
  </div>

  <div class="msg" id="msg" hidden></div>

  <footer>单文件 HTML · 无任何外部依赖 · 直接用浏览器打开即可</footer>
</div>

<script>
(function(){
'use strict';
/* ===== 常量 ===== */
var W=980,H=340, FIN=100, TOP=150, BOT=228, X0=52, X1=W-52, CARY=190;
var TOR_V=1.75;              // 乌龟：恒速 %/s
var HARE_BASE=2.55, HARE_AMP=1.35, HARE_OMEGA=2.1;  // 兔子：平均/起伏/频率
var NAP_MIN=4.0, NAP_MAX=9.0, NAP_P=0.6;             // 瞌睡时长与概率
var EAT_T=0.9;                                       // 啃一根胡萝卜的耗时

/* ===== 状态 ===== */
var cvs=document.getElementById('stage'), ctx=cvs.getContext('2d');
function $(id){ return document.getElementById(id); }
var mainBtn=$('main'), wakeBtn=$('wake'), msgEl=$('msg');
var clockEl=$('clock'), distEl=$('dist'), rankEl=$('rank');
var nCarrotEl=$('nCarrot'), nNapEl=$('nNap');
var state='idle', t=0, frame=0, speed=1, showLines=false, autoRun=false;
var hare, tor, carrots=[], scenery=null, winner=null, last=0, raf=null;
var Q=(new URLSearchParams(location.search));
if(Q.get('theme')==='dark'){ document.body.dataset.theme='dark'; $('theme').textContent='☀️ 浅色'; }

function rnd(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function css(n){ return getComputedStyle(document.body).getPropertyValue(n).trim()||'#888'; }
function shade(col,amt){
  var m=col.match(/^#([0-9a-f]{6})$/i); if(!m) return col;
  var n=parseInt(m[1],16);
  var r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';
}
var KINDS=['🐿️','🦔','🐁','🦊','🐸','🐞','🦉'];

function makeScenery(){
  scenery={clouds:[],hills:[],trees:[],flowers:[],spectators:[]};
  for(var i=0;i<4;i++) scenery.clouds.push({x:rnd(30,900),y:rnd(22,58),s:rnd(.7,1.35),v:rnd(4,10)});
  for(i=0;i<10;i++) scenery.hills.push({x:i*100+rnd(-16,16),h:rnd(18,42)});
  for(i=0;i<5;i++) scenery.trees.push({x:rnd(80,900),y:rnd(272,300),s:rnd(.8,1.1)});
  for(i=0;i<26;i++) scenery.flowers.push({x:rnd(10,970),y:rnd(300,330),r:rnd(2.2,4)});
  for(i=0;i<6;i++) scenery.spectators.push({x:110+i*rnd(110,160),k:KINDS[i%KINDS.length],ph:rnd(0,6.3)});
}
makeScenery();

function reset(full){
  t=0;
  hare={d:0,v:0,sleep:0,eat:0,eating:false,napAfter:false};
  tor={d:0};
  if(full){
    carrots=[{p:22,r:0,taken:false},{p:41,r:1.7,taken:false},{p:63,r:3.4,taken:false},{p:83,r:5.1,taken:false}];
    winner=null; rankEl.textContent='—';
  } else carrots.forEach(function(c){ c.taken=false; });
  hideMsg(); wakeBtn.hidden=true;
  clockEl.textContent='0.0'; distEl.textContent='100';
  nCarrotEl.textContent='0'; nNapEl.textContent='0';
}

/* ===== 控制 ===== */
function start(){
  if(state==='running'){ pause(); return; }
  if(state==='finished') reset(false);
  state='running'; mainBtn.textContent='⏸ 暂停';
  msgEl.hidden=true;
}
function pause(){ if(state!=='running') return; state='paused'; mainBtn.textContent='▶ 继续'; }
function toIdle(){ state='idle'; mainBtn.textContent='▶ 开始比赛'; }
function wake(){
  if(!hare||hare.sleep<=0) return;
  hare.sleep=0; hare.eating=false; hare.eat=0; hare.napAfter=false; wakeBtn.hidden=true;
  showMsg('🐿️ 松鼠：','「别睡啦，乌龟已经过半程了！」兔子一骨碌爬起来继续追。');
}

/* ===== 物理 ===== */
function physics(dt){
  t+=dt;
  tor.d+=TOR_V*dt;                                  // 乌龟绝不停
  if(hare.sleep>0){ hare.v=0; hare.sleep-=dt;       // 睡觉
    if(hare.sleep<=0){ hare.sleep=0; hare.eating=false; wakeBtn.hidden=true; }
  } else if(hare.eat>0){                            // 啃胡萝卜：停下不动
    hare.v=0; hare.eat-=dt;
    if(hare.eat<=0){ hare.eat=0;
      if(hare.napAfter){ hare.napAfter=false; hare.sleep=rnd(NAP_MIN,NAP_MAX);
        nNapEl.textContent=(+nNapEl.textContent+1); wakeBtn.hidden=false;
        showMsg('💤','兔子啃完胡萝卜，趴在场边睡着了……乌龟还在往前走。'); }
      else hare.eating=false;
    }
  }
  else { hare.v=HARE_BASE+HARE_AMP*Math.sin(t*HARE_OMEGA); hare.d+=hare.v*dt; }
  if(hare.d>FIN) hare.d=FIN;
  if(tor.d>FIN) tor.d=FIN;

  carrots.forEach(function(c){
    if(c.taken) return;
    if(hare.sleep>0||hare.eat>0) return;            // 睡着/进食时不再触发
    if(Math.abs(c.p-hare.d)<1.1){
      c.taken=true; hare.eating=true; hare.eat=EAT_T;
      nCarrotEl.textContent=(+nCarrotEl.textContent+1);
      hare.napAfter=Math.random()<NAP_P;
    }
  });

  distEl.textContent=clamp(FIN-hare.d,0,100).toFixed(0);
  clockEl.textContent=t.toFixed(1);
  rankEl.textContent = hare.d>tor.d?'🐰 领先':(hare.d<tor.d?'🐢 领先':'并列');

  if(hare.d>=FIN||tor.d>=FIN){
    winner = hare.d>=FIN ? '🐰 小兔' : '🐢 乌龟';
    state='finished'; mainBtn.textContent='↻ 再来一次'; rankEl.textContent=winner;
    showMsg(winner+' 获胜！', winner==='🐰 小兔'
      ? '这局兔子只打了 '+nNapEl.textContent+' 次盹，醒来后一路狂奔，抢在乌龟前面撞线。'
      : '兔子一共睡了 '+nNapEl.textContent+' 次，乌龟一步没停，稳稳爬到了终点。');
    if(autoRun) setTimeout(function(){ if(state==='finished'){ reset(false); start(); } },2600);
  }
}

/* ===== 绘制 ===== */
function px(d){ return X0+(X1-X0)*clamp(d,0,FIN)/FIN; }
function rr8(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.3); ctx.fill(); }

function bg(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,css('--sky1')); g.addColorStop(1,css('--sky2'));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 太阳
  ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle=css('--carrot');
  circle(884,56,21); ctx.globalAlpha=.16; circle(884,56,33); ctx.restore();
  // 云
  ctx.fillStyle=document.body.dataset.theme==='dark'?'rgba(255,255,255,.22)':'rgba(255,255,255,.72)';
  scenery.clouds.forEach(function(c){ var x=(c.x+t*c.v)%(W+120)-60;
    circle(x,c.y,19*c.s); circle(x+22*c.s,c.y+5,14*c.s); circle(x-22*c.s,c.y+6,13*c.s); });
  // 远山 + 草地
  ctx.fillStyle=css('--grass');
  ctx.beginPath(); ctx.moveTo(0,122);
  scenery.hills.forEach(function(h){ ctx.quadraticCurveTo(h.x+50,122-h.h,h.x+100,122); });
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // 小花
  ctx.globalAlpha=.4; ctx.fillStyle=css('--shell');
  scenery.flowers.forEach(function(f){ circle(f.x,f.y,f.r); });
  ctx.globalAlpha=1;
  // 树
  scenery.trees.forEach(function(tr){
    ctx.save(); ctx.translate(tr.x,tr.y); ctx.scale(tr.s,tr.s);
    ctx.fillStyle='#8d6a4a'; ctx.fillRect(-3,-14,6,20);
    ctx.fillStyle=css('--shell'); circle(0,-26,14); circle(-11,-17,10); circle(11,-17,10);
    ctx.restore();
  });
  // 观众
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='19px serif';
  scenery.spectators.forEach(function(s){
    var b=state==='running'?Math.sin(t*3+s.ph)*2.6:0;
    ctx.fillText(s.k,s.x,300+b);
  });
}

function track(){
  var dark=document.body.dataset.theme==='dark';
  var lbl=dark?'rgba(226,238,224,.8)':'rgba(70,70,70,.85)';
  var sub=dark?'rgba(226,238,224,.55)':'rgba(70,70,70,.6)';
  ctx.fillStyle=dark?'rgba(255,255,255,.10)':'rgba(255,255,255,.55)';
  ctx.fillRect(X0,TOP-24,X1-X0,46); ctx.fillRect(X0,BOT-24,X1-X0,46);
  ctx.setLineDash([14,12]); ctx.lineWidth=2;
  ctx.strokeStyle=dark?'rgba(255,255,255,.28)':'rgba(120,120,120,.4)';
  [TOP+22,BOT+22].forEach(function(y){ ctx.beginPath(); ctx.moveTo(X0,y); ctx.lineTo(X1,y); ctx.stroke(); });
  ctx.setLineDash([]);
  // 终点彩带柱
  for(var i=0;i<9;i++){ ctx.fillStyle=i%2?'#e05c5c':'#f6d44d';
    ctx.fillRect(W-40,TOP-22+i*5,8,5); ctx.fillRect(W-40,BOT-22+i*5,8,5); }
  ctx.fillStyle=dark?'rgba(230,240,228,.7)':'rgba(80,80,80,.8)';
  ctx.fillRect(W-32,TOP-26,5,54); ctx.fillRect(W-32,BOT-26,5,54);
  ctx.font='bold 12px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=lbl; ctx.fillText('终点 100m',W-44,TOP-30);
  ctx.fillText('终点 100m',W-44,BOT+44);
  // 里程碑
  ctx.textAlign='center'; ctx.font='10px sans-serif'; ctx.fillStyle=sub;
  for(var p=20;p<=80;p+=20){ ctx.fillText(p+'m',px(p),TOP-30); ctx.fillText(p+'m',px(p),BOT+44); }
  // 名牌
  ctx.textAlign='left'; ctx.font='bold 13px sans-serif';
  ctx.fillStyle=css('--carrot'); ctx.fillText('🐰 小兔',X0+4,TOP-30);
  ctx.fillStyle=css('--accent');  ctx.fillText('🐢 乌龟',X0+4,BOT+44);
}

function drawCarrots(){
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='19px serif';
  carrots.forEach(function(c){ if(c.taken) return;
    var bob=Math.sin(t*2+c.r)*3;
    ctx.fillText('🥕',px(c.p),CARY+bob);
  });
}

function drawHare(x,y){
  var asleep=hare.sleep>0, eating=hare.eating&&!asleep;
  var moving=state==='running'&&hare.v>0.4;
  var hop=moving?Math.abs(Math.sin(t*6.5))*5:0;
  var bob=moving?Math.sin(t*13)*2.4:0;
  var cy=y-hop, bodyY=cy+bob;
  var legA=moving?Math.sin(t*13)*9:0, legB=moving?Math.sin(t*13+Math.PI)*9:0;
  var fillc='#f4f5f7', linec='rgba(90,90,90,.32)';
  ctx.lineWidth=1.6; ctx.strokeStyle=linec;
  function leg(ox,oy,off){ ctx.fillStyle='#e6e9ee'; ctx.beginPath();
    ctx.ellipse(x+ox+off*0.35,bodyY+oy,6,10,off*0.03,0,6.3); ctx.fill(); ctx.stroke(); }
  function ear(ex,ey,ang){ ctx.save(); ctx.translate(ex,ey); ctx.rotate(ang);
    ctx.fillStyle=fillc; ctx.beginPath(); ctx.ellipse(0,-15,5.5,16,0,0,6.3); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ffc9d6'; ctx.beginPath(); ctx.ellipse(0,-15,2.5,11,0,0,6.3); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='#d9d2f2'; circle(x-36,bodyY+8,6);            // 尾巴
  leg(-24,10,legA);                                           // 后腿
  ctx.fillStyle=fillc; ctx.beginPath(); ctx.ellipse(x-10,bodyY,26,18,-0.1,0,6.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fbfcfd'; ctx.beginPath(); ctx.ellipse(x-14,bodyY+4,13,11,0,0,6.3); ctx.fill();
  leg(-2,10,legB);                                            // 前腿
  var arm=moving?Math.sin(t*13+1)*6:(eating?6:-3);
  ctx.fillStyle=fillc; ctx.beginPath(); ctx.ellipse(x+10,bodyY-2+arm*0.4,6,8,0.6,0,6.3); ctx.fill(); ctx.stroke();
  // 头
  var nhx=x+20, nhy=bodyY-15+(eating?6:0);
  ctx.beginPath(); ctx.ellipse(nhx,nhy,16,14,0.1,0,6.3); ctx.fillStyle=fillc; ctx.fill(); ctx.stroke();
  var sway=moving?Math.sin(t*13)*0.15:0;
  ear(nhx-3,nhy-11,asleep?0.3:(eating?0.1:-0.5)+sway);
  ear(nhx+5,nhy-12,asleep?0.45:(eating?0.32:-0.28)-sway);
  ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1.8;
  if(asleep){ [-2,8].forEach(function(k){ ctx.beginPath(); ctx.arc(nhx+k,nhy-2,3.2,Math.PI*1.15,Math.PI*1.9); ctx.stroke(); }); }
  else { ctx.fillStyle='#3a3a3a'; circle(nhx+6,nhy-3,2.3); }
  ctx.fillStyle='#ff9fb0'; circle(nhx+15,nhy+2,2.5);
  ctx.strokeStyle='rgba(130,130,130,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(nhx+13,nhy+4); ctx.lineTo(nhx+23,nhy+1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(nhx+13,nhy+5); ctx.lineTo(nhx+23,nhy+7); ctx.stroke();
  if(eating){ ctx.font='15px serif'; ctx.textAlign='center'; ctx.fillText('😋',x+24,bodyY-34); }
  if(asleep){ ctx.fillStyle='#b07ad6'; ctx.textAlign='left';
    for(var i=0;i<3;i++){ var ph=(t*0.8+i*0.33)%1; ctx.globalAlpha=1-ph;
      ctx.font='bold '+(11+i*4)+'px sans-serif'; ctx.fillText('Z',x+28+i*9,bodyY-30-i*7-ph*20); }
    ctx.globalAlpha=1; }
}

function drawTor(x,y){
  var moving=state==='running', ph=moving?t*5:0, bob=moving?Math.sin(ph*2)*1.3:0;
  var sh=css('--shell'), step=Math.sin(ph)*4;
  ctx.save(); ctx.translate(0,y+bob); ctx.lineWidth=1.5; ctx.strokeStyle='rgba(40,70,50,.5)';
  ctx.fillStyle=shade(sh,-18);                              // 腿
  [[-20,1],[20,-1]].forEach(function(o){ ctx.beginPath();
    ctx.ellipse(x+o[0]+step*o[1],12,7,5,0,0,6.3); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle=shade(sh,10);                               // 头
  ctx.beginPath(); ctx.ellipse(x+34,2,11,9,0.2,0,6.3); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#3a3a3a'; circle(x+40,0,2);
  ctx.strokeStyle='rgba(40,70,50,.55)'; ctx.beginPath(); ctx.moveTo(x+30,-5); ctx.lineTo(x+26,-11); ctx.stroke();
  ctx.fillStyle=shade(sh,-8); ctx.beginPath();              // 尾
  ctx.moveTo(x-28,0); ctx.lineTo(x-37,4); ctx.lineTo(x-27,7); ctx.closePath(); ctx.fill();
  ctx.fillStyle=sh; ctx.beginPath();                        // 壳
  ctx.ellipse(x,0,30,20,0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle=shade(sh,-16); ctx.beginPath();
  ctx.moveTo(x-30,1); ctx.quadraticCurveTo(x,12,x+30,1); ctx.lineTo(x+30,6);
  ctx.quadraticCurveTo(x,17,x-30,6); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=shade(sh,-30); ctx.lineWidth=1.2;
  [-15,-5,5,15].forEach(function(o){ ctx.beginPath(); ctx.moveTo(x+o,-2); ctx.lineTo(x+o*1.6,-15); ctx.stroke(); });
  ctx.restore();
  if(moving&&tor.d>45&&hare.d<tor.d){ ctx.font='13px serif'; ctx.textAlign='center'; ctx.fillText('💪',x-42,y-24); }
}

function fx(){
  if(state==='running'&&hare.v>0.4){ ctx.fillStyle='rgba(255,255,255,.85)';
    for(var i=0;i<5;i++) circle(px(hare.d)-16-i*9,TOP+Math.sin(t*7+i)*7,2.2); }
  ctx.strokeStyle='rgba(90,140,100,.55)'; ctx.lineWidth=1.4;
  for(var k=1;k<=3;k++){ ctx.beginPath(); ctx.moveTo(px(tor.d)-38-k*7,BOT+16);
    ctx.lineTo(px(tor.d)-44-k*7,BOT+24); ctx.stroke(); }
  if(state==='finished'){
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold 25px sans-serif';
    ctx.fillStyle='rgba(0,0,0,.62)'; rr8(W/2-170,30,340,44,12); ctx.fill();
    ctx.fillStyle='#ffd54d'; ctx.fillText('🏁 '+winner+' 获胜 🏁',W/2,52); ctx.restore();
    var cols=['#e05c5c','#f6d44d','#5aa9e6','#7fd6a4'];
    for(var i2=0;i2<20;i2++){ var ph2=(frame+i2*7)%60; ctx.globalAlpha=1-ph2/60;
      ctx.fillStyle=cols[i2%4]; ctx.fillRect(W/2-150+(i2*37)%300,16+ph2*1.6,6,9); }
    ctx.globalAlpha=1;
  }
}

function drawLines(){
  if(!showLines) return;
  var bx=56,by=44,bw=210,bh=72;
  ctx.save(); ctx.fillStyle='rgba(0,0,0,.58)'; rr8(bx-10,by-10,bw+20,bh+34,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('剩余距离曲线（越靠左 = 已跑更远）',bx,by+2);
  var y0=by+14,h0=bh-14, maxd=Math.max(20,hare.d,tor.d);
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.beginPath();
  ctx.moveTo(bx,y0+h0); ctx.lineTo(bx+bw,y0+h0); ctx.stroke();
  ctx.lineWidth=2;
  ctx.strokeStyle=css('--carrot'); ctx.beginPath();
  ctx.moveTo(bx,y0+h0); ctx.lineTo(bx+bw*clamp(hare.d/maxd,0,1),y0); ctx.stroke();
  ctx.strokeStyle=css('--accent'); ctx.beginPath();
  ctx.moveTo(bx,y0+h0); ctx.lineTo(bx+bw*clamp(tor.d/maxd,0,1),y0); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.fillText('🐰 '+hare.d.toFixed(0)+'m ｜ 🐢 '+tor.d.toFixed(0)+'m',bx,y0+h0+16);
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  bg(); track(); drawCarrots();
  drawTor(px(tor.d),BOT); drawHare(px(hare.d),TOP);
  fx(); drawLines();
}

/* ===== 循环 ===== */
function loop(now){
  raf=requestAnimationFrame(loop);
  var d=Math.min(0.05,(now-last)/1000); if(!isFinite(d)||d<0) d=0; last=now;
  if(state==='running') physics(d*speed);
  frame++; draw();
}

/* ===== UI ===== */
function showMsg(who,text){ msgEl.hidden=false;
  msgEl.innerHTML='<span class="who">'+who+'</span> '+text; }
function hideMsg(){ msgEl.hidden=true; }
function hud(){

}

<script>
'use strict';
/* __CORE_START__ ======================================================= */
/* 规则与物理内核：只用标准数学，不访问 DOM，可在 Node 中直接抽出做单元测试。 */

const TABLE = {
  L: 2.74, W: 1.525, NET: 0.1525,    // 真实球台尺寸（m）
  NET_HALF: 1.525 / 2 + 0.06,        // 网（含网柱外沿）横向半宽
  G: 6.2,                            // 游戏尺度重力（略小于 9.8，便于操作）
  REST: 0.80,                        // 台面弹性
  FRIC: 0.955,                       // 弹跳后水平速度保留
  REACH: 0.30,                       // 球拍横向覆盖半径（m）
  PLANE: 1.52,                       // 球拍所在平面（底线后方）
  START_Y: 1.44,                     // 发球时球相对底线的位置
  Z_MAX: 1.35,                       // 拍面能击到的最高球
  DEAD_Y: 2.20, DEAD_X: 1.40,        // 死球判定线
  SMASH_WINDOW: 0.16,                // 扣杀输入有效窗口（s）
  GRAZE: 0.035,                      // 擦网（网顶掠过）判定厚度
  HUMAN_SPEED: 5.4,                  // 人手球拍最大移动速度（m/s）
  SUB: 1 / 300
};

const DIFFICULTY = {
  easy:   { name:'简单', speed:2.1, err:0.34, react:0.22, aim:0.30, fault:0.18, smash:0.05 },
  normal: { name:'中等', speed:3.4, err:0.15, react:0.11, aim:0.15, fault:0.07, smash:0.14 },
  hard:   { name:'困难', speed:5.2, err:0.045, react:0.04, aim:0.06, fault:0.02, smash:0.26 }
};

function mulberry32(a){
  let t = a >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
const other = s => s === 'p1' ? 'p2' : 'p1';
const signOf = s => s === 'p1' ? 1 : -1;
const SIDES = ['p1', 'p2'];

/**
 * 乒乓球规则 + 物理内核。
 * @param {object} cfg {seed, mode, diff, target, winBy, gamesToWin, firstServer}
 */
function createGame(cfg){
  cfg = cfg || {};
  const T = TABLE, halfW = T.W / 2, halfL = T.L / 2;
  const rnd = mulberry32(cfg.seed != null ? cfg.seed : (Date.now() & 0x7fffffff));

  const S = {
    phase: 'menu',                 // menu | serve | rally | dead | over
    paused: false,
    mode: cfg.mode || 'single',    // single | two | demo
    diff: cfg.diff || 'normal',
    target: cfg.target || 11,
    winBy: cfg.winBy || 2,
    gamesToWin: cfg.gamesToWin || 1,
    points: 0,                     // 本局已打分数（决定发球轮换）
    score: { p1: 0, p2: 0 },
    games: { p1: 0, p2: 0 },
    gameLog: [],
    firstServer: cfg.firstServer || 'p1',
    server: cfg.firstServer || 'p1',
    receiver: other(cfg.firstServer || 'p1'),
    ball: { x: 0, y: 0, z: 0.3, vx: 0, vy: 0, vz: 0, spin: 0, live: false },
    paddle: { p1: { x: 0, want: 0, vx: 0 }, p2: { x: 0, want: 0, vx: 0 } },
    lastHitter: null,
    serving: false,                // 仍处于发球判定中
    netTouched: false,             // 本球路是否擦过网带
    bounces: { p1: 0, p2: 0 },     // 本球路在各方台面的落地次数
    rally: 0, longestRally: 0, maxSpeed: 0,
    hits: { p1: 0, p2: 0 }, misses: { p1: 0, p2: 0 },
    stats: { points: 0, lets: 0, serveFaults: 0, aces: 0, smashes: 0 },
    winner: null, pointWinner: null, reason: '', faultBy: null,
    charging: false, charge: 0, smashAt: -99,
    deadTimer: 0, serveTimer: 0, elapsed: 0,
    ai: { err: { p1: 0, p2: 0 }, ready: { p1: 0, p2: 0 }, pred: { p1: 0, p2: 0 }, engaged: { p1: false, p2: false } },
    events: []
  };
  const B = S.ball;

  function emit(ev){ S.events.push(ev); }

  /* ---------- 发球权：每 2 分轮换，局末平分后每分轮换 ---------- */
  function serverFor(a, b){
    const deuce = a >= S.target - 1 && b >= S.target - 1;
    const idx = Math.floor((a + b) / (deuce ? 1 : 2));
    return (idx % 2 === 0) ? S.firstServer : other(S.firstServer);
  }

  function isHuman(side){
    if (S.mode === 'single') return side === 'p1';
    if (S.mode === 'two') return true;
    return false;                  // demo：双方都由 AI 出拍
  }

  /* ---------- 弹道求解：给定落点与飞行时长，反推初速度 ---------- */
  function solveShot(tx, ty, time){
    const vx = (tx - B.x) / time, vy = (ty - B.y) / time;
    const vz = 0.5 * T.G * time - B.z / time;
    let clear = -1;
    if ((B.y > 0 && vy < 0) || (B.y < 0 && vy > 0)){
      const tc = -B.y / vy;
      clear = (tc > 0 && tc < time) ? B.z + vz * tc - 0.5 * T.G * tc * tc : -1;
    }
    return { vx, vy, vz, time, clear };
  }

  /* 逐步放慢（加弧）直到能过网；实在不行就用最弧的一档（可能下网，交给物理） */
  function chooseShot(tx, ty, speed){
    const dist = Math.max(0.3, Math.hypot(tx - B.x, ty - B.y));
    let best = solveShot(tx, ty, dist / speed);
    for (let k = 0; k < 8; k++){
      const shot = solveShot(tx, ty, (dist / speed) * (1 + k * 0.15));
      best = shot;
      if (shot.clear > T.NET + 0.05) break;
    }
    return best;
  }

  function applyShot(shot, side, spin){
    B.vx = shot.vx; B.vy = shot.vy; B.vz = shot.vz;
    B.spin = spin; B.live = true;
    S.lastHitter = side;
    S.netTouched = false;
    S.bounces.p1 = 0; S.bounces.p2 = 0;
    const sp = Math.hypot(B.vx, B.vy, B.vz);
    if (sp > S.maxSpeed) S.maxSpeed = sp;
    if (!S.serving){
      S.rally++;
      if (S.rally > S.longestRally) S.longestRally = S.rally;
    }
    S.hits[side]++;
    emit({ t: 'hit', side, speed: sp, serve: S.serving });
  }

  /* ---------- 回球 ---------- */
  function hitReturn(side){
    const p = S.paddle[side], d = DIFFICULTY[S.diff], opp = S.paddle[other(side)];
    const human = isHuman(side);
    const off = clamp((B.x - p.x) / T.REACH, -1.2, 1.2);
    const edge = Math.abs(off) > 0.8;                  // 拍边缘碰球：更容易失误
    let smash = human
      ? (S.elapsed - S.smashAt < T.SMASH_WINDOW && B.z > 0.22)
      : (B.z > 0.30 && rnd() < d.smash);
    if (smash) S.stats.smashes++;

    // 落点：把球打向对手的空当；边缘碰球时瞄准更深、更容易出界
    const away = opp.x >= 0 ? -1 : 1;
    let aimX, depth, speed;
    if (human){
      aimX = clamp(off * 0.55 + p.vx * 0.05, -1, 1) * halfW * 0.9;
      if (rnd() < 0.22) aimX = away * halfW * 0.7;
      depth = smash ? 0.82 + rnd() * 0.14 : 0.40 + rnd() * 0.5;
      speed = smash ? 8.4 + rnd() * 1.2 : 5.0 + rnd() * 1.3;
      if (edge){ depth += 0.18; speed += 1.0; }
    } else {
      aimX = (away * 0.70 + (rnd() * 2 - 1) * d.aim) * halfW;
      if (rnd() < 0.25) aimX = (rnd() * 2 - 1) * halfW * 0.85;
      depth = 0.42 + rnd() * 0.5;
      speed = smash ? 8.0 : 4.2 + d.speed * 0.75 + rnd() * 1.2;
      if (edge){ aimX *= 1.25; depth += 0.15; }
    }
    const err = human ? (rnd() * 2 - 1) * 0.05 : (rnd() * 2 - 1) * d.aim * 0.6;
    const tx = clamp(aimX + err, -halfW - 0.30, halfW + 0.30);
    const ty = -signOf(side) * clamp(depth, 0.12, 1.0) * halfL;
    S.serving = false;
    playReturn(side, tx, ty, speed, smash);
    S.smashAt = -99;
  }

  function playReturn(side, tx, ty, speed, smash){
    const p = S.paddle[side];
    applyShot(chooseShot(tx, ty, speed), side, clamp(p.vx * 0.28, -2.4, 2.4));
    if (smash) emit({ t: 'smash', side });
  }

  /* ---------- 发球：球必须先落本方台面，弹起过网后再落对方台面 ---------- */
  // 解析模拟一次发球的完整两段轨迹，判断是否合法、过网余量多少
  function judgeServe(shot, x1, y1){
    const sgn = signOf(S.server);
    const ownSide = sgn * y1 > 0.05 && Math.abs(x1) <= halfW - 0.02 && Math.abs(y1) <= halfL - 0.02;
    if (!ownSide) return { ok: false, why: 'first' };
    const vzLand = shot.vz - T.G * shot.time;
    const vz1 = -vzLand * T.REST;
    if (vz1 <= 0) return { ok: false, why: 'first' };
    const vx1 = shot.vx * T.FRIC, vy1 = shot.vy * T.FRIC;
    const t2 = 2 * vz1 / T.G;
    const x2 = x1 + vx1 * t2, y2 = y1 + vy1 * t2;
    if (sgn * y2 > 0) return { ok: false, why: 'short' };               // 弹起后没能过网
    if (Math.abs(x2) > halfW - 0.03 || Math.abs(y2) > halfL - 0.03) return { ok: false, why: 'long' };
    const tc = -y1 / vy1;
    if (!(tc > 0 && tc < t2)) return { ok: false, why: 'short' };
    const zNet = vz1 * tc - 0.5 * T.G * tc * tc;
    const margin = zNet - T.NET;
    if (margin < 0.02) return { ok: false, why: 'net', margin };
    return { ok: true, margin, depth: -sgn * y2 / halfL, spread: Math.abs(x2) / halfW };
  }

  // 在候选发球里挑一个合法的：对「第一落点 × 出手速度」做小网格搜索。
  // power 越大越贴网、越深，风险也越高；badBias 用于 AI 偶发的失误发球（故意选最差的）。
  function findServe(side, power, badBias){
    const sgn = signOf(side), p = S.paddle[side];
    let best = null;
    for (let iy = 0; iy < 9; iy++){
      const y1 = sgn * (0.24 + iy * 0.09 + (rnd() * 2 - 1) * 0.03);
      const x1 = clamp(p.x + (rnd() * 2 - 1) * halfW * 0.55, -halfW + 0.08, halfW - 0.08);
      for (let is = 0; is < 11; is++){
        const speed = 1.7 + is * 0.42 + (rnd() * 2 - 1) * 0.15;
        const time = Math.max(0.1, Math.hypot(x1 - B.x, y1 - B.y) / speed);
        const shot = solveShot(x1, y1, time);
        const res = judgeServe(shot, x1, y1);
        let score;
        if (res.ok){
          score = 60 + Math.min(res.margin, 0.2) * 40
            + (1 - Math.abs(res.depth - (0.55 + power * 0.35))) * 14
            - Math.abs(res.spread - 0.45) * 6 + power * 5;
        } else if (res.why === 'net'){
          score = 6 + (res.margin || -1) * 30;         // 贴网：最接近合法
        } else score = rnd() * 0.5;                     // 完全不合理
        if (badBias) score = -score;
        if (!best || score > best.score) best = { score, shot, x1, y1, res };
      }
    }
    return best;
  }

  function launchServe(side, power){
    const sgn = signOf(side), p = S.paddle[side];
    B.x = clamp(p.x, -halfW + 0.06, halfW - 0.06);
    B.y = sgn * T.START_Y; B.z = 0.26; B.spin = 0;
    S.server = side; S.receiver = other(side);
    S.serving = true; S.lastHitter = side;
    S.netTouched = false;
    S.bounces.p1 = 0; S.bounces.p2 = 0; S.rally = 0;
    S.phase = 'rally';
    const d = DIFFICULTY[S.diff];
    const sloppy = !isHuman(side) && rnd() < d.fault;
    if (sloppy) S.stats.serveFaults++;
    const pick = findServe(side, sloppy ? 0.15 : power, sloppy);
    applyShot(pick.shot, side, clamp(p.vx * 0.22, -1.6, 1.6));
    S.charging = false; S.charge = 0;
    return pick;
  }

  /* ---------- 得分 ---------- */
  function award(winner, reason, faultSide){
    if (S.phase === 'dead' || S.phase === 'over') return;
    S.reason = reason; S.faultBy = faultSide || null;
    B.live = false; S.charging = false; S.charge = 0;

    if (winner === null){                                   // LET：不计分，换发重打
      S.stats.lets++;
      emit({ t: 'let', side: S.server });
      S.pointWinner = null;
      S.phase = 'dead'; S.deadTimer = 1.0;
      return;
    }
    S.pointWinner = winner;
    S.score[winner]++; S.points++;
    if (S.rally === 0) S.stats.aces++;
    S.stats.points++;
    emit({ t: 'score', winner, reason, score: { p1: S.score.p1, p2: S.score.p2 } });

    const a = S.score.p1, b = S.score.p2;
    const gameDone = (a >= S.target || b >= S.target) && Math.abs(a - b) >= S.winBy;
    if (!gameDone){
      S.phase = 'dead'; S.deadTimer = 1.1;
      return;
    }
    S.games[winner]++;
    S.gameLog.push({ p1: a, p2: b, winner });
    emit({ t: 'gameEnd', winner, p1: a, p2: b, games: { p1: S.games.p1, p2: S.games.p2 } });
    if (S.games[winner] >= S.gamesToWin){
      S.winner = winner;
      S.phase = 'over';
      S.reason = '比赛结束';
      emit({ t: 'matchEnd', winner, games: { p1: S.games.p1, p2: S.games.p2 } });
      return;
    }
    S.score.p1 = 0; S.score.p2 = 0; S.points = 0;
    S.firstServer = other(S.firstServer);                   // 下一局换先发
    S.phase = 'dead'; S.deadTimer = 3.0;
  }

  function startPoint(){
    S.phase = 'serve';
    S.rally = 0; S.bounces.p1 = 0; S.bounces.p2 = 0;
    S.lastHitter = null; S.serving = true;
    S.netTouched = false;
    S.charging = false; S.charge = 0; S.smashAt = -99;
    S.server = serverFor(S.score.p1, S.score.p2);
    S.receiver = other(S.server);
    S.ai.engaged.p1 = false; S.ai.engaged.p2 = false;
    S.ai.ready.p1 = 0; S.ai.ready.p2 = 0;
    const sgn = signOf(S.server), p = S.paddle[S.server];
    B.live = false; B.spin = 0; B.vx = B.vy = B.vz = 0;
    B.x = clamp(p.x, -halfW + 0.06, halfW - 0.06);
    B.y = sgn * T.START_Y; B.z = 0.26;
    S.serveTimer = isHuman(S.server) ? 0 : 0.5 + rnd() * 0.7;
    emit({ t: 'serve', side: S.server, score: { p1: S.score.p1, p2: S.score.p2 } });
  }

  /* ---------- 单步物理积分 ---------- */
  function integrate(b, h){
    b.vx += b.spin * h * 0.26;
    b.spin *= (1 - 1.6 * h);
    b.x += b.vx * h; b.y += b.vy * h;
    b.vz -= T.G * h; b.z += b.vz * h;
  }

  function onTable(x, y){
    return Math.abs(x) <= halfW + 0.015 && Math.abs(y) <= halfL + 0.015;
  }

  /* 向前推算球到达某一侧拍面平面时的横向位置（找不到就返回 null） */
  function predictPlane(side){
    const sgn = signOf(side), plane = sgn * T.PLANE;
    if ((sgn > 0 && B.vy <= 0.02) || (sgn < 0 && B.vy >= -0.02)) return null;
    const b = { x: B.x, y: B.y, z: B.z, vx: B.vx, vy: B.vy, vz: B.vz, spin: B.spin };
    const h = 1 / 150;
    for (let i = 0; i < 420; i++){
      const y0 = b.y, x0 = b.x, z0 = b.z;
      integrate(b, h);
      if (b.z <= 0 && b.vz <= 0){
        if (!onTable(b.x, b.y)) return null;
        b.vz = -b.vz * T.REST; b.vx *= T.FRIC; b.vy *= T.FRIC; b.z = 0;
      }
      if ((sgn > 0 && b.y >= plane) || (sgn < 0 && b.y <= plane)){
        const f = (plane - y0) / (b.y - y0);
        return { x: x0 + (b.x - x0) * f, z: Math.max(0, z0 + (b.z - z0) * f) };
      }
      if (Math.abs(b.y) > T.DEAD_Y || Math.abs(b.x) > T.DEAD_X) return null;
    }
    return null;
  }

  /* ---------- AI 跑位与击球 ---------- */
  function aiMove(side, dt){
    const d = DIFFICULTY[S.diff], p = S.paddle[side];
    const towards = side === 'p1' ? B.vy > 0.04 : B.vy < -0.04;
    if (S.phase === 'rally' && B.live && towards && !S.ai.engaged[side]){
      S.ai.engaged[side] = true;
      const pr = predictPlane(side);
      S.ai.pred[side] = pr ? pr.x : 0;
      S.ai.err[side] = (rnd() * 2 - 1) * d.err;
      S.ai.ready[side] = d.react;
    }
    if (S.ai.ready[side] > 0) S.ai.ready[side] -= dt;
    let want;
    if (S.phase === 'serve'){
      want = side === S.server ? clamp(p.x, -0.5, 0.5) : 0;
    } else if (!B.live || !towards){
      want = 0;                                   // 回中路准备下一板
    } else {
      const lag = S.ai.ready[side] > 0 ? S.ai.err[side] * 0.25 : S.ai.err[side];
      want = S.ai.pred[side] + lag;
    }
    want = clamp(want, -halfW - 0.3, halfW + 0.3);
    const maxStep = d.speed * dt;
    const before = p.x;
    p.x = clamp(p.x + clamp(want - p.x, -maxStep, maxStep), -1.2, 1.2);
    p.vx = (p.x - before) / Math.max(dt, 1e-4);
    p.want = want;
  }

  /* ---------- 判定：球已离开比赛（出界 / 下网 / 对方未接到） ---------- */
  function finishAsOut(){
    const hitter = S.lastHitter || S.server, recv = other(hitter);
    if (S.serving){
      if (S.bounces[S.server] === 0) award(recv, '发球未先落本方台面', S.server);
      else if (S.bounces[recv] >= 1) award(hitter, '对方没接到', recv);
      else award(recv, '发球出界', S.server);
      return;
    }
    if (S.bounces[recv] >= 1) award(hitter, '对方没接到', recv);
    else if (S.netTouched) award(recv, '回球下网', hitter);
    else award(recv, '回球出界', hitter);
  }

  /* ---------- 落地判定 ---------- */
  function handleLanding(){
    const side = B.y > 0 ? 'p1' : 'p2';
    const hitter = S.lastHitter || S.server;
    const recv = other(hitter);

    if (!onTable(B.x, B.y)){ finishAsOut(); return; }

    S.bounces[side]++;
    emit({ t: 'bounce', side, power: Math.min(1, Math.abs(B.vz) / 2.2), x: B.x, y: B.y });

    if (S.serving){
      const srv = S.server, rcv = other(srv);
      if (S.bounces[srv] === 1 && side === srv){
        /* 第一落点在本方台面：合法，继续 */
      } else if (S.bounces[srv] > 1){
        award(rcv, '发球未过网', srv); return;
      } else if (S.bounces[rcv] === 1){
        if (S.netTouched){ award(null, 'LET 擦网重发', null); return; }
        S.serving = false;                      // 发球生效，回合开始
      } else {
        award(rcv, '发球失误', srv); return;
      }
    } else {
      if (side === hitter && S.bounces[hitter] >= 1){
        award(recv, '回球落本方台面', hitter); return;
      }
      if (S.bounces[side] >= 2){
        award(S.lastHitter || other(side), '两跳得分', side); return;
      }
    }
    const incoming = B.vz;
    B.vz = -incoming * T.REST; B.vx *= T.FRIC; B.vy *= T.FRIC; B.z = 0;
  }

  /* ---------- 过网判定 ---------- */
  function handleNetCross(prevX, prevZ, f){
    const xCross = prevX + (B.x - prevX) * f;
    const zCross = prevZ + (B.z - prevZ) * f;
    B.x = xCross;
    if (Math.abs(xCross) > T.NET_HALF) return;   // 从网柱外侧绕过：不碰网，落点仍需进台
    if (zCross > T.NET) return;
    if (T.NET - zCross <= T.GRAZE){
      S.netTouched = true;             // 擦网带：球继续飞行，若落入对方台面判 LET
      B.z = T.NET;
      B.vz += 0.28; B.vx *= 0.92; B.vy *= 0.90;
      emit({ t: 'graze', side: S.lastHitter });
      return;
    }
    S.netTouched = true;               // 下网：球被网挡回
    B.y = 0; B.z = Math.max(0, zCross);
    B.vy = -B.vy * 0.22; B.vx *= 0.35; B.vz = Math.min(B.vz, 0.12) * 0.4;
    B.spin = 0;
    emit({ t: 'net', side: S.lastHitter });
  }

  /* ---------- 拍面平面上的回击 ---------- */
  function handlePlane(side, prevY){
    const sgn = signOf(side), plane = sgn * T.PLANE;
    const crossed = sgn > 0 ? (prevY < plane && B.y >= plane) : (prevY > plane && B.y <= plane);
    if (!crossed) return false;
    if (S.lastHitter === side) return false;
    const p = S.paddle[side];
    const inReach = Math.abs(B.x - p.x) <= T.REACH && B.z <= T.Z_MAX && B.z >= -0.02;
    if (S.bounces[side] < 1){
      // 球还没在本方台面弹起：拍面让开，等它落地（出界则由落地判定扣分）。
      // 若这时强行挥拍就是「抢击犯规」，按规则判对方得分。
      if (inReach && (isHuman(side) ? S.smashAt > S.elapsed - T.SMASH_WINDOW : false)){
        award(other(side), '抢击犯规', side);
        return true;
      }
      return false;
    }
    if (inReach){ hitReturn(side); return true; }
    S.misses[side]++;
    emit({ t: 'whiff', side });
    return false;
  }

  /* ---------- 一个子步 ---------- */
  const SUB = TABLE.SUB;
  let acc = 0;
  function physics(){
    const h = SUB;
    const prevY = B.y, prevX = B.x, prevZ = B.z;
    integrate(B, h);
    const sp = Math.hypot(B.vx, B.vy, B.vz);
    if (sp > S.maxSpeed) S.maxSpeed = sp;

    if ((prevY > 0) !== (B.y > 0)){                       // 越过球网所在平面
      const f = prevY / (prevY - B.y || 1e-9);
      handleNetCross(prevX, prevZ, f);
    }
    if (B.z <= 0 && B.vz <= 0){ handleLanding(); return; }
    if (handlePlane('p1', prevY)) return;
    if (handlePlane('p2', prevY)) return;
    if (Math.abs(B.y) > T.DEAD_Y || Math.abs(B.x) > T.DEAD_X) finishAsOut();
  }

  /* ---------- 主循环 ---------- */
  function step(dt){
    if (S.paused || S.phase === 'menu' || S.phase === 'over') return;
    dt = Math.min(Math.max(dt, 0), 0.05);
    S.elapsed += dt;

    for (const side of SIDES){
      const p = S.paddle[side];
      if (isHuman(side)){
        const target = clamp(p.want, -1.2, 1.2);
        const maxStep = TABLE.HUMAN_SPEED * dt;
        const before = p.x;
        p.x = clamp(p.x + clamp(target - p.x, -maxStep, maxStep), -1.2, 1.2);
        p.vx = (p.x - before) / Math.max(dt, 1e-4);
      } else aiMove(side, dt);
    }

    if (S.phase === 'rally'){
      acc += dt;
      let guard = 0;
      while (acc >= SUB && guard++ < 240 && S.phase === 'rally' && B.live){
        physics();
        acc -= SUB;
      }
      if (S.phase !== 'rally') acc = 0;
    } else if (S.phase === 'serve'){
      acc = 0;
      if (isHuman(S.server)){
        if (S.charging) S.charge = Math.min(1, S.charge + dt / 1.05);
        const sgn = signOf(S.server), p = S.paddle[S.server];
        B.x = clamp(p.x, -halfW + 0.06, halfW - 0.06);
        B.y = sgn * T.START_Y;
        B.z = 0.26 + (S.charging ? Math.sin(S.charge * Math.PI) * 0.14 : Math.sin(S.elapsed * 2.4) * 0.02);
      } else {
        S.serveTimer -= dt;
        if (S.serveTimer <= 0) launchServe(S.server, 0.35 + rnd() * 0.55);
      }
    } else if (S.phase === 'dead'){
      acc = 0;
      S.deadTimer -= dt;
      if (S.deadTimer <= 0) startPoint();
    }
  }

  const api = {
    S, TABLE, DIFFICULTY, isHuman, serverFor,
    startMatch(over){
      Object.assign(S, over || {});
      S.score.p1 = 0; S.score.p2 = 0; S.games.p1 = 0; S.games.p2 = 0;
      S.points = 0; S.gameLog = []; S.rally = 0; S.longestRally = 0; S.maxSpeed = 0;
      S.hits.p1 = 0; S.hits.p2 = 0; S.misses.p1 = 0; S.misses.p2 = 0;
      S.stats = { points: 0, lets: 0, serveFaults: 0, aces: 0, smashes: 0 };
      S.winner = null; S.pointWinner = null; S.reason = ''; S.faultBy = null;
      S.elapsed = 0; S.paused = false; S.events.length = 0; acc = 0;
      S.firstServer = S.firstServer || 'p1';
      S.server = S.firstServer; S.receiver = other(S.server);
      S.paddle.p1.x = S.paddle.p1.want = S.paddle.p1.vx = 0;
      S.paddle.p2.x = S.paddle.p2.want = S.paddle.p2.vx = 0;
      B.live = false;
      startPoint();
    },
    setPaddle(side, x){ S.paddle[side].want = clamp(x, -1.2, 1.2); },
    beginServe(side){
      if (S.phase === 'serve' && side === S.server && isHuman(side)) S.charging = true;
    },
    endServe(side){
      if (S.phase === 'serve' && side === S.server && isHuman(side) && S.charging)
        launchServe(side, 0.30 + 0.70 * S.charge);
      else S.charging = false;
    },
    smash(side){ if (isHuman(side)) S.smashAt = S.elapsed; },
    pause(v){ S.paused = v === undefined ? !S.paused : !!v; },
    toMenu(){ S.phase = 'menu'; S.paused = false; B.live = false; },
    step
  };
  return api;
}

if (typeof module !== 'undefined' && module.exports){
  module.exports = { createGame, TABLE, DIFFICULTY, mulberry32, clamp, other, signOf };
}

if (typeof window !== 'undefined' && typeof document !== 'undefined'){
(function(){

  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

  const game = createGame({

  /* ---------- 主题 ---------- */

  /* ---------- 投影：把台面 (x,y,z) 米坐标画成伪 3D ---------- */

  /* ---------- 绘制 ---------- */
