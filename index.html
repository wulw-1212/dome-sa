  function segLine(x1, y1, z1, x2, y2, z2, w, color){
    const a = project(x1, y1, z1), b = project(x2, y2, z2);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.lineWidth = w; ctx.strokeStyle = color; ctx.stroke();
  }
  function disc(x, y, r, fill){
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  }
  const ripples = [];

  function drawWorld(){
    const g = ctx.createLinearGradient(0, 0, 0, H0);
    g.addColorStop(0, css('--floor1')); g.addColorStop(1, css('--floor2'));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W0, H0);

    const fL = project(-halfW, -halfL, 0), fR = project(halfW, -halfL, 0);
    const nR = project(halfW, halfL, 0), nL = project(-halfW, halfL, 0);

    // 台体侧面与地面阴影
    ctx.fillStyle = 'rgba(10,25,40,.30)';
    ctx.beginPath();
    ctx.moveTo(nL.x - 12, nL.y + 30); ctx.lineTo(nR.x + 12, nR.y + 30);
    ctx.lineTo(nR.x, nR.y); ctx.lineTo(nL.x, nL.y); ctx.closePath(); ctx.fill();
    const legFar = 0.76;
    for (const sx of [-1, 1]){
      const top = project(sx * halfW * 0.82, legFar, 0), bot = project(sx * halfW * 0.86, legFar, -0.74);
      ctx.strokeStyle = 'rgba(40,60,80,.55)'; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(bot.x, bot.y); ctx.stroke();
    }

    const tg = ctx.createLinearGradient(0, fL.y, 0, nL.y);
    tg.addColorStop(0, css('--tbl-top')); tg.addColorStop(1, css('--tbl-bot'));
    quad(fL, fR, nR, nL, tg);
    ctx.fillStyle = 'rgba(6,22,36,.55)';
    ctx.fillRect(nL.x, nL.y, nR.x - nL.x, 10);

    const line = css('--tbl-line');
    segLine(-halfW, -halfL, .002, halfW, -halfL, .002, 3, line);
    segLine(-halfW, halfL, .002, halfW, halfL, .002, 3, line);
    segLine(-halfW, -halfL, .002, -halfW, halfL, .002, 3, line);
    segLine(halfW, -halfL, .002, halfW, halfL, .002, 3, line);
    segLine(0, -halfL, .002, 0, halfL, .002, 2, 'rgba(255,255,255,.6)');

    // 弹跳涟漪
    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i], age = (S.elapsed - rp.t0) / 0.34;
      if (age >= 1){ ripples.splice(i, 1); continue; }
      const pp = project(rp.x, rp.y, 0.004);
      ctx.globalAlpha = (1 - age) * 0.55;
      ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(pp.x, pp.y, 5 + age * 26, (5 + age * 26) * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    drawPaddle('p2');
    drawBall();

    // 球网
    const nT = T.NET;
    quad(project(-T.NET_HALF, 0, 0), project(-T.NET_HALF, 0, nT),
         project(T.NET_HALF, 0, nT), project(T.NET_HALF, 0, 0), 'rgba(224,238,248,.32)');
    for (let i = -8; i <= 8; i++){
      const x = (i / 8) * T.NET_HALF;
      segLine(x, 0, 0, x, 0, nT, 1, 'rgba(255,255,255,.3)');
    }
    segLine(-T.NET_HALF, 0, nT, T.NET_HALF, 0, nT, 3, css('--net'));
    segLine(-T.NET_HALF, 0, -0.03, -T.NET_HALF, 0, nT + 0.04, 5, 'rgba(35,55,75,.9)');
    segLine(T.NET_HALF, 0, -0.03, T.NET_HALF, 0, nT + 0.04, 5, 'rgba(35,55,75,.9)');

    drawPaddle('p1');

    if (S.phase === 'serve'){
      const p = S.paddle[S.server], pr = project(p.x, signOf(S.server) * T.PLANE, 0.12);
      const below = S.server === 'p1';
      ctx.textAlign = 'center'; ctx.font = '600 15px system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      const label = game.isHuman(S.server)
        ? (S.charging ? `蓄力 ${Math.round(S.charge * 100)}%` : '按住空格 / 点画面蓄力发球')
        : `${sideLabel(S.server)}发球中…`;
      ctx.fillText(label, clamp(pr.x, 110, W0 - 110), below ? pr.y + 58 : pr.y - 40);
      if (S.charging){
        const bx = clamp(pr.x, 110, W0 - 110) - 62, by = below ? pr.y + 64 : pr.y - 56;
        ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(bx, by, 124, 7);
        ctx.fillStyle = '#ffd54a'; ctx.fillRect(bx, by, 124 * S.charge, 7);
      }
    }
  }

  function drawPaddle(side){
    const p = S.paddle[side], sgn = signOf(side);
    const c = project(p.x, sgn * T.PLANE, 0.10);
    const r = 0.13 * c.s;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, 0.86);
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(3, 6, r, r * 0.86, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c69a5e';
    ctx.fillRect(-4.5, sgn > 0 ? r * 0.5 : -r * 1.75, 9, r * 1.3);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = css(side === 'p1' ? '--p1' : '--p2'); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fill();
    ctx.restore();
  }

  let trail = [];
  function drawBall(){
    const b = S.ball;
    if (!b.live && S.phase !== 'serve') return;
    const sh = project(b.x, b.y, 0), h = Math.max(0, b.z);
    ctx.save();
    ctx.globalAlpha = clamp(0.46 - h * 0.15, 0.05, 0.46);
    ctx.fillStyle = css('--shadow');
    ctx.beginPath(); ctx.ellipse(sh.x, sh.y, 8 + h * 6, (8 + h * 6) * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    for (let i = 0; i < trail.length; i++){
      const pp = project(trail[i].x, trail[i].y, trail[i].z);
      ctx.globalAlpha = (i / trail.length) * 0.3;
      disc(pp.x, pp.y, 3 + i * 0.35, css('--ball'));
    }
    ctx.globalAlpha = 1;
    const bp = project(b.x, b.y, Math.max(h, 0.014));
    const rad = Math.max(6, bp.s * 0.024);
    const rg = ctx.createRadialGradient(bp.x - rad * 0.32, bp.y - rad * 0.36, rad * 0.18, bp.x, bp.y, rad);
    rg.addColorStop(0, '#ffffff'); rg.addColorStop(1, css('--ball'));
    ctx.beginPath(); ctx.arc(bp.x, bp.y, rad, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.stroke();
    if (Math.abs(b.y) > halfL + 0.42){
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '600 12px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.y > 0 ? '球在画面下方' : '球在画面上方', clamp(bp.x, 70, W0 - 70), clamp(bp.y, 30, H0 - 12));
    }
  }

  /* ---------- HUD / 文字 ---------- */
  let msgTimer = 0;
  function showMsg(text, sub, hold){
    const m = el('msg'); m.textContent = text;
    if (sub){ const s = document.createElement('small'); s.textContent = sub; m.appendChild(s); }
    m.classList.add('show'); msgTimer = hold || 1.4;
  }
  function sideLabel(side){
    if (S.mode === 'single') return side === 'p1' ? '你' : '电脑';
    if (S.mode === 'two') return side === 'p1' ? '玩家 1' : '玩家 2';
    return side === 'p1' ? 'AI 红' : 'AI 蓝';
  }
  function updateHUD(){
    el('lbl1').textContent = sideLabel('p1');
    el('lbl2').textContent = sideLabel('p2');
    el('s1').textContent = S.score.p1; el('s2').textContent = S.score.p2;
    el('g1').textContent = S.games.p1; el('g2').textContent = S.games.p2;
    el('rally').textContent = S.rally; el('longest').textContent = S.longestRally;
    el('speed').textContent = Math.round(S.maxSpeed * 3.6);
    el('chip1').classList.toggle('serving', S.server === 'p1' && S.phase !== 'over');
    el('chip2').classList.toggle('serving', S.server === 'p2' && S.phase !== 'over');
    el('menuMask').classList.toggle('show', S.phase === 'menu');
    el('pauseMask').classList.toggle('show', S.paused && S.phase !== 'menu' && S.phase !== 'over');
    el('overMask').classList.toggle('show', S.phase === 'over');
    if (S.phase === 'over'){
      el('overTitle').textContent = `${sideLabel(S.winner)} 赢得比赛 🏆`;
      el('overText').textContent = `局分 ${S.games.p1} : ${S.games.p2} · ` +
        S.gameLog.map(g => `${g.p1}:${g.p2}`).join(' / ') +
        ` · 最长回合 ${S.longestRally} 板 · 扣杀 ${S.stats.smashes} 次`;
    }
    el('startBtn').textContent = S.phase === 'menu' ? '▶ 开始比赛'
      : S.phase === 'over' ? '▶ 再来一场' : '▶ 重新开始';
  }
  function renderLog(){
    const ul = el('log');
    ul.innerHTML = '';
    const rows = S.gameLog.slice(-6).map(g => `第 ${S.gameLog.indexOf(g) + 1} 局 ${g.p1}:${g.p2}`);
    if (!rows.length){
      const li = document.createElement('li');
      li.textContent = `球台 ${T.L}m × ${T.W}m · 网高 ${T.NET}m（真实尺寸）`;
      ul.appendChild(li);
    }
    rows.forEach(r => { const li = document.createElement('li'); li.textContent = r; ul.appendChild(li); });
  }

  /* ---------- 输入 ---------- */
  const keys = {};
  let pointerX = null;
  function clientToTableX(clientX){
    const r = cv.getBoundingClientRect();
    return toTableX((clientX - r.left) * (W0 / r.width));
  }
  function humanSides(){ return S.mode === 'single' ? ['p1'] : S.mode === 'two' ? ['p1', 'p2'] : []; }
  const primary = 'p1';

  cv.addEventListener('pointermove', e => { pointerX = clientToTableX(e.clientX); });
  cv.addEventListener('pointerdown', e => {
    document.body.classList.add('touch');
    pointerX = clientToTableX(e.clientX);
    if (S.phase === 'menu'){ startMatch(); return; }
    if (S.phase === 'over'){ startMatch(); return; }
    if (S.phase === 'serve') game.beginServe(primary);
    else game.smash(primary);
  });
  addEventListener('pointerup', () => { if (S.charging) game.endServe(primary); });
  addEventListener('pointercancel', () => { if (S.charging) game.endServe(primary); });

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (e.code === 'Space' || k === ' '){
      e.preventDefault();
      if (S.phase === 'menu' || S.phase === 'over') startMatch();
      else if (S.phase === 'serve') game.beginServe(primary);
      else game.smash(primary);
      return;
    }
    if (k === 'shift'){ game.beginServe('p2'); return; }
    if (k === 'p' || e.key === 'Escape'){ if (S.phase !== 'menu' && S.phase !== 'over') game.pause(); return; }
    if (k === 'r'){ resetAll(); return; }
    if (k === 'm'){ toggleMute(); return; }
    if (k === 't'){ dark = !dark; applyTheme(); return; }
    if (k === 'enter'){ if (S.phase === 'menu' || S.phase === 'over') startMatch(); return; }
    keys[k] = true;
  });
  addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (e.code === 'Space' || k === ' '){ if (S.charging) game.endServe(primary); }
    if (k === 'shift'){ if (S.charging && S.server === 'p2') game.endServe('p2'); }
  });
  el('touchServe').addEventListener('pointerdown', () => { if (S.phase === 'serve') game.beginServe(primary); });
  el('touchServe').addEventListener('pointerup', () => { if (S.charging) game.endServe(primary); });
  el('touchSmash').addEventListener('pointerdown', () => game.smash(primary));

  /* ---------- 控件 ---------- */
  let mode = qs.get('mode') || 'single';
  const seg = el('modeSeg');
  function paintSeg(){ [...seg.children].forEach(b => b.classList.toggle('on', b.dataset.mode === mode)); }
  paintSeg();
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.mode; paintSeg();
    if (S.phase !== 'menu') startMatch();
  });
  el('diffSel').value = S.diff;
  el('boSel').value = String(S.gamesToWin);
  el('startBtn').addEventListener('click', startMatch);
  el('pauseBtn').addEventListener('click', () => { if (S.phase !== 'menu' && S.phase !== 'over') game.pause(); });
  el('resetBtn').addEventListener('click', resetAll);
  el('themeBtn').addEventListener('click', () => { dark = !dark; applyTheme(); });
  el('soundBtn').addEventListener('click', toggleMute);
  function toggleMute(){
    muted = !muted;
    el('soundBtn').textContent = muted ? '🔇 静音' : '🔊 音效';
    if (!muted) tone(680, 0.08, 'triangle', 0.11);
  }
  el('soundBtn').textContent = muted ? '🔇 静音' : '🔊 音效';

  function startMatch(){
    S.mode = mode;
    S.diff = el('diffSel').value;
    S.gamesToWin = +el('boSel').value;
    game.startMatch({});
    showMsg('比赛开始', '先发球：' + sideLabel(S.server), 1.6);
    foot(); renderLog();
  }
  function resetAll(){
    game.toMenu();
    S.score.p1 = 0; S.score.p2 = 0; S.games.p1 = 0; S.games.p2 = 0;
    S.rally = 0; S.longestRally = 0; S.maxSpeed = 0; S.gameLog = [];
    S.stats = { points: 0, lets: 0, serveFaults: 0, aces: 0, smashes: 0 };
    S.ball.live = false; trail.length = 0; ripples.length = 0;
    showMsg('已回到准备页', '选模式后点「开始比赛」', 1.1);
    foot(); renderLog();
  }
  function foot(){
    el('foot').textContent =
      `当前：${sideLabel('p1')} vs ${sideLabel('p2')} · ${DIFFICULTY[S.diff].name}难度 · ` +
      (S.gamesToWin === 1 ? '一局 11 分' : `${S.gamesToWin * 2 - 1} 局 ${S.gamesToWin} 胜`) +
      ` · 球台 ${T.L}m × ${T.W}m、网高 ${T.NET}m（真实尺寸）`;
  }

  /* ---------- 主循环 ---------- */
  let last = performance.now(), frozen = false;
  function frame(now){
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    if (frozen){ drawWorld(); updateHUD(); requestAnimationFrame(frame); return; }
    for (const side of humanSides()){
      let want = S.paddle[side].want;
      if (side === 'p1'){
        if (pointerX !== null) want = pointerX;
        if (keys['arrowleft']) want -= 3.4 * dt;
        if (keys['arrowright']) want += 3.4 * dt;
      } else {
        if (keys['a']) want -= 3.4 * dt;
        if (keys['d']) want += 3.4 * dt;
      }
      game.setPaddle(side, clamp(want, -1.2, 1.2));
    }
    const phaseBefore = S.phase, scoreBefore = S.score.p1 + S.score.p2, gamesBefore = S.gameLog.length;
    game.step(dt);
    let newGame = false;
    while (S.events.length){
      const ev = S.events.shift();
      onEvent(ev);
      if (ev.t === 'bounce') ripples.push({ t0: S.elapsed, x: ev.x, y: ev.y });
      if (ev.t === 'score') showMsg(sideLabel(ev.winner) + ' 拿下一分', ev.reason, 1.15);
      if (ev.t === 'let') showMsg('LET · 擦网重发', '不计分，重新发球', 1.25);
      if (ev.t === 'gameEnd') newGame = true;
      if (ev.t === 'matchEnd') renderLog();
    }
    if (S.gameLog.length !== gamesBefore) renderLog();
    if (S.phase !== phaseBefore && S.phase === 'serve' && scoreBefore === S.score.p1 + S.score.p2 && !newGame){
      /* 同一分内的 LET 重发：无需额外提示 */
    }
    if (S.ball.live){ trail.push({ x: S.ball.x, y: S.ball.y, z: S.ball.z }); if (trail.length > 11) trail.shift(); }
    else if (trail.length) trail.shift();
    if (msgTimer > 0){ msgTimer -= dt; if (msgTimer <= 0) el('msg').classList.remove('show'); }
    drawWorld();
    updateHUD();
    requestAnimationFrame(frame);
  }

  /* ---------- 自动化演示参数：?auto=1 直接开打，?ff=<秒> 先推进若干秒再出画 ---------- */
  // 无头截图时 requestAnimationFrame 不会自然推进，这里用固定步长同步快进。
  function fastForward(seconds){
    const dt = 1 / 60;
    for (let i = 0; i < Math.round(seconds * 60); i++){
      if (S.phase === 'over') break;
      if (S.phase === 'serve' && game.isHuman(S.server) && !S.charging){
        game.beginServe(S.server);
      } else if (S.phase === 'serve' && game.isHuman(S.server) && S.charge > 0.7){
        game.endServe(S.server);
      }
      for (const side of humanSides()){
        // 快进时玩家拍自动追踪来球，便于单人模式也能打出连续回合
        const b = S.ball;
        const towards = side === 'p1' ? b.vy > 0 : b.vy < 0;
        game.setPaddle(side, towards && b.live ? clamp(b.x, -1.2, 1.2) : 0);
      }
      game.step(dt);
      S.events.length = 0;
      if (S.ball.live){ trail.push({ x: S.ball.x, y: S.ball.y, z: S.ball.z }); if (trail.length > 11) trail.shift(); }
    }
  }

  if (qs.get('auto') === '1'){
    mode = qs.get('mode') || (qs.get('demo') === '1' ? 'demo' : 'single');
    paintSeg();
    startMatch();
    if (qs.get('demo') === '1'){
      S.mode = 'demo';
      el('lbl1').textContent = sideLabel('p1');
      el('lbl2').textContent = sideLabel('p2');
    }
    const ff = +(qs.get('ff') || 0);
    if (ff > 0){
      fastForward(ff);
      el('msg').classList.remove('show'); msgTimer = 0;
    }
    // 截图用：直接摆出发球蓄力条
    const charge = qs.get('charge');
    if (charge !== null && S.phase === 'serve' && game.isHuman(S.server)){
      game.beginServe(S.server); S.charge = clamp(+charge, 0, 1);
      el('msg').classList.remove('show'); msgTimer = 0;
    }
    if (qs.get('freeze') === '1') frozen = true;
    if (qs.get('pause') === '1') game.pause(true);
  }
  requestAnimationFrame(frame);
  foot(); renderLog();
})();
}
/* __UI_END__ */
</script>
</body>
</html>
