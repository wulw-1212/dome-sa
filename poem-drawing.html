<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="一幅用 Canvas 现场绘制的《巴山夜雨》图画：巴山、夜雨、秋池、西窗烛，四个时段可切换，完全离线。">
<title>巴山夜雨 · A Picture of a Poem</title>
<style>
:root{
  --ink:#1e2b3a; --muted:#5d6f82; --paper:#f2f5f9; --card:#ffffff;
  --line:rgba(60,90,120,.20); --accent:#2f6fa8; --chip:#e8eef5;
  --shadow:0 14px 34px rgba(30,50,80,.14);
}
[data-theme="dark"]{
  --ink:#e6eef8; --muted:#9db0c6; --paper:#0e1524; --card:#151d30;
  --line:rgba(150,180,215,.24); --accent:#6ab0ea; --chip:#1c2740;
  --shadow:0 14px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px 16px 40px; transition:background .25s,color .25s;
}
.wrap{max-width:1204px;margin:0 auto}
header h1{margin:0;font-size:clamp(21px,3.4vw,30px);letter-spacing:.5px}
header h1 .en{font-weight:500;color:var(--muted);font-size:.62em;margin-left:8px}
header .sub{margin:6px 0 16px;color:var(--muted)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:10px;line-height:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;border-radius:8px;background:#0b1220}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp .lbl{color:var(--muted);font-size:13px;margin-right:2px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:7px 13px;transition:transform .08s,background .2s,border-color .2s}
button:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type="number"]{font:inherit;width:92px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
kbd{background:var(--chip);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;font-family:inherit;font-size:12px}
.meta{color:var(--muted);font-size:13px;margin:10px 0 0}
#selftest{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);font-size:13px;line-height:1.7}
#selftest h2{margin:0 0 6px;font-size:15px}
#selftest .ok{color:#2e8b57}#selftest .bad{color:#c0392b}
[data-theme="dark"] #selftest .ok{color:#6fd39b}
[data-theme="dark"] #selftest .bad{color:#ff8a7a}
[data-ui="off"]{padding:0;background:#000}
[data-ui="off"] .wrap{max-width:none;margin:0}
[data-ui="off"] header,[data-ui="off"] .bar,[data-ui="off"] .hint,[data-ui="off"] .meta{display:none}
[data-ui="off"] .stage{padding:0;border:0;border-radius:0;box-shadow:none;background:transparent}
[data-ui="off"] canvas{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;object-fit:cover}
@media (max-width:700px){
  body{padding:12px 10px 28px}
  .stage{padding:6px;border-radius:10px}
  button{padding:6px 11px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>巴山夜雨<span class="en">A Picture of a Poem</span></h1>
    <p class="sub">君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。 —— 画面全部由 Canvas 现场绘制，没有使用任何图片素材</p>
  </header>

  <div class="stage">
    <canvas id="art" width="1200" height="800" role="img"
      aria-label="一幅《巴山夜雨》图画：雨夜里的重重巴山、涨水的秋池、西窗内点着的一支烛"></canvas>
  </div>

  <div class="bar">
    <div class="grp" id="presets">
      <span class="lbl">时段</span>
      <button data-preset="dusk" aria-pressed="false">🌇 雨暮</button>
      <button data-preset="night" aria-pressed="true">🌙 夜雨</button>
      <button data-preset="dawn" aria-pressed="false">🌅 雨歇</button>
      <button data-preset="noon" aria-pressed="false">☁️ 阴午</button>
    </div>
    <div class="grp">
      <span class="lbl">构图</span>
      <button id="redraw">🎲 重画</button>
      <input id="seed" type="number" min="1" max="99999" step="1" aria-label="随机种子 seed">
    </div>
    <div class="grp">
      <button id="motion" aria-pressed="true">🌧 动起来</button>
      <button id="theme">🌗 深色</button>
      <button id="save">💾 保存 PNG</button>
    </div>
  </div>

  <p class="hint">
    <kbd>1</kbd>–<kbd>4</kbd> 换时段 · <kbd>R</kbd> 重画 · <kbd>M</kbd> 动/静 · <kbd>T</kbd> 深浅色 · <kbd>S</kbd> 保存 PNG
  </p>
  <p class="meta" id="meta"></p>

  <section id="selftest" hidden><h2>自检 Self-test</h2><div id="stlist"></div></section>
</div>

<script>
(function(){
'use strict';

/* ---------- 画布与参数 ---------- */
var W = 1200, H = 800;
var canvas = document.getElementById('art');
var ctx = canvas.getContext('2d');
var params = new URLSearchParams(location.search);

function num(name, dflt){
  var v = parseFloat(params.get(name));
  return isFinite(v) ? v : dflt;
}
var clamp = function(v,a,b){ return v < a ? a : v > b ? b : v; };

/* ---------- 四个时段调色板 ----------
   注意：所有颜色值都是带引号的字符串字面量。
   （早期版本把 skyMid:#E0F7FA 这样不带引号的十六进制写进对象，
   JS 会把它读成私有字段 #E0F7FA，整个脚本抛 SyntaxError，画布因此全空。） */
var KEYS = ['skyTop','skyMid','skyBot','sun','sunGlow','sunX','sunY','sunR',
  'farHill','midHill','nearHill','hillMist','treeLine',
  'ground','grass','rock','path','pond','pondDeep','pondShine','ripple','reflection',
  'rain','rainFar','cloud','cloudEdge','window','windowGlow','candle','candleBase',
  'flame','flameCore','glow','moon','stars','vignette','ink'];

var PRESETS = {
  dusk: {
    skyTop:'#4a3f63', skyMid:'#a1616b', skyBot:'#e8a05e',
    sun:'#ffd0a0', sunGlow:'rgba(255,180,110,0.45)', sunX:250, sunY:430, sunR:46,
    farHill:'#5a5170', midHill:'#47405c', nearHill:'#35304a', hillMist:'rgba(120,105,135,0.35)',
    treeLine:'#2b2739', ground:'#3b3448', grass:'#4f4760', rock:'#4a4157',
    path:'#6d5f70', pond:'#4a5570', pondDeep:'#2f3a52', pondShine:'rgba(255,196,140,0.35)',
    ripple:'rgba(255,214,170,0.55)', reflection:'rgba(255,190,130,0.28)',
    rain:'rgba(226,208,214,0.55)', rainFar:'rgba(226,208,214,0.24)',
    cloud:'#8d7d96', cloudEdge:'#b6a4b0',
    window:'#2a2438', windowGlow:'rgba(255,196,110,0.30)', candle:'#f6e3c0',
    candleBase:'#5a4a3e', flame:'rgba(255,168,64,0.9)', flameCore:'#fff2c8',
    glow:'rgba(255,196,110,0.35)', moon:0, stars:18,
    vignette:'rgba(24,16,32,0.45)', ink:'rgba(238,232,220,0.86)'
  },
  night: {
    skyTop:'#0a1024', skyMid:'#131c38', skyBot:'#22304e',
    sun:'#dfe8ff', sunGlow:'rgba(170,200,255,0.24)', sunX:930, sunY:150, sunR:30,
    farHill:'#22304c', midHill:'#1a2740', nearHill:'#121c30', hillMist:'rgba(90,120,170,0.28)',
    treeLine:'#0d1524', ground:'#121a2a', grass:'#1a2740', rock:'#172238',
    path:'#2b3a55', pond:'#1b2b4a', pondDeep:'#0d1730', pondShine:'rgba(170,205,255,0.28)',
    ripple:'rgba(180,214,255,0.34)', reflection:'rgba(150,190,255,0.22)',
    rain:'rgba(186,208,240,0.55)', rainFar:'rgba(186,208,240,0.22)',
    cloud:'#1d2a48', cloudEdge:'#2c3f66',
    window:'#1a2338', windowGlow:'rgba(255,196,110,0.42)', candle:'#f2e2c4',
    candleBase:'#3a3b44', flame:'rgba(255,172,70,0.92)', flameCore:'#fff6d8',
    glow:'rgba(255,190,105,0.38)', moon:1, stars:150,
    vignette:'rgba(0,4,14,0.55)', ink:'rgba(232,238,252,0.88)'
  },
  dawn: {
    skyTop:'#5b7396', skyMid:'#9fb0c4', skyBot:'#d9d2c0',
    sun:'#fff0cf', sunGlow:'rgba(255,232,190,0.40)', sunX:330, sunY:250, sunR:38,
    farHill:'#8b97a8', midHill:'#6f7f7a', nearHill:'#54634f', hillMist:'rgba(190,196,190,0.35)',
    treeLine:'#3f4a3c', ground:'#5a6450', grass:'#6b7558', rock:'#6a6b60',
    path:'#a49a80', pond:'#9aa9b4', pondDeep:'#6d8391', pondShine:'rgba(255,246,214,0.34)',
    ripple:'rgba(255,255,255,0.5)', reflection:'rgba(226,232,226,0.28)',
    rain:'rgba(220,228,236,0.40)', rainFar:'rgba(220,228,236,0.18)',
    cloud:'#c9c9c2', cloudEdge:'#e2dfd2',
    window:'#4a4436', windowGlow:'rgba(255,214,140,0.22)', candle:'#f0e0bd',
    candleBase:'#6a5f4c', flame:'rgba(255,178,84,0.7)', flameCore:'#fff8dc',
    glow:'rgba(255,206,130,0.28)', moon:0, stars:0,
    vignette:'rgba(40,45,50,0.30)', ink:'rgba(250,250,242,0.92)'
  },
  noon: {
    skyTop:'#7e8a96', skyMid:'#a4aeb6', skyBot:'#c6c9c4',
    sun:'#f4f2e6', sunGlow:'rgba(240,240,230,0.28)', sunX:780, sunY:170, sunR:42,
    farHill:'#8d95a0', midHill:'#707f7e', nearHill:'#58675f', hillMist:'rgba(178,186,186,0.34)',
    treeLine:'#44524a', ground:'#5d6659', grass:'#6d7765', rock:'#6e6f66',
    path:'#a9a294', pond:'#93a1a8', pondDeep:'#70838b', pondShine:'rgba(255,255,255,0.30)',
    ripple:'rgba(255,255,255,0.42)', reflection:'rgba(226,232,230,0.26)',
    rain:'rgba(214,220,226,0.45)', rainFar:'rgba(214,220,226,0.2)',
    cloud:'#b9bfc4', cloudEdge:'#d4d7d6',
    window:'#4b463c', windowGlow:'rgba(255,220,150,0.16)', candle:'#ece0c2',
    candleBase:'#6b6151', flame:'rgba(255,182,92,0.55)', flameCore:'#fff8dc',
    glow:'rgba(255,206,140,0.22)', moon:0, stars:0,
    vignette:'rgba(40,46,48,0.28)', ink:'rgba(250,250,244,0.92)'
  }
};

var PRESET_ORDER = ['dusk','night','dawn','noon'];
var PALETTE_KEYS = KEYS.slice();

/* ---------- 确定性随机 ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 状态 ---------- */
var state = {
  preset: 'night',
  seed: Math.round(clamp(num('seed', 7), 1, 99999)),
  t: 0,
  motion: params.get('motion') !== 'off',
  freeze: params.get('freeze') === '1',
  sig: params.get('sig') !== '0',
  theme: params.get('theme') === 'dark' ? 'dark' : 'light'
};
if(!PRESETS[state.preset]) state.preset = 'night';
if(params.get('preset') && PRESETS[params.get('preset')]) state.preset = params.get('preset');

/* ---------- 画面固定常量 ---------- */
/* 三重山脊：从远到近，base 是脊线基准高度 */
var RIDGES = [
  { base:322, amp:58, freq:0.0052, phase:0.7, key:'farHill'  },
  { base:404, amp:74, freq:0.0041, phase:2.4, key:'midHill'  },
  { base:500, amp:96, freq:0.0031, phase:4.9, key:'nearHill' }
];
/* 秋池：椭圆水面 */
var POND = { x: 560, y: 690, rx: 330, ry: 66 };
/* 西窗：画面右侧的木格窗，烛在窗内 */
var WINDOW = { x: 954, y: 268, w: 206, h: 250, panes: 3 };
var CANDLE = { x: 1012, y: 452, h: 74, w: 22 };
/* 石阶小径：从右下角弯向池边 */
var PATH_CURVE = { p0:{x:1180,y:790}, c1:{x:1060,y:700}, c2:{x:880,y:742}, p1:{x:700,y:676} };

/* ---------- roundRect 兼容 ---------- */
function roundRectPath(x, y, w, h, r){
  if(typeof ctx.roundRect === 'function'){ ctx.roundRect(x, y, w, h, r); return; }
  var rr = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
}

/* ---------- 场景（seed 决定，同一 seed 永远同一张画） ---------- */
function buildScene(seed){
  var rnd = mulberry32(seed * 2654435761 >>> 0);
  var s = {
    seed: seed,
    ridge: [],
    rain: [],
    rainFar: [],
    cloud: [],
    ripples: [],
    specks: [],
    stars: [],
    grass: [],
    trees: [],
    candle: { flicker: 0.4 + rnd() * 0.6, drift: rnd() * 6.283 }
  };
  var i, k;
  /* 三重山脊各自峰点的抖动，让换 seed 真的换一幅山 */
  for(i = 0; i < RIDGES.length; i++){
    var pts = [];
    for(k = 0; k <= 10; k++){
      pts.push({ x: (k / 10) * W, d: (rnd() * 2 - 1) * 42, d2: (rnd() * 2 - 1) * 26 });
    }
    s.ridge.push(pts);
  }
  /* 雨：近景一束、远景一层 */
  for(i = 0; i < 118; i++){
    s.rain.push({
      x: rnd() * (W + 260) - 130, y: rnd() * (H + 160) - 80,
      len: 16 + rnd() * 34, sp: 0.9 + rnd() * 1.9,
      slant: 0.10 + rnd() * 0.16, w: 1 + rnd() * 1.6, a: 0.45 + rnd() * 0.55
    });
  }
  for(i = 0; i < 90; i++){
    s.rainFar.push({
      x: rnd() * (W + 200) - 100, y: rnd() * (H + 120) - 60,
      len: 8 + rnd() * 16, sp: 0.5 + rnd() * 1.1,
      slant: 0.08 + rnd() * 0.1, w: 0.7 + rnd() * 0.9, a: 0.2 + rnd() * 0.4
    });
  }
  /* 阴云 */
  for(i = 0; i < 7; i++){
    s.cloud.push({
      x: rnd() * (W + 200) - 100, y: 60 + rnd() * 220,
      sc: 0.8 + rnd() * 1.3, sp: 0.5 + rnd() * 1.2,
      a: 0.45 + rnd() * 0.4, ph: rnd() * 6.283
    });
  }
  /* 秋池涟漪 */
  for(i = 0; i < 26; i++){
    s.ripples.push({
      x: POND.x + (rnd() * 2 - 1) * POND.rx * 0.78,
      y: POND.y + (rnd() * 2 - 1) * POND.ry * 0.68,
      r: 6 + rnd() * 26, sp: 0.5 + rnd() * 1.4, ph: rnd() * 6.283
    });
  }
  /* 水面反光散点 */
  for(i = 0; i < 34; i++){
    s.specks.push({
      x: POND.x + (rnd() * 2 - 1) * POND.rx * 0.86,
      y: POND.y + (rnd() * 2 - 1) * POND.ry * 0.72,
      w: 6 + rnd() * 30, ph: rnd() * 6.283
    });
  }
  /* 星 */
  for(i = 0; i < 170; i++){
    s.stars.push({ x: rnd() * W, y: rnd() * 330, r: 0.6 + rnd() * 1.5, ph: rnd() * 6.283 });
  }
  /* 近景草叶（不长在池里） */
  for(i = 0; i < 120; i++){
    var gy = 560 + rnd() * (H - 560);
    var gx = rnd() * W;
    var inPond = Math.pow((gx - POND.x) / (POND.rx * 1.05), 2) +
                 Math.pow((gy - POND.y) / (POND.ry * 1.12), 2) < 1;
    if(inPond) continue;
    s.grass.push({
      x: gx, y: gy, h: 12 + rnd() * 34,
      lean: (rnd() * 2 - 1) * 0.6, w: 1.4 + rnd() * 1.6, a: 0.5 + rnd() * 0.5
    });
  }
  /* 山脊上的针叶树 */
  for(i = 0; i < 46; i++){
    s.trees.push({ x: rnd() * W, w: 8 + rnd() * 16, h: 14 + rnd() * 30 });
  }
  return s;
}
var scene = buildScene(state.seed);

/* ---------- 小工具 ---------- */
function pathCurve(t){
  var u = 1 - t, p = PATH_CURVE;
  return {
    x: u*u*u*p.p0.x + 3*u*u*t*p.c1.x + 3*u*t*t*p.c2.x + t*t*t*p.p1.x,
    y: u*u*u*p.p0.y + 3*u*u*t*p.c1.y + 3*u*t*t*p.c2.y + t*t*t*p.p1.y
  };
}
function ridgePoints(ri){
  var base = RIDGES[ri].base, amp = RIDGES[ri].amp;
  var pts = scene.ridge[ri], out = [];
  for(var i = 0; i < pts.length; i++){
    var p = pts[i];
    var y = base
      - Math.sin(p.x * RIDGES[ri].freq + RIDGES[ri].phase) * amp
      - Math.sin(p.x * RIDGES[ri].freq * 2.7 + RIDGES[ri].phase * 1.6) * amp * 0.35
      + p.d * 0.5 + p.d2;
    out.push({ x: p.x, y: y });
  }
  return out;
}
/* 用 Catmull-Rom 插值，读出山脊在某 x 处的高度 */
function ridgeAt(ri, x){
  var pts = ridgePoints(ri);
  var f = clamp(x / W, 0, 1) * (pts.length - 1);
  var i = clamp(Math.floor(f), 0, pts.length - 2);
  var k = f - i;
  var a = pts[i], b = pts[i + 1];
  var pa = pts[clamp(i - 1, 0, pts.length - 1)];
  var pb = pts[clamp(i + 2, 0, pts.length - 1)];
  var t2 = k * k, t3 = t2 * k;
  return 0.5 * ((2 * a.y) + (-pa.y + b.y) * k +
         (2 * pa.y - 5 * a.y + 4 * b.y - pb.y) * t2 +
         (-pa.y + 3 * a.y - 3 * b.y + pb.y) * t3);
}

/* ---------- 天空与天象 ---------- */
function drawSky(P){
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.skyTop);
  g.addColorStop(0.55, P.skyMid);
  g.addColorStop(1, P.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(P, t){
  if(!P.stars) return;
  ctx.save();
  ctx.fillStyle = '#f4f7ff';
  for(var i = 0; i < scene.stars.length && i < P.stars; i++){
    var st = scene.stars[i];
    ctx.globalAlpha = (0.32 + 0.6 * Math.abs(Math.sin(t * 0.8 + st.ph))) * 0.9;
    ctx.beginPath();
    ctx.arc(st.x, st.y, st.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawSun(P){
  var x = P.sunX, y = P.sunY, r = P.sunR;
  if(P.moon){
    /* 弯月：圆盘 + 用天空渐变色挖出月牙 */
    ctx.save();
    ctx.fillStyle = P.sun;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    var sg = ctx.createLinearGradient(0, 0, 0, H);
    sg.addColorStop(0, P.skyTop);
    sg.addColorStop(0.55, P.skyMid);
    sg.addColorStop(1, P.skyBot);
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(x - r * 0.56, y - r * 0.28, r * 1.02, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var mg = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 4.8);
    mg.addColorStop(0, P.sunGlow);
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(x, y, r * 4.8, 0, 6.2832); ctx.fill();
    ctx.restore();
    return;
  }
  var g = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 5.4);
  g.addColorStop(0, P.sunGlow);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 5.4, 0, 6.2832); ctx.fill();
  ctx.fillStyle = P.sun;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

function puff(x, y, sc, fill){
  var parts = [[0,0,34],[30,-10,26],[-30,4,24],[58,6,18],[-56,10,16]];
  ctx.fillStyle = fill;
  ctx.beginPath();
  for(var i = 0; i < parts.length; i++){
    ctx.moveTo(x + parts[i][0] * sc + parts[i][2] * sc, y + parts[i][1] * sc);
    ctx.arc(x + parts[i][0] * sc, y + parts[i][1] * sc, parts[i][2] * sc, 0, 6.2832);
  }
  ctx.fill();
}

function drawClouds(P, t){
  ctx.save();
  for(var i = 0; i < scene.cloud.length; i++){
    var c = scene.cloud[i];
    var x = ((c.x + t * 6 * c.sp) % (W + 360)) - 180;
    var y = c.y + Math.sin(t * 0.8 + c.ph) * 6;
    ctx.globalAlpha = c.a;
    puff(x, y, c.sc, i % 2 ? P.cloud : P.cloudEdge);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* 雨：近/远两层，随 t 下落 */
function drawRainLayer(P, t, far){
  var list = far ? scene.rainFar : scene.rain;
  var col = far ? P.rainFar : P.rain;
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineCap = 'round';
  for(var i = 0; i < list.length; i++){
    var r = list[i];
    var y = ((r.y + t * r.sp * 260) % (H + 160)) - 80;
    var x = r.x + y * r.slant;
    ctx.globalAlpha = r.a;
    ctx.lineWidth = r.w;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - r.len * r.slant * 0.9, y + r.len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- 重重巴山 ---------- */
function drawRidge(ri, P, fill, lineColor){
  ctx.save();
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, ridgeAt(ri, 0));
  for(var x = 4; x <= W; x += 4) ctx.lineTo(x, ridgeAt(ri, x));
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
  if(lineColor){
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(0, ridgeAt(ri, 0) + 2);
    for(var x2 = 8; x2 <= W; x2 += 8) ctx.lineTo(x2, ridgeAt(ri, x2) + 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawMountains(P){
  for(var ri = 0; ri < RIDGES.length; ri++){
    var fill = ri === 0 ? P.farHill : (ri === 1 ? P.midHill : P.nearHill);
    drawRidge(ri, P, fill, P.hillMist);
    /* 山脚一道贴地的雾，读出层次 */
    if(ri < 2){
      ctx.save();
      var hy = RIDGES[ri].base + 30;
      var mg = ctx.createLinearGradient(0, hy - 40, 0, hy + 90);
      mg.addColorStop(0, 'rgba(0,0,0,0)');
      mg.addColorStop(0.5, P.hillMist);
      mg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = mg;
      ctx.fillRect(0, hy - 40, W, 130);
      ctx.restore();
    }
  }
  /* 山脊上的针叶树，让"巴山"有林 */
  ctx.save();
  ctx.fillStyle = P.treeLine;
  for(var i = 0; i < scene.trees.length; i++){
    var d = scene.trees[i];
    var y = ridgeAt(1, d.x) + 8;
    ctx.beginPath();
    ctx.moveTo(d.x - d.w / 2, y);
    ctx.lineTo(d.x, y - d.h);
    ctx.lineTo(d.x + d.w / 2, y);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawGround(P){
  var g = ctx.createLinearGradient(0, 520, 0, H);
  g.addColorStop(0, P.ground);
  g.addColorStop(1, P.nearHill);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, 540);
  for(var x = 0; x <= W; x += 10){
    ctx.lineTo(x, 540 + Math.sin(x * 0.0068 + 1.1) * 12 + Math.sin(x * 0.019) * 5);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
}

function drawPath(P){
  ctx.save();
  /* 土路 */
  ctx.strokeStyle = P.path;
  ctx.lineWidth = 26;
  ctx.lineCap = 'butt';
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(PATH_CURVE.p0.x, PATH_CURVE.p0.y);
  ctx.bezierCurveTo(PATH_CURVE.c1.x, PATH_CURVE.c1.y,
                    PATH_CURVE.c2.x, PATH_CURVE.c2.y,
                    PATH_CURVE.p1.x, PATH_CURVE.p1.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  /* 石阶横纹 */
  ctx.strokeStyle = P.rock;
  ctx.lineWidth = 2;
  for(var i = 1; i < 16; i++){
    var p = pathCurve(i / 16);
    var q = pathCurve((i + 0.04) / 16);
    var ang = Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2;
    var half = 13;
    ctx.beginPath();
    ctx.moveTo(p.x - Math.cos(ang) * half, p.y - Math.sin(ang) * half);
    ctx.lineTo(p.x + Math.cos(ang) * half, p.y + Math.sin(ang) * half);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGrass(P, t){
  ctx.save();
  ctx.lineCap = 'round';
  for(var i = 0; i < scene.grass.length; i++){
    var g = scene.grass[i];
    var sway = Math.sin(t * 1.3 + g.x * 0.02) * 0.06;
    ctx.strokeStyle = i % 3 === 0 ? P.rock : P.grass;
    ctx.globalAlpha = g.a;
    ctx.lineWidth = g.w;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    ctx.quadraticCurveTo(g.x + (g.lean + sway) * 10, g.y - g.h * 0.6,
                         g.x + (g.lean + sway) * 22, g.y - g.h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- 秋池 ---------- */
function drawPond(P, t){
  ctx.save();
  /* 池岸湿土 */
  ctx.fillStyle = P.ground;
  ctx.beginPath();
  ctx.ellipse(POND.x, POND.y + 6, POND.rx + 26, POND.ry + 18, 0, 0, 6.2832);
  ctx.fill();
  /* 水面：自上而下由浅池色到深水 */
  var g = ctx.createLinearGradient(0, POND.y - POND.ry, 0, POND.y + POND.ry);
  g.addColorStop(0, P.pond);
  g.addColorStop(0.62, P.pond);
  g.addColorStop(1, P.pondDeep);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(POND.x, POND.y, POND.rx, POND.ry, 0, 0, 6.2832);
  ctx.fill();
  /* 水面倒映天光 */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = P.pondShine;
  ctx.beginPath();
  ctx.ellipse(POND.x - 20, POND.y - 14, POND.rx * 0.72, POND.ry * 0.42, -0.04, 0, 6.2832);
  ctx.fill();
  ctx.restore();
  /* 远处山与窗的倒影各一道 */
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = P.reflection;
  ctx.beginPath();
  ctx.ellipse(POND.x + 40, POND.y + 12, POND.rx * 0.34, POND.ry * 0.3, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
  /* 涟漪：一圈圈扩散 */
  ctx.save();
  ctx.strokeStyle = P.ripple;
  for(var i = 0; i < scene.ripples.length; i++){
    var rp = scene.ripples[i];
    var k = (t * rp.sp * 0.35 + rp.ph) % 1;
    var s = 0.35 + k * 1.1;
    ctx.globalAlpha = (1 - k) * 0.55;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, rp.r * s, rp.r * s * 0.34, 0, 0, 6.2832);
    ctx.stroke();
  }
  ctx.restore();
  /* 水面细碎亮线 */
  ctx.save();
  ctx.strokeStyle = P.pondShine;
  ctx.globalAlpha = 0.4;
  for(var j = 0; j < scene.specks.length; j++){
    var sp = scene.specks[j];
    var bob = Math.sin(t * 0.5 + sp.ph) * 2;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(sp.x - sp.w / 2, sp.y + bob);
    ctx.lineTo(sp.x + sp.w / 2, sp.y + bob);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.restore();
}

/* ---------- 西窗与烛 ---------- */
function drawWindow(P, t){
  var wx = WINDOW.x, wy = WINDOW.y, ww = WINDOW.w, wh = WINDOW.h;
  ctx.save();
  /* 窗洞：深色内饰 + 烛光扩散 */
  ctx.fillStyle = P.window;
  ctx.beginPath();
  roundRectPath(wx, wy, ww, wh, 6);
  ctx.fill();
  var cg = ctx.createRadialGradient(CANDLE.x, CANDLE.y - 34, 8, CANDLE.x, CANDLE.y - 34, ww * 1.15);
  cg.addColorStop(0, P.windowGlow);
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  roundRectPath(wx, wy, ww, wh, 6);
  ctx.fill();
  /* 窗棂 */
  ctx.strokeStyle = P.rock;
  ctx.lineWidth = 7;
  ctx.globalAlpha = 0.85;
  for(var i = 1; i < WINDOW.panes; i++){
    var vx = wx + (ww / WINDOW.panes) * i;
    ctx.beginPath(); ctx.moveTo(vx, wy); ctx.lineTo(vx, wy + wh); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  ctx.globalAlpha = 1;
  /* 窗框与窗台 */
  ctx.strokeStyle = P.candleBase;
  ctx.lineWidth = 11;
  ctx.beginPath(); roundRectPath(wx, wy, ww, wh, 8); ctx.stroke();
  ctx.fillStyle = P.candleBase;
  ctx.beginPath(); roundRectPath(wx - 12, wy + wh + 2, ww + 24, 14, 4); ctx.fill();

  /* 烛身 */
  var flick = scene.candle.flicker;
  var sway = Math.sin(t * 2.4 + scene.candle.drift) * 0.6 + Math.sin(t * 5.1) * 0.25;
  var cx = CANDLE.x + sway;
  var cy = CANDLE.y;
  ctx.fillStyle = P.candle;
  ctx.beginPath();
  roundRectPath(cx - CANDLE.w / 2, cy - CANDLE.h, CANDLE.w, CANDLE.h, 5);
  ctx.fill();
  /* 烛芯 */
  ctx.strokeStyle = 'rgba(60,40,30,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - CANDLE.h);
  ctx.lineTo(cx + 2, cy - CANDLE.h - 8);
  ctx.stroke();
  /* 烛焰：光晕 + 外焰 + 内焰 */
  var fh = 26 + Math.sin(t * 3.6 + scene.candle.drift) * 4 * flick;
  var fx = cx + Math.sin(t * 4.2) * 1.2;
  var fy = cy - CANDLE.h - 8;
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.3 * Math.abs(Math.sin(t * 2.2 + flick));
  ctx.fillStyle = P.glow;
  ctx.beginPath(); ctx.ellipse(fx, fy - fh * 0.35, 56, 72, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
  var fg = ctx.createLinearGradient(fx, fy - fh, fx, fy + 6);
  fg.addColorStop(0, P.flameCore);
  fg.addColorStop(0.42, P.flame);
  fg.addColorStop(1, 'rgba(255,120,40,0.25)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(fx, fy - fh);
  ctx.quadraticCurveTo(fx + 9, fy - fh * 0.5, fx + 6, fy - 2);
  ctx.quadraticCurveTo(fx, fy + 5, fx - 6, fy - 2);
  ctx.quadraticCurveTo(fx - 9, fy - fh * 0.5, fx, fy - fh);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = P.flameCore;
  ctx.beginPath();
  ctx.ellipse(fx, fy - fh * 0.42, 3.4, fh * 0.28, 0, 0, 6.2832);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- 收尾：暗角与题款 ---------- */
function drawFinish(P){
  var g = ctx.createRadialGradient(W * 0.5, H * 0.46, H * 0.4, W * 0.5, H * 0.48, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, P.vignette);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if(state.sig){
    /* 左下竖排题款，像古画上的诗；先描一层暗影，保证浅色画面里也读得清 */
    ctx.save();
    ctx.font = '26px "Songti SC","STSong","SimSun",Georgia,serif';
    ctx.textAlign = 'left';
    var lines = ['君问归期未有期', '巴山夜雨涨秋池', '何当共剪西窗烛', '却话巴山夜雨时'];
    var i;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(10,14,22,0.75)';
    for(i = 0; i < lines.length; i++){
      ctx.fillText(lines[i], 36, H - 58 - (lines.length - 1 - i) * 34 + 1.5);
    }
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = P.ink;
    for(i = 0; i < lines.length; i++){
      ctx.fillText(lines[i], 34, H - 58 - (lines.length - 1 - i) * 34);
    }
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(10,14,22,0.75)';
    ctx.font = 'italic 17px Georgia,"Songti SC",serif';
    ctx.fillText('巴山夜雨 · 唐 · 李商隐', 36, H - 13);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = P.ink;
    ctx.fillText('巴山夜雨 · 唐 · 李商隐', 34, H - 14);
    ctx.restore();
  }
}

/* ---------- 主渲染 ---------- */
var lastScale = 1;
function render(t){
  var P = PRESETS[state.preset];
  if(!P){ state.preset = 'night'; P = PRESETS.night; }
  ctx.save();
  ctx.setTransform(lastScale, 0, 0, lastScale, 0, 0);
  ctx.clearRect(0, 0, W, H);

  drawSky(P);
  drawStars(P, t);
  drawSun(P);
  drawClouds(P, t);
  drawRainLayer(P, t, true);      /* 远雨在山之前 */
  drawMountains(P);
  drawGround(P);
  drawRainLayer(P, t, false);     /* 近雨在山地之后 */
  drawPond(P, t);
  drawPath(P);
  drawGrass(P, t);
  drawWindow(P, t);
  drawFinish(P);

  ctx.restore();
}

/* ---------- DPR ---------- */
var scale = 1;
function setupCanvas(){
  var dpr = clamp(window.devicePixelRatio || 1, 1, 2);
  scale = dpr;
  lastScale = dpr;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.imageSmoothingEnabled = true;
  render(state.t);
}

/* ---------- 动画 ---------- */
var last = 0, rafId = 0;
function loop(ts){
  rafId = 0;
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
  last = ts;
  if(state.motion && !state.freeze) state.t += dt;
  render(state.t);
  paintMeta();
  if(state.motion && !state.freeze) rafId = requestAnimationFrame(loop);
}
function start(){
  last = 0;
  if(rafId) return;
  if(state.motion && !state.freeze) rafId = requestAnimationFrame(loop);
  else { render(state.t); paintMeta(); }
}

/* ---------- UI ---------- */
var meta = document.getElementById('meta');
var seedInput = document.getElementById('seed');
var redrawBtn = document.getElementById('redraw');
var motionBtn = document.getElementById('motion');
var themeBtn = document.getElementById('theme');
var saveBtn = document.getElementById('save');

function paintMeta(){
  meta.textContent = '时段 ' + state.preset + ' · seed ' + scene.seed +
    ' · 画面 ' + W + '×' + H + ' · t ' + state.t.toFixed(2) + 's';
}
function setPreset(name){
  if(!PRESETS[name]) return;
  state.preset = name;
  var kids = document.querySelectorAll('#presets button');
  for(var i = 0; i < kids.length; i++){
    kids[i].setAttribute('aria-pressed', kids[i].dataset.preset === name ? 'true' : 'false');
  }
  render(state.t); paintMeta();
}
function setSeed(v){
  state.seed = Math.round(clamp(v, 1, 99999));
  scene = buildScene(state.seed);
  seedInput.value = state.seed;
  render(state.t); paintMeta();
}

document.getElementById('presets').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(b && b.dataset.preset) setPreset(b.dataset.preset);
});
redrawBtn.addEventListener('click', function(){
  setSeed(1 + Math.floor(Math.random() * 99999));
});
seedInput.addEventListener('change', function(){
  setSeed(parseFloat(seedInput.value) || 1);
});
motionBtn.addEventListener('click', function(){
  state.motion = !state.motion;
  motionBtn.setAttribute('aria-pressed', state.motion ? 'true' : 'false');
  motionBtn.textContent = state.motion ? '🌧 动起来' : '🧊 静止';
  start();
});
themeBtn.addEventListener('click', function(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  themeBtn.textContent = state.theme === 'dark' ? '🌗 浅色' : '🌗 深色';
});
saveBtn.addEventListener('click', savePNG);

function savePNG(){
  var url = api.toDataURL();
  var a = document.createElement('a');
  a.href = url;
  a.download = 'poem-drawing-' + state.preset + '-' + scene.seed + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  return url;
}

window.addEventListener('keydown', function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var k = e.key;
  var map = { '1':'dusk', '2':'night', '3':'dawn', '4':'noon' };
  if(map[k]){ setPreset(map[k]); return; }
  if(k === 'r' || k === 'R'){ setSeed(1 + Math.floor(Math.random() * 99999)); return; }
  if(k === 'm' || k === 'M'){ motionBtn.click(); return; }
  if(k === 't' || k === 'T'){ themeBtn.click(); return; }
  if(k === 's' || k === 'S'){ savePNG(); return; }
});

/* ---------- 对外 API ---------- */
var api = {
  state: function(){
    return { preset: state.preset, seed: scene.seed, t: state.t, motion: state.motion,
             theme: state.theme, ui: params.get('ui') === 'off' };
  },
  go: function(t){ state.freeze = true; state.motion = false; state.t = t; render(state.t); paintMeta(); return api.state(); },
  ff: function(sec){ return api.go(state.t + sec); },
  setPreset: setPreset,
  setSeed: setSeed,
  toDataURL: function(){ return canvas.toDataURL('image/png'); },
  size: function(){ return { w: canvas.width, h: canvas.height, lw: W, lh: H, scale: scale }; },
  ridgeAt: ridgeAt,
  palette: function(){ return PRESETS[state.preset]; },
  palettes: PRESETS,
  keys: PALETTE_KEYS,
  selftest: null
};
window.drawing = api;

/* ---------- 自检 ---------- */
function pix(x, y, w, h){
  return ctx.getImageData(Math.round(x * scale), Math.round(y * scale),
                          Math.round(w * scale), Math.round(h * scale)).data;
}
function rgbAt(x, y){
  var d = pix(x, y, 1, 1);
  return [d[0], d[1], d[2]];
}
function hash(x, y, w, h){
  var d = pix(x, y, w, h), s = 0;
  for(var i = 0; i < d.length; i += 4){
    s = (s * 31 + d[i] * 7 + d[i + 1] * 3 + d[i + 2]) % 2147483647;
  }
  return s;
}
function runSelftest(){
  var out = [];
  function chk(name, ok, info){ out.push({ name: name, ok: !!ok, info: info || '' }); }

  chk('画布存在且已按 DPR 放大', canvas.width >= W && canvas.height >= H,
      canvas.width + 'x' + canvas.height);

  chk('四个时段齐备', PRESET_ORDER.length === 4 &&
      PRESET_ORDER.every(function(k){ return PRESETS[k]; }), PRESET_ORDER.join(','));

  var keysOk = true, badKeys = [];
  for(var pi = 0; pi < PRESET_ORDER.length; pi++){
    var P = PRESETS[PRESET_ORDER[pi]];
    for(var ki = 0; ki < PALETTE_KEYS.length; ki++){
      if(P[PALETTE_KEYS[ki]] === undefined){ keysOk = false; badKeys.push(PRESET_ORDER[pi] + '.' + PALETTE_KEYS[ki]); }
    }
    for(var k2 in P){
      if(PALETTE_KEYS.indexOf(k2) < 0){ keysOk = false; badKeys.push(PRESET_ORDER[pi] + '+' + k2); }
    }
  }
  chk('每个时色调色板键完全一致（' + PALETTE_KEYS.length + ' 键 × 4）', keysOk, badKeys.slice(0, 6).join(' '));

  function allStrings(pos){
    var P2 = PRESETS[PRESET_ORDER[pos]], bad = [];
    for(var i2 = 0; i2 < PALETTE_KEYS.length; i2++){
      var key = PALETTE_KEYS[i2], val = P2[key];
      if(typeof val === 'number') continue;               /* sunX/sunY/sunR/stars/moon 是数字 */
      if(typeof val !== 'string') bad.push(key);
      else if(!/^(#|rgba?\(|hsla?\()/.test(val)) bad.push(key + '=' + val);
    }
    return bad;
  }
  var strBad = [];
  for(var si = 0; si < PRESET_ORDER.length; si++) strBad = strBad.concat(allStrings(si));
  chk('所有颜色都是规范字符串（不再有无引号的十六进制）', strBad.length === 0, strBad.slice(0, 6).join(' '));

  var prevPreset = state.preset, errors = [];
  for(var oi = 0; oi < PRESET_ORDER.length; oi++){
    try { api.setPreset(PRESET_ORDER[oi]); api.go(3.4); }
    catch(err){ errors.push(PRESET_ORDER[oi] + ':' + err.message); }
  }
  api.setPreset(prevPreset);
  api.go(4.2);
  chk('四个时段都能画完，无异常', errors.length === 0, errors.join(' '));

  /* 天空是渐变 */
  var top = rgbAt(60, 30), midc = rgbAt(60, 300), bot = rgbAt(60, 620);
  var d1 = Math.abs(top[0]-midc[0]) + Math.abs(top[1]-midc[1]) + Math.abs(top[2]-midc[2]);
  var d2 = Math.abs(midc[0]-bot[0]) + Math.abs(midc[1]-bot[1]) + Math.abs(midc[2]-bot[2]);
  chk('天空是渐变（上/中/下三段颜色不同）', d1 > 20 || d2 > 20, d1 + '/' + d2);

  /* 整幅画确实有内容：抽样统计颜色种类 */
  var dAll = pix(0, 0, W, H), buckets = {};
  for(var bi = 0; bi < dAll.length; bi += 4 * 397){
    buckets[(dAll[bi] >> 4) + ',' + (dAll[bi+1] >> 4) + ',' + (dAll[bi+2] >> 4)] = 1;
  }
  chk('画面内容非空白（整幅着色种类 ≥ 8）', Object.keys(buckets).length >= 8,
      Object.keys(buckets).length + ' 种');

  /* 秋池水面与天空颜色明显不同 */
  var pondc = rgbAt(POND.x, POND.y);
  chk('秋池水面被绘制（池心颜色非天空色）',
      Math.abs(pondc[0]-midc[0]) + Math.abs(pondc[1]-midc[1]) + Math.abs(pondc[2]-midc[2]) > 18,
      pondc.join(','));

  /* 西窗里有烛光的暖色像素 */
  var winPix = pix(WINDOW.x + 6, WINDOW.y + 6, WINDOW.w - 12, WINDOW.h - 12);
  var warm = 0;
  for(var wi = 0; wi < winPix.length; wi += 4){
    if(winPix[wi] > 120 && winPix[wi] > winPix[wi+2]) warm++;
  }
  chk('西窗里有亮起的烛光', warm > 0, warm + ' px');

  /* 山脊高度确实有起伏 */
  var hs = [];
  for(var hx = 0; hx <= W; hx += 120) hs.push(ridgeAt(2, hx));
  var hmin = Math.min.apply(null, hs), hmax = Math.max.apply(null, hs);
  chk('巴山山脊有起伏', hmax - hmin > 20, Math.round(hmin) + '~' + Math.round(hmax));

  /* 确定性 */
  api.go(4.2);
  var h1 = hash(200, 400, 300, 260);
  api.go(4.2);
  var h2 = hash(200, 400, 300, 260);
  chk('同一 seed 同一时刻重绘一致', h1 === h2, h1 + '/' + h2);

  /* 换 seed 构图改变 */
  var prevSeed = scene.seed;
  api.setSeed(4242);
  api.go(4.2);
  var h3 = hash(100, 380, 420, 240);
  api.setSeed(prevSeed);
  api.go(4.2);
  var h4 = hash(100, 380, 420, 240);
  chk('换 seed 会改变构图', h3 !== h4, h3 + '/' + h4);

  /* 雨随时间下落 → 同 seed 不同时刻雨区不同 */
  api.go(1.2);
  var r1 = hash(250, 100, 260, 220);
  api.go(3.2);
  var r2 = hash(250, 100, 260, 220);
  chk('夜雨在动（两个时刻雨区不同）', r1 !== r2, r1 + '/' + r2);

  /* 导出 PNG */
  var url = api.toDataURL();
  chk('可导出 PNG（data:image/png，体积充足）',
      url.slice(0, 15) === 'data:image/png;' && url.length > 20000, url.length);

  /* 文案与控件 */
  chk('标题双语齐备', /巴山夜雨/.test(document.title) && /Picture of a Poem/.test(document.title));
  chk('四个时段按钮 + 重画 / 保存 / 深浅色 / 动停齐备',
      document.querySelectorAll('#presets button').length === 4 &&
      !!redrawBtn && !!saveBtn && !!themeBtn && !!motionBtn);
  chk('界面文本无 undefined / NaN', !/undefined|NaN/.test(document.body.innerText));

  /* 窄屏无横向溢出 */
  chk('无横向溢出（scrollWidth ≤ 视口+2）',
      document.documentElement.scrollWidth <= window.innerWidth + 2,
      document.documentElement.scrollWidth + '/' + window.innerWidth);

  api.selftest = out;
  return out;
}
function paintSelftest(){
  var res = runSelftest();
  var box = document.getElementById('selftest');
  var list = document.getElementById('stlist');
  var pass = 0, html = '';
  for(var i = 0; i < res.length; i++){
    if(res[i].ok) pass++;
    html += '<div class="' + (res[i].ok ? 'ok' : 'bad') + '">' +
      (res[i].ok ? '✔ ' : '✘ ') + (i + 1) + '. ' + res[i].name +
      (res[i].info ? ' <span style="opacity:.55">[' + res[i].info + ']</span>' : '') + '</div>';
  }
  list.innerHTML = '<div>' + (pass === res.length ? 'ALL PASS' : 'FAILED') +
    ' — ' + pass + '/' + res.length + ' 项通过</div>' + html;
  box.hidden = false;
  document.title = '[selftest ' + pass + '/' + res.length + '] ' + document.title;
  return res;
}

/* ---------- 启动 ---------- */
if(params.get('ui') === 'off') document.body.dataset.ui = 'off';
document.documentElement.dataset.theme = state.theme;
if(state.theme === 'dark') themeBtn.textContent = '🌗 浅色';
seedInput.value = state.seed;
motionBtn.setAttribute('aria-pressed', state.motion ? 'true' : 'false');
setupCanvas();
window.addEventListener('resize', setupCanvas);
if(params.get('freeze') === '1'){
  api.go(num('t', 4.2));
} else if(params.get('ff')){
  api.go(num('t', 4.2) + num('ff', 0));
} else {
  state.t = num('t', 0);
  start();
}
if(params.get('selftest') === '1') paintSelftest();
paintMeta();

})();
</script>
