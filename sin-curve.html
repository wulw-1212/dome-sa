<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sin(x) 曲线 · 互动绘图仪</title>
<style>
  :root {
    --bg: #f5f7fb;
    --bg2: #ffffff;
    --ink: #16233d;
    --ink-soft: #5a6b88;
    --line: #d7dfeb;
    --grid: #c3cfe4;
    --grid-soft: #e2e9f4;
    --axis: #7d8ca8;
    --curve: #2f6bff;
    --curve-glow: rgba(47, 107, 255, .18);
    --ghost: #a4b0c6;
    --accent: #ff7a1a;
    --probe: #e02b5b;
    --circle: #12b3a6;
    --shadow: 0 10px 30px rgba(22, 35, 61, .10);
  }
  html[data-theme="dark"] {
    --bg: #070b16;
    --bg2: #0e1526;
    --ink: #e8f0ff;
    --ink-soft: #93a4c4;
    --line: #22304c;
    --grid: #24334f;
    --grid-soft: #182337;
    --axis: #64769a;
    --curve: #56d1ff;
    --curve-glow: rgba(86, 209, 255, .22);
    --ghost: #46587a;
    --accent: #ffb04a;
    --probe: #ff6b8e;
    --circle: #6ee7b7;
    --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(900px 620px at 12% -10%, var(--curve-glow), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* ---------------- header ---------------- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px 18px;
    padding: 18px 22px 12px;
  }
  h1 { font-size: clamp(20px, 2.6vw, 28px); letter-spacing: .02em; }
  h1 .fn { color: var(--curve); font-family: "Cambria Math", Georgia, serif; }
  .sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }
  .toolbar { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 7px 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  button:hover { border-color: var(--curve); color: var(--curve); }
  button.primary { background: var(--curve); border-color: var(--curve); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  kbd {
    font: 11px/1.4 ui-monospace, Consolas, monospace;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 4px;
    background: var(--bg2);
  }

  /* ---------------- layout ---------------- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 312px;
    gap: 16px;
    padding: 4px 22px 18px;
    align-items: start;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  #plotCard { padding: 10px 10px 0; display: flex; flex-direction: column; min-width: 0; }
  #plotWrap { position: relative; width: 100%; height: clamp(300px, 62vh, 620px); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
  #plot { cursor: crosshair; }

  .formula {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 2px 4px 10px;
    font-family: "Cambria Math", Georgia, serif;
    font-size: 17px;
  }
  .formula .eq { color: var(--ink); }
  .formula .hint { font-family: inherit; font-size: 12px; color: var(--ink-soft); }
  .formula b { color: var(--curve); font-weight: 600; }

  .readout {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 6px 14px;
    padding: 10px 4px 12px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
  }
  .readout div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .readout span { color: var(--ink-soft); }
  .readout output {
    font: 13px/1.4 ui-monospace, Consolas, monospace;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .readout output.hot { color: var(--probe); }

  aside { display: flex; flex-direction: column; gap: 14px; }
  aside .card { padding: 12px 14px 14px; }
  aside h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  #circleBox { width: 100%; height: 236px; }

  .ctrl { margin-bottom: 12px; }
  .ctrl:last-child { margin-bottom: 0; }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 5px;
  }
  .ctrl label small { color: var(--ink-soft); font-size: 11px; }
  .ctrl output { font: 12px/1 ui-monospace, Consolas, monospace; color: var(--curve); }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 20px;
    background: transparent;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: var(--grid);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; margin-top: -5.5px;
    border-radius: 50%; background: var(--curve); border: 2px solid var(--bg2);
    box-shadow: 0 0 0 1px var(--curve);
  }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--grid); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--curve); border: 2px solid var(--bg2);
  }
  .checks { display: grid; gap: 8px; }
  .checks label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; cursor: pointer;
  }
  .checks input { accent-color: var(--curve); width: 15px; height: 15px; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .preset-row button { box-shadow: none; padding: 5px 9px; font-size: 12px; }

  footer {
    padding: 0 22px 18px;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }

  #selftest { margin: 0 22px 20px; padding: 12px 14px; font-size: 12px; }
  #selftest h2 { font-size: 13px; margin-bottom: 8px; }
  #selftest ul { list-style: none; display: grid; gap: 4px; }
  #selftest li.ok { color: var(--circle); }
  #selftest li.bad { color: var(--probe); }

  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    aside { flex-direction: column; }
    #plotWrap { height: clamp(260px, 46vh, 420px); }
    .toolbar { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="fn">sin(x)</span> 曲线 · 互动绘图仪</h1>
    <div class="sub">单文件、零依赖、可离线打开。拖动滑块改形状，鼠标在图上取点，扫描点与单位圆同步。</div>
  </div>
  <div class="toolbar">
    <button id="playBtn" class="primary" type="button" title="空格">▶ 扫描</button>
    <button id="resetBtn" type="button" title="R">↺ 复位</button>
    <button id="themeBtn" type="button" title="T">🌙 深色</button>
  </div>
</header>

<main>
  <section class="card" id="plotCard">
    <div class="formula">
      <span class="eq" id="formulaText">y = sin(x)</span>
      <span class="hint">周期 <b id="periodText">2π</b> · 值域 <b id="rangeText">[−1, 1]</b></span>
    </div>
    <div id="plotWrap"><canvas id="plot"></canvas></div>
    <div class="readout">
      <div><span>x（弧度）</span><output id="outX">0.0000</output></div>
      <div><span>x（π 的倍数）</span><output id="outXpi">0</output></div>
      <div><span>sin(x)</span><output id="outY" class="hot">0.0000</output></div>
      <div><span>角度 θ</span><output id="outTheta">0.00°</output></div>
      <div><span>相位速度</span><output id="outSpeed">1.00 ×</output></div>
    </div>
  </section>

  <aside>
    <section class="card">
      <h2>单位圆</h2>
      <div id="circleBox"><canvas id="circle"></canvas></div>
    </section>

    <section class="card">
      <h2>曲线参数</h2>
      <div class="ctrl">
        <label for="amp">振幅 A <small>0.2 – 2.4</small><output id="ampOut">1.00</output></label>
        <input id="amp" type="range" min="0.2" max="2.4" step="0.05" value="1" />
      </div>
      <div class="ctrl">
        <label for="freq">频率 B <small>0.25 – 4</small><output id="freqOut">1.00</output></label>
        <input id="freq" type="range" min="0.25" max="4" step="0.05" value="1" />
      </div>
      <div class="ctrl">
        <label for="phase">相位 C <small>−π – π</small><output id="phaseOut">0</output></label>
        <input id="phase" type="range" min="-3.14159265" max="3.14159265" step="0.01" value="0" />
      </div>
      <div class="ctrl">
        <label for="offset">偏移 D <small>−1 – 1</small><output id="offsetOut">0.00</output></label>
        <input id="offset" type="range" min="-1" max="1" step="0.05" value="0" />
      </div>
      <div class="ctrl">
        <label for="span">显示范围 <small>±<output id="spanOut">2π</output></small><output id="zoomOut">1.00 ×</output></label>
        <input id="span" type="range" min="1" max="12" step="1" value="4" />
      </div>
      <div class="ctrl">
        <label for="speed">扫描速度 <small>0.25 – 4</small><output id="speedOut">1.00</output></label>
        <input id="speed" type="range" min="0.25" max="4" step="0.05" value="1" />
      </div>
      <div class="preset-row">
        <button type="button" data-preset="sin">y = sin x</button>
        <button type="button" data-preset="cos">y = cos x</button>
        <button type="button" data-preset="double">y = sin 2x</button>
        <button type="button" data-preset="half">y = ½·sin(x/2)</button>
        <button type="button" data-preset="lift">y = sin x + 0.5</button>
      </div>
    </section>

    <section class="card">
      <h2>显示选项</h2>
      <div class="checks">
        <label><input id="ckGhost" type="checkbox" checked /> 对照基准 y = sin x</label>
        <label><input id="ckGrid" type="checkbox" checked /> 网格与 π 刻度</label>
        <label><input id="ckFill" type="checkbox" /> 曲线下方填充</label>
        <label><input id="ckZero" type="checkbox" checked /> 标注零点与极值</label>
        <label><input id="ckCircle" type="checkbox" checked /> 联动单位圆</label>
      </div>
    </section>
  </aside>
</main>

<footer>
  <div>键盘：<kbd>空格</kbd> 扫描/暂停 · <kbd>←</kbd><kbd>→</kbd> 步进取点 · <kbd>↑</kbd><kbd>↓</kbd> 调振幅 · <kbd>[</kbd><kbd>]</kbd> 缩放 · <kbd>R</kbd> 复位 · <kbd>T</kbd> 主题</div>
  <div>自检：<code>sin-curve.html?selftest=1</code></div>
</footer>

<section class="card" id="selftest" hidden>
  <h2>页面自检</h2>
  <ul id="selftestList"></ul>
</section>

<script>
'use strict';
/* ============================================================
 * 纯数学内核：只用标准数学、不碰 DOM，可被 tools/ 下的无头脚本抽出来直接测。
 * ============================================================ */
// __CORE_START__
const PI = Math.PI;
const TAU = PI * 2;

/** 曲线方程 y = A·sin(Bx + C) + D */
function curveY(cfg, x) {
  return cfg.A * Math.sin(cfg.B * x + cfg.C) + cfg.D;
}

/** 扫描点的相位角：θ = Bx + C */
function phaseAngle(cfg, x) {
  return cfg.B * x + cfg.C;
}

/** 视角：世界坐标范围 + 画布像素尺寸 + 内边距 */
function makeView(xHalf, yHalf, w, h, pad) {
  return {
    x0: -xHalf, x1: xHalf,
    y0: -yHalf, y1: yHalf,
    w: w, h: h, pad: pad
  };
}

function plotW(v) { return Math.max(1, v.w - 2 * v.pad); }
function plotH(v) { return Math.max(1, v.h - 2 * v.pad); }

/** 世界 -> 像素 */
function toPx(v, x, y) {
  const px = v.pad + (x - v.x0) / (v.x1 - v.x0) * plotW(v);
  const py = v.pad + (v.y1 - y) / (v.y1 - v.y0) * plotH(v);
  return [px, py];
}

/** 像素 -> 世界 */
function toWorld(v, px, py) {
  const x = v.x0 + (px - v.pad) / plotW(v) * (v.x1 - v.x0);
  const y = v.y1 - (py - v.pad) / plotH(v) * (v.y1 - v.y0);
  return [x, y];
}

/** y 轴半高：保证峰值与偏移都能装下 */
function yHalfFor(cfg) {
  return Math.max(1.4, cfg.A + Math.abs(cfg.D) + 0.55);
}

/** 一个完整周期的长度 */
function periodOf(cfg) {
  return TAU / Math.abs(cfg.B);
}

/** 等距采样（按像素密度取点数，避免过采） */
function sampleCurve(cfg, v, n) {
  const count = Math.max(2, Math.floor(n));
  const pts = new Array(count);
  for (let i = 0; i < count; i++) {
    const x = v.x0 + (v.x1 - v.x0) * i / (count - 1);
    pts[i] = { x: x, y: curveY(cfg, x) };
  }
  return pts;
}

/** 区间内的零点：Bx + C = kπ  */
function zeroCrossings(cfg, v) {
  const out = [];
  if (!isFinite(cfg.B) || cfg.B === 0) return out;
  const k0 = Math.ceil((cfg.B * v.x0 + cfg.C) / PI - 0.5);
  const k1 = Math.floor((cfg.B * v.x1 + cfg.C) / PI + 0.5);
  for (let k = k0; k <= k1; k++) {
    const x = (k * PI - cfg.C) / cfg.B;
    if (x >= v.x0 && x <= v.x1) out.push({ x: x, y: cfg.D });
  }
  return out;
}

/** 区间内的极值点：Bx + C = π/2 + kπ */
function extrema(cfg, v) {
  const out = [];
  if (!isFinite(cfg.B) || cfg.B === 0) return out;
  const lo = (cfg.B * v.x0 + cfg.C - PI / 2) / PI;
  const hi = (cfg.B * v.x1 + cfg.C - PI / 2) / PI;
  const k0 = Math.ceil(Math.min(lo, hi) - 1e-9);
  const k1 = Math.floor(Math.max(lo, hi) + 1e-9);
  for (let k = k0; k <= k1; k++) {
    const x = (PI / 2 + k * PI - cfg.C) / cfg.B;
    if (x < v.x0 || x > v.x1) continue;
    out.push({ x: x, y: curveY(cfg, x), max: ((k % 2) + 2) % 2 === 0 });
  }
  return out;
}

/** x 刻度步长（π 的分数），要求相邻刻度至少 minPx 像素 */
function xTickStep(v, minPx) {
  const cands = [PI / 12, PI / 6, PI / 4, PI / 2, PI, TAU];
  const perRad = plotW(v) / (v.x1 - v.x0);
  for (let i = 0; i < cands.length; i++) {
    if (i === cands.length - 1) return cands[i];
    if (cands[i] * perRad >= minPx) return cands[i];
  }
  return cands[cands.length - 1];
}

/** 区间内按 step 排列的刻度值 */
function ticksIn(lo, hi, step) {
  const out = [];
  if (!(step > 0) || !isFinite(lo) || !isFinite(hi)) return out;
  const k0 = Math.ceil(lo / step - 1e-9);
  const k1 = Math.floor(hi / step + 1e-9);
  for (let k = k0; k <= k1; k++) out.push(k * step);
  return out;
}

/** x 与 π 的比值能写成小分数时，返回 [分子, 分母]，否则 null */
function piRatio(r, maxNum) {
  const denoms = [1, 2, 3, 4, 6, 12];
  const limit = maxNum === undefined ? 48 : maxNum;
  const sign = r < 0 ? -1 : 1;
  const a = Math.abs(r);
  for (let d = 0; d < denoms.length; d++) {
    const den = denoms[d];
    const num = Math.round(a * den);
    if (num > limit) continue;
    if (Math.abs(a * den - num) < 1e-7 * Math.max(1, num)) {
      return [sign * num, den];
    }
  }
  return null;
}

/** 把 x 写成 π 的倍数；写不成干净分数时退回小数 */
function formatPi(x, tol) {
  const t = tol === undefined ? 1e-6 : tol;
  if (Math.abs(x) < Math.max(t, 1e-9)) return '0';
  const r = x / PI;
  if (!isFinite(r)) return fmt(x, 2);
  const ratio = piRatio(r, t >= 1e-3 ? 12 : 48);
  if (!ratio) return fmt(x, 2);
  const num = ratio[0], den = ratio[1];
  const sign = num < 0 ? '−' : '';
  const mag = Math.abs(num);
  if (den === 1) return sign + (mag === 1 ? '' : String(mag)) + 'π';
  if (mag === 0) return '0';
  const g = gcd(mag, den);
  const n2 = mag / g, d2 = den / g;
  if (d2 === 1) return sign + (n2 === 1 ? '' : String(n2)) + 'π';
  return sign + (n2 === 1 ? '' : String(n2)) + 'π/' + d2;
}

function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { const t = a % b; a = b; b = t; }
  return a || 1;
}

/** 有向角归一到 [0, 2π) */
function normalizeAngle(a) {
  let t = a % TAU;
  if (t < 0) t += TAU;
  return t;
}

/** 单位圆上的点 */
function circlePoint(theta, r) {
  return { x: r * Math.cos(theta), y: r * Math.sin(theta) };
}

/** 扫描时间 -> x：在显示范围内来回，不跳变 */
function probeXAt(t, v) {
  const span = v.x1 - v.x0;
  const u = normalizeAngle((t / span) * TAU);
  return v.x0 + u / TAU * span;
}

/** 数值格式化：负号用真正的减号，避免字体差异 */
function fmt(n, digits) {
  const d = digits === undefined ? 4 : digits;
  const s = n.toFixed(d);
  return s.charAt(0) === '-' ? '−' + s.slice(1) : s;
}
// __CORE_END__

/* ============================================================
 * UI 层：把内核状态投影到两块画布上，并处理输入。
 * ============================================================ */
// __UI_START__
const DEFAULT_CFG = { A: 1, B: 1, C: 0, D: 0 };

const params = (typeof URLSearchParams === 'function' && typeof location !== 'undefined')
  ? new URLSearchParams(location.search) : { get: function () { return null; } };
function numParam(name, fallback) {
  const raw = params.get(name);
  if (raw === null) return fallback;
  const n = Number(raw);
  return isFinite(n) ? n : fallback;
}
function boolParam(name, fallback) {
  const raw = params.get(name);
  if (raw === null) return fallback;
  return raw !== '0' && raw !== 'false' && raw !== 'off';
}

const state = {
  cfg: {
    A: clampNum(numParam('A', 1), 0.2, 2.4),
    B: clampNum(numParam('B', 1), 0.25, 4),
    C: clampNum(numParam('C', 0), -PI, PI),
    D: clampNum(numParam('D', 0), -1, 1)
  },
  cycles: clampNum(numParam('cycles', 4), 1, 12),   // 显示范围 = ±cycles·π/2
  speed: clampNum(numParam('speed', 1), 0.25, 4),
  t: numParam('t', 0),
  playing: boolParam('auto', false) || boolParam('autoplay', false),
  freeze: boolParam('freeze', false),
  hover: null,          // 鼠标取点（世界 x），优先于扫描点
  opts: {
    ghost: true, grid: true, fill: false, zero: true, circle: true
  },
  size: { plot: { w: 900, h: 420 }, circle: { w: 280, h: 236 } }
};

function clampNum(v, lo, hi) {
  return Math.min(hi, Math.max(lo, v));
}

const $ = function (id) { return document.getElementById(id); };
const els = {
  plot: $('plot'), circle: $('circle'),
  plotWrap: $('plotWrap'), circleBox: $('circleBox'),
  play: $('playBtn'), reset: $('resetBtn'), theme: $('themeBtn'),
  formula: $('formulaText'), period: $('periodText'), range: $('rangeText'),
  outX: $('outX'), outXpi: $('outXpi'), outY: $('outY'),
  outTheta: $('outTheta'), outSpeed: $('outSpeed'),
  amp: $('amp'), freq: $('freq'), phase: $('phase'), offset: $('offset'),
  span: $('span'), speed: $('speed'),
  ampOut: $('ampOut'), freqOut: $('freqOut'), phaseOut: $('phaseOut'),
  offsetOut: $('offsetOut'), spanOut: $('spanOut'), zoomOut: $('zoomOut'),
  speedOut: $('speedOut'),
  ckGhost: $('ckGhost'), ckGrid: $('ckGrid'), ckFill: $('ckFill'),
  ckZero: $('ckZero'), ckCircle: $('ckCircle')
};

const ctxPlot = els.plot.getContext('2d');
const ctxCircle = els.circle.getContext('2d');

/* ---------- 主题 ---------- */
function prefersDark() {
  try {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  } catch (e) { return false; }
}
function setTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  els.theme.textContent = dark ? '☀ 浅色' : '🌙 深色';
}
const forced = params.get('theme');
setTheme(forced === 'dark' ? true : forced === 'light' ? false : prefersDark());

/* ---------- 配色读取 ---------- */
function palette() {
  const cs = getComputedStyle(document.documentElement);
  const get = function (name) { return cs.getPropertyValue(name).trim() || '#888'; };
  return {
    ink: get('--ink'), soft: get('--ink-soft'), grid: get('--grid'),
    gridSoft: get('--grid-soft'), axis: get('--axis'), curve: get('--curve'),
    glow: get('--curve-glow'), ghost: get('--ghost'), accent: get('--accent'),
    probe: get('--probe'), circle: get('--circle'), card: get('--bg2')
  };
}

/* ---------- 画布尺寸（DPI 感知） ---------- */
function fitCanvas(canvas, ctx, box, store) {
  const dpr = (window.devicePixelRatio || 1);
  const rect = (typeof box.getBoundingClientRect === 'function')
    ? box.getBoundingClientRect() : { width: store.w, height: store.h };
  const w = Math.max(80, Math.round(rect.width || store.w));
  const h = Math.max(80, Math.round(rect.height || store.h));
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  store.w = w; store.h = h;
}
function resizeAll() {
  fitCanvas(els.plot, ctxPlot, els.plotWrap, state.size.plot);
  fitCanvas(els.circle, ctxCircle, els.circleBox, state.size.circle);
}

/* ---------- 当前视角 ---------- */
function currentView() {
  const xHalf = state.cycles * PI / 2;
  return makeView(xHalf, yHalfFor(state.cfg), state.size.plot.w, state.size.plot.h, 26);
}
/** 正在展示的点：鼠标取点优先，否则扫描点 */
function activeX(v) {
  if (state.hover !== null && isFinite(state.hover)) {
    return clampNum(state.hover, v.x0, v.x1);
  }
  return probeXAt(state.t, v);
}

/* ---------- 曲线绘制 ---------- */
function drawGrid(v, C) {
  const step = xTickStep(v, 54);
  ctxPlot.lineWidth = 1;
  ctxPlot.strokeStyle = C.gridSoft;
  const xs = ticksIn(v.x0, v.x1, step);
  for (let i = 0; i < xs.length; i++) {
    const p = toPx(v, xs[i], 0);
    ctxPlot.beginPath();
    ctxPlot.moveTo(Math.round(p[0]) + .5, v.pad);
    ctxPlot.lineTo(Math.round(p[0]) + .5, v.h - v.pad);
    ctxPlot.stroke();
  }
  const yStep = (v.y1 - v.y0) > 4.5 ? 1 : 0.5;
  const ys = ticksIn(v.y0, v.y1, yStep);
  for (let i = 0; i < ys.length; i++) {
    const p = toPx(v, 0, ys[i]);
    ctxPlot.beginPath();
    ctxPlot.moveTo(v.pad, Math.round(p[1]) + .5);
    ctxPlot.lineTo(v.w - v.pad, Math.round(p[1]) + .5);
    ctxPlot.stroke();
  }
  return { xs: xs, ys: ys };
}

function drawAxes(v, C, ticks) {
  const origin = toPx(v, 0, 0);
  const ox = clampNum(origin[0], v.pad, v.w - v.pad);
  const oy = clampNum(origin[1], v.pad, v.h - v.pad);
  ctxPlot.strokeStyle = C.axis;
  ctxPlot.lineWidth = 1.4;
  ctxPlot.beginPath();
  ctxPlot.moveTo(v.pad, oy); ctxPlot.lineTo(v.w - v.pad, oy);
  ctxPlot.moveTo(ox, v.pad); ctxPlot.lineTo(ox, v.h - v.pad);
  ctxPlot.stroke();

  ctxPlot.font = '11px "Segoe UI", system-ui, sans-serif';
  ctxPlot.fillStyle = C.soft;
  ctxPlot.textAlign = 'center';
  ctxPlot.textBaseline = 'top';
  for (let i = 0; i < ticks.xs.length; i++) {
    const x = ticks.xs[i];
    if (Math.abs(x) < 1e-9) continue;
    const p = toPx(v, x, 0);
    ctxPlot.beginPath();
    ctxPlot.moveTo(p[0], oy - 3); ctxPlot.lineTo(p[0], oy + 3);
    ctxPlot.stroke();
    ctxPlot.fillText(formatPi(x), p[0], Math.min(oy + 6, v.h - v.pad + 4));
  }
  ctxPlot.textAlign = 'right';
  ctxPlot.textBaseline = 'middle';
  for (let i = 0; i < ticks.ys.length; i++) {
    const y = ticks.ys[i];
    if (Math.abs(y) < 1e-9) continue;
    const p = toPx(v, 0, y);
    ctxPlot.beginPath();
    ctxPlot.moveTo(ox - 3, p[1]); ctxPlot.lineTo(ox + 3, p[1]);
    ctxPlot.stroke();
    ctxPlot.fillText(fmt(y, y % 1 === 0 ? 0 : 1), Math.max(ox - 6, v.pad - 2), p[1]);
  }
  ctxPlot.textAlign = 'left';
  ctxPlot.fillText('x', v.w - v.pad + 4, oy + 1);
  ctxPlot.fillText('y', ox + 5, v.pad - 6);
}

function tracePath(pts, v) {
  ctxPlot.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = toPx(v, pts[i].x, pts[i].y);
    if (i === 0) ctxPlot.moveTo(p[0], p[1]); else ctxPlot.lineTo(p[0], p[1]);
  }
}

function drawCurve(v, C, cfg, n) {
  const pts = sampleCurve(cfg, v, n);
  if (state.opts.fill) {
    const base = toPx(v, 0, cfg.D)[1];
    ctxPlot.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const p = toPx(v, pts[i].x, pts[i].y);
      if (i === 0) ctxPlot.moveTo(p[0], base);
      ctxPlot.lineTo(p[0], p[1]);
    }
    ctxPlot.lineTo(toPx(v, pts[pts.length - 1].x, cfg.D)[0], base);
    ctxPlot.closePath();
    ctxPlot.fillStyle = C.glow;
    ctxPlot.fill();
  }
  const isDefault = cfg.A === 1 && cfg.B === 1 && cfg.C === 0 && cfg.D === 0;
  if (state.opts.ghost && !isDefault) {
    ctxPlot.save();
    ctxPlot.setLineDash([5, 5]);
    ctxPlot.strokeStyle = C.ghost;
    ctxPlot.lineWidth = 1.4;
    tracePath(sampleCurve(DEFAULT_CFG, v, n), v);
    ctxPlot.stroke();
    ctxPlot.restore();
  }
  ctxPlot.strokeStyle = C.curve;
  ctxPlot.lineWidth = 2.6;
  ctxPlot.lineJoin = 'round';
  tracePath(pts, v);
  ctxPlot.stroke();
}

function drawMarkers(v, C) {
  const zs = zeroCrossings(state.cfg, v);
  ctxPlot.fillStyle = C.soft;
  for (let i = 0; i < zs.length; i++) {
    const p = toPx(v, zs[i].x, zs[i].y);
    ctxPlot.beginPath();
    ctxPlot.arc(p[0], p[1], 2.6, 0, TAU);
    ctxPlot.fill();
  }
  const ex = extrema(state.cfg, v);
  ctxPlot.font = '11px "Segoe UI", system-ui, sans-serif';
  ctxPlot.textAlign = 'center';
  for (let i = 0; i < ex.length; i++) {
    const p = toPx(v, ex[i].x, ex[i].y);
    ctxPlot.strokeStyle = C.accent;
    ctxPlot.lineWidth = 1.6;
    ctxPlot.beginPath();
    ctxPlot.arc(p[0], p[1], 4, 0, TAU);
    ctxPlot.stroke();
    ctxPlot.fillStyle = C.accent;
    ctxPlot.textBaseline = ex[i].max ? 'bottom' : 'top';
    ctxPlot.fillText(fmt(ex[i].y, 2), p[0], ex[i].max ? p[1] - 7 : p[1] + 7);
  }
}

function drawProbe(v, C, x) {
  const y = curveY(state.cfg, x);
  const p = toPx(v, x, y);
  const ox = toPx(v, x, 0)[1];
  ctxPlot.save();
  ctxPlot.setLineDash([3, 4]);
  ctxPlot.strokeStyle = C.probe;
  ctxPlot.lineWidth = 1.2;
  ctxPlot.beginPath();
  ctxPlot.moveTo(p[0], clampNum(ox, v.pad, v.h - v.pad));
  ctxPlot.lineTo(p[0], p[1]);
  ctxPlot.lineTo(toPx(v, 0, y)[0], p[1]);
  ctxPlot.stroke();
  ctxPlot.restore();
  ctxPlot.fillStyle = C.probe;
  ctxPlot.beginPath();
  ctxPlot.arc(p[0], p[1], 5, 0, TAU);
  ctxPlot.fill();
  ctxPlot.strokeStyle = C.card;
  ctxPlot.lineWidth = 2;
  ctxPlot.beginPath();
  ctxPlot.arc(p[0], p[1], 5, 0, TAU);
  ctxPlot.stroke();

  const label = '(' + formatPi(x, 1e-3) + ', ' + fmt(y, 2) + ')';
  ctxPlot.font = '12px ui-monospace, Consolas, monospace';
  const tw = ctxPlot.measureText(label).width;
  // 峰值处放标签会压住极值数字，所以点在中线以上时往下画，并让开极值标注
  const above = y >= state.cfg.D;
  const lx = clampNum(p[0] + (above ? 30 : 10), v.pad, v.w - v.pad - tw - 8);
  const ly = above ? clampNum(p[1] + 9, v.pad + 2, v.h - v.pad - 18)
                   : clampNum(p[1] - 22, v.pad + 2, v.h - v.pad - 18);
  ctxPlot.fillStyle = C.glow;
  ctxPlot.fillRect(lx - 4, ly - 2, tw + 8, 16);
  ctxPlot.fillStyle = C.probe;
  ctxPlot.textAlign = 'left';
  ctxPlot.textBaseline = 'top';
  ctxPlot.fillText(label, lx, ly);
}

/* ---------- 单位圆 ---------- */
function drawCircle(C, x) {
  const w = state.size.circle.w, h = state.size.circle.h;
  ctxCircle.clearRect(0, 0, w, h);
  const theta = phaseAngle(state.cfg, x);
  const r = Math.min(w, h) / 2 - 28;
  const cx = w / 2, cy = h / 2;
  const pt = circlePoint(theta, r);

  ctxCircle.strokeStyle = C.grid;
  ctxCircle.lineWidth = 1;
  ctxCircle.beginPath();
  ctxCircle.moveTo(cx - r - 12, cy); ctxCircle.lineTo(cx + r + 12, cy);
  ctxCircle.moveTo(cx, cy - r - 12); ctxCircle.lineTo(cx, cy + r + 12);
  ctxCircle.stroke();

  ctxCircle.strokeStyle = C.circle;
  ctxCircle.lineWidth = 1.8;
  ctxCircle.beginPath();
  ctxCircle.arc(cx, cy, r, 0, TAU);
  ctxCircle.stroke();

  ctxCircle.strokeStyle = C.glow;
  ctxCircle.lineWidth = 10;
  ctxCircle.beginPath();
  ctxCircle.arc(cx, cy, r, 0, -theta, theta > 0);
  ctxCircle.stroke();

  const p = { x: cx + pt.x, y: cy - pt.y };
  ctxCircle.save();
  ctxCircle.setLineDash([3, 3]);
  ctxCircle.strokeStyle = C.soft;
  ctxCircle.lineWidth = 1.2;
  ctxCircle.beginPath();
  ctxCircle.moveTo(p.x, p.y); ctxCircle.lineTo(p.x, cy);
  ctxCircle.stroke();
  ctxCircle.restore();

  ctxCircle.strokeStyle = C.probe;
  ctxCircle.lineWidth = 2.6;
  ctxCircle.beginPath();
  ctxCircle.moveTo(cx, cy); ctxCircle.lineTo(p.x, p.y);
  ctxCircle.stroke();

  // sin 高度：半径上的竖直分量
  ctxCircle.strokeStyle = C.curve;
  ctxCircle.lineWidth = 4;
  ctxCircle.beginPath();
  ctxCircle.moveTo(p.x, cy); ctxCircle.lineTo(p.x, p.y);
  ctxCircle.stroke();

  ctxCircle.fillStyle = C.probe;
  ctxCircle.beginPath();
  ctxCircle.arc(p.x, p.y, 4.5, 0, TAU);
  ctxCircle.fill();

  ctxCircle.font = '11px ui-monospace, Consolas, monospace';
  ctxCircle.textAlign = 'left';
  ctxCircle.textBaseline = 'top';
  ctxCircle.fillStyle = C.soft;
  ctxCircle.fillText('θ = ' + fmt(normalizeAngle(theta), 2) + ' rad (' + fmt(normalizeAngle(theta) * 180 / PI, 1) + '°)', 6, 6);
  ctxCircle.textAlign = 'right';
  ctxCircle.textBaseline = 'bottom';
  ctxCircle.fillText('sin θ = ' + fmt(Math.sin(theta), 4), w - 6, h - 6);
}

/* ---------- 文本面板 ---------- */
function updatePanels(x) {
  const cfg = state.cfg;
  const y = curveY(cfg, x);
  const amp = cfg.A === 1 ? '' : fmt(cfg.A, 2) + '·';
  const inner = (cfg.B === 1 ? 'x' : fmt(cfg.B, 2) + 'x') +
    (cfg.C === 0 ? '' : (cfg.C > 0 ? ' + ' : ' − ') + fmt(Math.abs(cfg.C), 2));
  els.formula.textContent = 'y = ' + amp + 'sin(' + inner + ')' +
    (cfg.D === 0 ? '' : (cfg.D > 0 ? ' + ' : ' − ') + fmt(Math.abs(cfg.D), 2));
  els.period.textContent = formatPi(periodOf(cfg), 1e-3);
  els.range.textContent = '[' + fmt(cfg.D - cfg.A, 2) + ', ' + fmt(cfg.D + cfg.A, 2) + ']';

  els.outX.textContent = fmt(x, 4);
  els.outXpi.textContent = formatPi(x, 1e-3);
  els.outY.textContent = fmt(y, 4);
  els.outTheta.textContent = fmt(normalizeAngle(phaseAngle(cfg, x)) * 180 / PI, 1) + '°';
  els.outSpeed.textContent = fmt(state.speed, 2) + ' ×';

  els.ampOut.textContent = fmt(cfg.A, 2);
  els.freqOut.textContent = fmt(cfg.B, 2);
  els.phaseOut.textContent = fmt(cfg.C, 2);
  els.offsetOut.textContent = fmt(cfg.D, 2);
  els.spanOut.textContent = formatPi(state.cycles * PI / 2, 1e-3);
  els.zoomOut.textContent = fmt(4 / state.cycles, 2) + ' ×';
  els.speedOut.textContent = fmt(state.speed, 2);
}

/* ---------- 主渲染 ---------- */
function render() {
  const C = palette();
  const v = currentView();
  const n = Math.round(plotW(v) / 2) + 1;
  ctxPlot.clearRect(0, 0, v.w, v.h);
  const ticks = state.opts.grid ? drawGrid(v, C) : { xs: ticksIn(v.x0, v.x1, PI / 2), ys: [0] };
  drawAxes(v, C, ticks);
  drawCurve(v, C, state.cfg, n);
  if (state.opts.zero) drawMarkers(v, C);
  const x = activeX(v);
  drawProbe(v, C, x);
  if (state.opts.circle) drawCircle(C, x);
  updatePanels(x);
}

/* ---------- 动画 ---------- */
let last = 0, rafId = 0;
function loop(ts) {
  if (!last) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (state.playing) {
    const v = currentView();
    // 每秒推进 speed × 半个显示范围
    state.t = state.t + dt * state.speed * (v.x1 - v.x0) / PI;
    if (!isFinite(state.t)) state.t = 0;
  }
  render();
  rafId = requestAnimationFrame(loop);
}

/* ---------- 控件绑定 ---------- */
function bindRange(el, apply) {
  el.addEventListener('input', function () { apply(Number(el.value)); render(); });
}
bindRange(els.amp, function (v) { state.cfg.A = clampNum(v, 0.2, 2.4); });
bindRange(els.freq, function (v) { state.cfg.B = clampNum(v, 0.25, 4); });
bindRange(els.phase, function (v) { state.cfg.C = clampNum(v, -PI, PI); });
bindRange(els.offset, function (v) { state.cfg.D = clampNum(v, -1, 1); });
bindRange(els.span, function (v) { state.cycles = clampNum(v, 1, 12); });
bindRange(els.speed, function (v) { state.speed = clampNum(v, 0.25, 4); });

function bindCheck(el, key) {
  el.addEventListener('change', function () { state.opts[key] = !!el.checked; render(); });
}
bindCheck(els.ckGhost, 'ghost');
bindCheck(els.ckGrid, 'grid');
bindCheck(els.ckFill, 'fill');
bindCheck(els.ckZero, 'zero');
bindCheck(els.ckCircle, 'circle');

const PRESETS = {
  sin: { A: 1, B: 1, C: 0, D: 0 },
  cos: { A: 1, B: 1, C: PI / 2, D: 0 },
  double: { A: 1, B: 2, C: 0, D: 0 },
  half: { A: 0.5, B: 0.5, C: 0, D: 0 },
  lift: { A: 1, B: 1, C: 0, D: 0.5 }
};
document.querySelectorAll('.preset-row button').forEach(function (b) {
  b.addEventListener('click', function () {
    const p = PRESETS[b.getAttribute('data-preset')];
    if (!p) return;
    state.cfg = { A: p.A, B: p.B, C: p.C, D: p.D };
    syncInputs();
    render();
  });
});

function syncInputs() {
  els.amp.value = String(state.cfg.A);
  els.freq.value = String(state.cfg.B);
  els.phase.value = String(state.cfg.C);
  els.offset.value = String(state.cfg.D);
  els.span.value = String(state.cycles);
  els.speed.value = String(state.speed);
  els.ckGhost.checked = state.opts.ghost;
  els.ckGrid.checked = state.opts.grid;
  els.ckFill.checked = state.opts.fill;
  els.ckZero.checked = state.opts.zero;
  els.ckCircle.checked = state.opts.circle;
}

function setPlaying(on) {
  state.playing = !!on;
  els.play.textContent = on ? '⏸ 暂停' : '▶ 扫描';
}
els.play.addEventListener('click', function () { setPlaying(!state.playing); });
els.reset.addEventListener('click', function () {
  state.cfg = { A: 1, B: 1, C: 0, D: 0 };
  state.cycles = 4; state.speed = 1; state.t = 0; state.hover = null;
  syncInputs(); setPlaying(false); render();
});
els.theme.addEventListener('click', function () {
  setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  render();
});

/* ---------- 鼠标 / 触摸取点 ---------- */
function pointerWorld(evt) {
  const rect = els.plot.getBoundingClientRect();
  return toWorld(currentView(), (evt.clientX || 0) - rect.left, (evt.clientY || 0) - rect.top);
}
['pointermove', 'pointerdown'].forEach(function (name) {
  els.plot.addEventListener(name, function (evt) {
    state.hover = pointerWorld(evt)[0];
    setPlaying(false);
    if (!state.freeze) render();
  });
});
els.plot.addEventListener('pointerleave', function () { state.hover = null; });

/* ---------- 键盘 ---------- */
document.addEventListener('keydown', function (evt) {
  const k = evt.key;
  if (k === ' ' || k === 'Spacebar') { setPlaying(!state.playing); evt.preventDefault(); }
  else if (k === 'r' || k === 'R') els.reset.click();
  else if (k === 't' || k === 'T') els.theme.click();
  else if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const v = currentView();
    const step = (v.x1 - v.x0) / 120 * (evt.shiftKey ? 6 : 1) * (k === 'ArrowLeft' ? -1 : 1);
    const from = state.hover === null ? activeX(v) : state.hover;
    state.hover = clampNum(from + step, v.x0, v.x1);
    setPlaying(false);
    render();
    evt.preventDefault();
  } else if (k === 'ArrowUp' || k === 'ArrowDown') {
    state.cfg.A = clampNum(state.cfg.A + (k === 'ArrowUp' ? 0.1 : -0.1), 0.2, 2.4);
    syncInputs(); render(); evt.preventDefault();
  } else if (k === '[' || k === ']') {
    state.cycles = clampNum(state.cycles + (k === ']' ? 1 : -1), 1, 12);
    syncInputs(); render();
  }
});

window.addEventListener('resize', function () { resizeAll(); render(); });

/* ---------- 页面内自检：?selftest=1 ---------- */
function runSelfTest() {
  const res = [];
  const add = function (name, ok, detail) { res.push({ name: name, ok: !!ok, detail: detail || '' }); };
  const near = function (a, b) { return Math.abs(a - b) < 1e-9; };
  const cfg = state.cfg;

  add('curveY 基准点', near(curveY(DEFAULT_CFG, PI / 2), 1) && near(curveY(DEFAULT_CFG, -PI / 2), -1));
  add('周期为 2π', near(curveY(DEFAULT_CFG, 1.7) , curveY(DEFAULT_CFG, 1.7 + TAU)));
  add('B=2 周期为 π', near(periodOf({ A: 1, B: 2, C: 0, D: 0 }), PI));
  add('振幅与偏移值域', (() => {
    const c = { A: 2, B: 1, C: 0, D: 0.5 };
    return near(c.D + c.A, 2.5) && near(c.D - c.A, -1.5) && near(curveY(c, PI / 2), 2.5);
  })());
  add('相位 C=π/2 即 cos', near(curveY({ A: 1, B: 1, C: PI / 2, D: 0 }, 0), 1, 1e-9));
  const v = makeView(2 * PI, yHalfFor(cfg), 900, 420, 26);
  const back = toWorld(v, ...toPx(v, 1.234, -0.567));
  add('坐标往返一致', Math.abs(back[0] - 1.234) < 1e-6 && Math.abs(back[1] + 0.567) < 1e-6);
  const pts = sampleCurve(cfg, v, 450);
  add('采样点数与有限性', pts.length === 450 && pts.every(p => isFinite(p.y)));
  add('零点计数', zeroCrossings(DEFAULT_CFG, v).length === 5,
    '在 ±2π 内 ' + zeroCrossings(DEFAULT_CFG, v).length + ' 个');
  add('极值计数', extrema(DEFAULT_CFG, v).length === 4,
    '在 ±2π 内 ' + extrema(DEFAULT_CFG, v).length + ' 个');
  add('formatPi 分数', formatPi(PI / 2) === 'π/2' && formatPi(-TAU) === '−2π' && formatPi(0) === '0',
    formatPi(PI / 2) + ' / ' + formatPi(-TAU));
  add('normalizeAngle 非负', normalizeAngle(-PI / 2) === 3 * PI / 2 && normalizeAngle(TAU) === 0);
  add('单位圆恒等式', (() => {
    const p = circlePoint(0.7, 1);
    return Math.abs(p.x * p.x + p.y * p.y - 1) < 1e-12;
  })());
  add('扫描点不越界', (() => {
    for (const t of [0, 1.5, 40, 9999]) { const x = probeXAt(t, v); if (x < v.x0 - 1e-9 || x > v.x1 + 1e-9) return false; }
    return true;
  })());
  let drawErr = '';
  try { resizeAll(); render(); } catch (e) { drawErr = String((e && e.message) || e); }
  add('绘制无异常', drawErr === '', drawErr);
  add('窄屏不溢出', document.documentElement.scrollWidth <= window.innerWidth + 1,
    document.documentElement.scrollWidth + ' vs ' + window.innerWidth);
  add('控件与状态同步', (() => {
    syncInputs();
    return Number(els.amp.value) === state.cfg.A && Number(els.span.value) === state.cycles;
  })());

  const box = $('selftest');
  const list = $('selftestList');
  box.hidden = false;
  list.textContent = '';
  const failed = res.filter(r => !r.ok).length;
  const head = document.createElement('li');
  head.className = failed ? 'bad' : 'ok';
  head.textContent = (failed ? '✗ ' + failed + ' 项未通过' : '✓ 全部 ' + res.length + ' 项通过') + '（参数：A=' + fmt(cfg.A, 2) + ' B=' + fmt(cfg.B, 2) + ' C=' + fmt(cfg.C, 2) + ' D=' + fmt(cfg.D, 2) + '）';
  list.appendChild(head);
  res.forEach(function (r) {
    const li = document.createElement('li');
    li.className = r.ok ? 'ok' : 'bad';
    li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name + (r.detail ? ' — ' + r.detail : '');
    list.appendChild(li);
  });
  document.title = (failed ? '✗ ' : '✓ ') + 'sin(x) 自检 ' + (res.length - failed) + '/' + res.length;
