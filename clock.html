<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>空间时钟 · Spatial Clock</title>
<style>
  :root {
    --accent: #56d1ff;
    --accent2: #9b6bff;
    --ink: #eaf6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 30%, #101a33 0%, #070b18 55%, #03050c 100%);
    color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- Scene / perspective ---------- */
  #scene {
    position: fixed; inset: 0;
    perspective: 1200px;
    perspective-origin: 50% 42%;
  }
  #world {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform 120ms linear;
    animation: worldBreath 14s ease-in-out infinite;
  }
  @keyframes worldBreath {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -1.2%; }
  }

  /* ---------- Deep-space layers ---------- */
  .nebula {
    position: absolute; inset: -20%;
    background:
      radial-gradient(420px 300px at 22% 30%, rgba(86, 209, 255, .10), transparent 70%),
      radial-gradient(520px 360px at 78% 22%, rgba(155, 107, 255, .10), transparent 70%),
      radial-gradient(600px 420px at 55% 80%, rgba(38, 120, 255, .08), transparent 70%);
    transform: translateZ(-900px);
    filter: blur(2px);
  }
  #stars { position: absolute; inset: -15%; transform: translateZ(-600px); }
  #stars2 { position: absolute; inset: -15%; transform: translateZ(-300px); }

  canvas.starfield { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Perspective floor grid ---------- */
  .floor {
    position: absolute;
    left: 50%; top: 68%;
    width: 2600px; height: 1500px;
    margin-left: -1300px;
    transform: rotateX(78deg) translateZ(-260px);
    transform-origin: 50% 0;
    background:
      repeating-linear-gradient(to right,  rgba(86,209,255,.16) 0 2px, transparent 2px 110px),
      repeating-linear-gradient(to bottom, rgba(86,209,255,.16) 0 2px, transparent 2px 110px);
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 78%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 78%);
    animation: floorRun 6s linear infinite;
    opacity: .8;
  }
  @keyframes floorRun {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 0, 0 110px; }
  }
  .glowline {
    position: absolute; left: 0; right: 0; top: 68%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(86,209,255,.45), transparent);
    transform: translateZ(-250px);
    filter: blur(1px);
  }

  /* ---------- Clock assembly ---------- */
  #clock {
    position: absolute; left: 50%; top: 42%;
    width: min(46vmin, 420px); height: min(46vmin, 420px);
    transform: translate(-50%, -50%) translateZ(0);
    transform-style: preserve-3d;
    transition: transform 120ms linear;
  }
  #clock > .layer {
    position: absolute; inset: 0;
    border-radius: 50%;
    transform-style: preserve-3d;
  }

  /* back halo (deepest) */
  .halo {
    inset: -18%;
    background: radial-gradient(circle at 50% 50%, rgba(86,209,255,.18), rgba(155,107,255,.10) 45%, transparent 70%);
    transform: translateZ(-160px);
    filter: blur(6px);
    animation: haloPulse 5s ease-in-out infinite;
  }
  @keyframes haloPulse { 0%,100% { opacity: .8; } 50% { opacity: 1; } }

  /* outer tick ring */
  .ring {
    border: 2px solid rgba(140, 210, 255, .35);
    box-shadow:
      0 0 24px rgba(86, 209, 255, .25),
      inset 0 0 30px rgba(86, 209, 255, .12);
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.10), transparent 45%),
      radial-gradient(circle at 50% 55%, rgba(10, 18, 40, .78), rgba(4, 8, 20, .92) 75%);
    transform: translateZ(-60px);
    animation: ringFloat 9s ease-in-out infinite;
  }
  @keyframes ringFloat {
    0%,100% { transform: translateZ(-60px) rotate(0deg); }
    50%     { transform: translateZ(-46px) rotate(3deg); }
  }

  .ticks { position: absolute; inset: 0; transform: translateZ(-30px); }
  .tick {
    position: absolute; left: 50%;
    width: 2px; margin-left: -1px;
    background: rgba(160, 215, 255, .55);
    border-radius: 2px;
  }
  .tick.major {
    width: 4px; margin-left: -2px;
    background: linear-gradient(#eaf6ff, #8fd4ff);
    box-shadow: 0 0 8px rgba(86,209,255,.8);
  }

  .numerals { position: absolute; inset: 0; transform: translateZ(-20px); }
  .numeral {
    position: absolute; left: 50%; top: 50%;
    font-size: clamp(12px, 3.2vmin, 20px);
    font-weight: 600; letter-spacing: .06em;
    color: rgba(220, 240, 255, .92);
    text-shadow: 0 0 12px rgba(86,209,255,.6);
  }

  /* inner rotating orbital ring for depth */
  .orbit {
    inset: 12%;
    border: 1px dashed rgba(155, 107, 255, .45);
    transform: translateZ(28px);
    animation: spin 24s linear infinite;
  }
  @keyframes spin { to { rotate: 360deg; } }

  /* hands */
  .hand {
    position: absolute; left: 50%; bottom: 50%;
    transform-origin: 50% 100%;
    border-radius: 999px;
    will-change: transform;
  }
  .hand.hour {
    width: 9px; height: 26%; margin-left: -4.5px;
    background: linear-gradient(#f4fbff, #9ccfff);
    box-shadow: 0 0 14px rgba(156, 207, 255, .8);
    transform: translateZ(55px);
  }
  .hand.minute {
    width: 6px; height: 36%; margin-left: -3px;
    background: linear-gradient(#dff2ff, #56d1ff);
    box-shadow: 0 0 14px rgba(86, 209, 255, .85);
    transform: translateZ(85px);
  }
  .hand.second {
    width: 2.5px; height: 42%; margin-left: -1.25px;
    background: linear-gradient(#ffd9ec, #ff5fa2);
    box-shadow: 0 0 12px rgba(255, 95, 162, .9);
    transform: translateZ(120px);
  }
  .hand .tail {
    position: absolute; left: 50%; top: 100%;
    width: 100%; height: 24%;
    transform: translateX(-50%);
    background: inherit; border-radius: 999px;
    opacity: .85;
  }
  .cap {
    position: absolute; left: 50%; top: 50%;
    width: 16px; height: 16px; margin: -8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #7fb9ef 60%, #2c5a9c);
    box-shadow: 0 0 16px rgba(255,255,255,.7);
    transform: translateZ(130px);
  }

  /* glass highlight on very front */
  .glass {
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.14) 0%, transparent 38%, transparent 62%, rgba(255,255,255,.05) 100%);
    transform: translateZ(150px);
    pointer-events: none;
  }

  /* ---------- Digital panel (further out, floating) ---------- */
  #panel {
    position: absolute; left: 50%; top: 72%;
    transform: translate(-50%, 0) translateZ(40px);
    transition: transform 120ms linear;
    text-align: center;
    padding: 14px 34px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(14,24,48,.72), rgba(6,10,24,.66));
    border: 1px solid rgba(120, 190, 255, .28);
    box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 30px rgba(86,209,255,.10);
    backdrop-filter: blur(8px);
  }
  #digital {
    font-variant-numeric: tabular-nums;
    font-size: clamp(26px, 5.4vmin, 52px);
    font-weight: 700; letter-spacing: .08em;
    background: linear-gradient(90deg, #bfe9ff, #56d1ff, #9b6bff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 0 14px rgba(86,209,255,.35));
  }
  #digital .sec { opacity: .8; }
  #dateline {
    margin-top: 6px;
    font-size: clamp(12px, 1.8vmin, 16px);
    letter-spacing: .35em;
    color: rgba(170, 205, 240, .8);
  }
  #zone {
    margin-top: 4px;
    font-size: clamp(10px, 1.5vmin, 13px);
    letter-spacing: .18em;
    color: rgba(130, 160, 200, .6);
  }

  .title {
    position: fixed; left: 24px; top: 20px; z-index: 5;
    font-size: 13px; letter-spacing: .42em;
    color: rgba(160, 195, 235, .55);
  }
  .hint {
    position: fixed; right: 24px; bottom: 18px; z-index: 5;
    font-size: 12px; letter-spacing: .12em;
    color: rgba(140, 170, 210, .45);
  }

  @media (prefers-reduced-motion: reduce) {
    #world, .ring, .orbit, .halo, .floor { animation: none; }
  }

  @media (max-width: 560px) {
    #panel { padding: 10px 18px; }
    #dateline { letter-spacing: .18em; white-space: nowrap; }
    #zone { letter-spacing: .1em; }
    .numeral { font-size: 11px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <div class="title">SPATIAL&nbsp;CLOCK&nbsp;·&nbsp;空间时钟</div>
  <div class="hint">移动鼠标感受景深 · move the pointer</div>

  <div id="scene">
    <div id="world">
      <div class="nebula"></div>
      <div id="stars"><canvas class="starfield" id="sky1"></canvas></div>
      <div id="stars2"><canvas class="starfield" id="sky2"></canvas></div>
      <div class="floor"></div>
      <div class="glowline"></div>

      <div id="clock">
        <div class="layer halo"></div>
        <div class="layer ring">
          <div class="ticks" id="ticks"></div>
          <div class="numerals" id="numerals"></div>
        </div>
        <div class="layer orbit"></div>
        <div class="hand hour" id="hHour"><span class="tail"></span></div>
        <div class="hand minute" id="hMin"><span class="tail"></span></div>
        <div class="hand second" id="hSec"><span class="tail"></span></div>
        <div class="cap"></div>
        <div class="layer glass"></div>
      </div>

      <div id="panel">
        <div id="digital">--:--<span class="sec">:--</span></div>
        <div id="dateline">----</div>
        <div id="zone"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const clock = $("clock"), world = $("world"), panel = $("panel");

  /* ----- build ticks: each one rotates around the clock centre ----- */
  const ticks = $("ticks");
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const h = major ? 10 : 7;          /* % of clock height */
    const top = major ? 2 : 3;         /* % of clock height */
    const t = document.createElement("div");
    t.className = "tick" + (major ? " major" : "");
    t.style.height = h + "%";
    t.style.top = top + "%";
    /* pivot must sit at the clock centre: distance from tick top to centre,
       expressed as a percentage of the tick's own height */
    t.style.transformOrigin = `50% ${((50 - top) / h) * 100}%`;
    t.style.transform = `rotate(${i * 6}deg) translateZ(${major ? 10 : 0}px)`;
    ticks.appendChild(t);
  }

  /* ----- numerals ----- */
  const numerals = $("numerals");
  const R = () => Math.min(clock.clientWidth, clock.clientHeight) * 0.36;
  for (let n = 1; n <= 12; n++) {
    const el = document.createElement("div");
    el.className = "numeral";
    el.textContent = String(n);
    const a = (n * 30 - 90) * Math.PI / 180;
    el.style.transform =
      `translate(-50%,-50%) translate(${Math.cos(a) * R()}px, ${Math.sin(a) * R()}px) translateZ(-10px)`;
    numerals.appendChild(el);
  }
  window.addEventListener("resize", () => {
    const els = numerals.children;
    for (let n = 1; n <= 12; n++) {
      const a = (n * 30 - 90) * Math.PI / 180;
      els[n - 1].style.transform =
        `translate(-50%,-50%) translate(${Math.cos(a) * R()}px, ${Math.sin(a) * R()}px) translateZ(-10px)`;
    }
  });

  /* ----- star fields at two depths ----- */
  function makeStars(canvasId, count, sizeMax, speed) {
    const c = $(canvasId), ctx = c.getContext("2d");
    let W, H, stars = [];
    function reset() {
      W = c.width = c.offsetWidth * devicePixelRatio;
      H = c.height = c.offsetHeight * devicePixelRatio;
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: (Math.random() * sizeMax + .4) * devicePixelRatio,
        p: Math.random() * Math.PI * 2,
        w: .5 + Math.random() * 1.5
      }));
    }
    reset();
    window.addEventListener("resize", reset);
    return (t) => {
      ctx.clearRect(0, 0, W, H);
      for (const s of stars) {
        const tw = .35 + .65 * Math.abs(Math.sin(t * .001 * s.w + s.p));
        ctx.globalAlpha = tw;
        ctx.fillStyle = tw > .85 ? "#cfeaff" : "#8fb8e8";
        ctx.beginPath();
        ctx.arc(s.x, (s.y + t * speed * .02) % H, s.r, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };
  }
  const draw1 = makeStars("sky1", 140, 1.1, .3);
  const draw2 = makeStars("sky2", 90, 1.8, .9);

  /* ----- pointer parallax (depth cue) ----- */
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener("pointermove", (e) => {
    tx = (e.clientX / innerWidth - .5) * 2;   /* -1..1 */
    ty = (e.clientY / innerHeight - .5) * 2;
  });
  addEventListener("pointerleave", () => { tx = 0; ty = 0; });

  /* ----- hands + digital, driven by rAF with sub-second smoothing ----- */
  const HOUR = $("hHour"), MIN = $("hMin"), SEC = $("hSec");
  const WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  const digital = $("digital"), dateline = $("dateline"), zone = $("zone");
  zone.textContent = "GMT" + (-new Date().getTimezoneOffset() / 60 >= 0 ? "+" : "")
    + (-new Date().getTimezoneOffset() / 60).toFixed(0)
    + " · " + (Intl.DateTimeFormat().resolvedOptions().timeZone || "local");

  const pad = (n) => String(n).padStart(2, "0");

  function frame(ts) {
    const now = new Date();
    const ms = now.getMilliseconds() + (ts % 16);   /* keeps sweep alive between ticks */
    const s = now.getSeconds() + ms / 1000;
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;

    SEC.style.transform  = `translateZ(120px) rotate(${s * 6}deg)`;
    MIN.style.transform  = `translateZ(85px) rotate(${m * 6}deg)`;
    HOUR.style.transform = `translateZ(55px) rotate(${h * 30}deg)`;

    digital.innerHTML = `${pad(now.getHours())}:${pad(now.getMinutes())}<span class="sec">:${pad(now.getSeconds())}</span>`;
    dateline.textContent = `${now.getFullYear()} / ${pad(now.getMonth() + 1)} / ${pad(now.getDate())} · ${WEEK[now.getDay()]}`;

    /* ease parallax */
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    const rx = -cy * 10, ry = cx * 14;
    clock.style.transform =
      `translate(-50%,-50%) rotateX(${rx}deg) rotateY(${ry}deg)`;
    panel.style.transform =
      `translate(-50%,0) translateZ(40px) rotateX(${rx * .6}deg) rotateY(${ry * .6}deg)`;
    world.style.transform =
      `rotateX(${-cy * 3}deg) rotateY(${cx * 4}deg)`;

    draw1(ts); draw2(ts);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
